<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>D'coratto | Portfolio HTML</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root {
        --bg: #080807;
        --panel: #11100e;
        --line: rgba(184, 151, 106, .18);
        --gold: #b8976a;
        --gold-soft: #d7c2a7;
        --muted: #8a8070;
        --text: #f7f2ea;
        --danger: #ff6a55;
      }

      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Montserrat', sans-serif;
        font-weight: 300;
      }

      body.lightbox-open { overflow: hidden; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 84px;
        border-bottom: 1px solid var(--line);
        background: rgba(8, 8, 7, .96);
        padding: 0 72px;
        backdrop-filter: blur(12px);
      }

      .logo {
        font-size: 33px;
        font-weight: 300;
        letter-spacing: -.04em;
        line-height: .9;
      }

      .logo small {
        display: block;
        margin-left: 69px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: .02em;
      }

      .logo img {
        max-width: 190px;
        max-height: 58px;
        object-fit: contain;
        display: block;
      }

      .nav {
        display: flex;
        gap: 30px;
        align-items: center;
      }

      .nav a {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: .22em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .nav a:hover { color: var(--gold-soft); }

      .cover {
        display: grid;
        place-items: center;
        min-height: calc(100vh - 84px);
        border-bottom: 1px solid var(--line);
        padding: 72px 28px;
        text-align: center;
      }

      .cover::before {
        content: "";
        width: 1px;
        height: 98px;
        margin-bottom: 58px;
        background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      }

      .cover-kicker {
        color: var(--gold);
        font-size: 12px;
        letter-spacing: .34em;
        margin-bottom: 38px;
        text-transform: uppercase;
      }

      .cover h1 {
        margin: 0;
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(66px, 8vw, 126px);
        font-weight: 300;
        line-height: .9;
      }

      .cover-address {
        margin-top: 28px;
        color: var(--gold);
        font-size: 12px;
        letter-spacing: .24em;
        text-transform: uppercase;
      }

      .cover-brand {
        margin-top: 14px;
        color: rgba(247, 242, 234, .48);
        font-size: 12px;
        letter-spacing: .18em;
      }

      .cover-stats {
        display: inline-grid;
        grid-template-columns: repeat(2, minmax(112px, 1fr));
        gap: 0;
        margin-top: 68px;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }

      .cover-stat {
        padding: 10px 48px;
      }

      .cover-stat + .cover-stat {
        border-left: 1px solid var(--line);
      }

      .cover-stat strong {
        display: block;
        color: var(--gold-soft);
        font-family: 'Cormorant Garamond', serif;
        font-size: 40px;
        font-weight: 300;
        line-height: 1;
      }

      .cover-stat span {
        display: block;
        margin-top: 12px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: .28em;
        text-transform: uppercase;
      }

      .environment {
        min-height: calc(100vh - 84px);
        padding: 34px 60px 76px;
      }

      .environment-page {
        min-height: calc(100vh - 84px);
        padding: 42px 54px 58px;
        border-top: 1px solid var(--line);
        background: #f7f4ee;
        color: #111;
      }

      .page-fixed-title {
        text-align: center;
        margin-bottom: 18px;
      }

      .page-fixed-title strong {
        display: block;
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(34px, 4.8vw, 68px);
        font-weight: 300;
        font-style: italic;
        line-height: .9;
        text-transform: none;
      }

      .page-fixed-title span {
        display: block;
        margin-top: 4px;
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(28px, 4vw, 58px);
        font-weight: 300;
        letter-spacing: .03em;
        text-transform: uppercase;
      }

      .page-description {
        max-width: 760px;
        margin: 0 auto 24px;
        color: #4a4034;
        font-family: Georgia, serif;
        font-size: 18px;
        line-height: 1.55;
        text-align: center;
      }

      .page-frames {
        position: relative;
        min-height: 720px;
        display: block;
      }

      .doc-photo-frame {
        position: relative;
        width: 46%;
        height: 330px;
        min-height: 330px;
        background: transparent;
        overflow: visible;
        border: 0;
        padding: 0;
        color: #111;
        cursor: default;
      }

      .doc-photo-frame.is-positioned {
        position: absolute;
        min-height: 0;
        touch-action: none;
      }

      .environment-page.editable .doc-photo-frame {
        outline: 1px dashed rgba(17, 17, 17, .20);
        outline-offset: 2px;
        cursor: move;
      }

      .environment-page.editable .doc-photo-frame:hover,
      .environment-page.editable .doc-photo-frame.is-selected {
        outline: 2px solid #7c46ff;
        outline-offset: 0;
      }

      .doc-photo-frame.shape-circle {
        min-height: 0;
      }

      .doc-photo-frame.shape-square {
        min-height: 0;
      }

      .doc-photo-frame.shape-rounded .frame-clip {
        border-radius: 28px;
      }

      .doc-photo-frame.shape-rectangle .frame-clip,
      .doc-photo-frame.shape-square .frame-clip {
        border-radius: 0;
      }

      .doc-photo-frame.shape-circle .frame-clip {
        border-radius: 50%;
      }

      .frame-clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #e9e3d8;
        box-shadow: 0 24px 60px rgba(30, 20, 10, .12);
      }

      .doc-photo-frame img {
        width: 100%;
        height: 100%;
        min-height: inherit;
        object-fit: cover;
        display: block;
        transform-origin: center;
        user-select: none;
      }

      .environment-page.editable .doc-photo-frame.is-editing-image img {
        cursor: grab;
      }

      .photo-card img {
        -webkit-user-drag: element;
      }

      .drop-hint {
        position: absolute;
        inset: 14px;
        z-index: 6;
        display: none;
        place-items: center;
        border: 1px dashed rgba(17,17,17,.35);
        color: #111;
        background: rgba(247,244,238,.74);
        font-size: 10px;
        letter-spacing: .18em;
        text-transform: uppercase;
        pointer-events: none;
      }

      .environment-page.editable .doc-photo-frame.drag-over .drop-hint {
        display: grid;
      }

      .doc-frame-empty {
        display: grid;
        place-items: center;
        min-height: inherit;
        color: #8c806f;
        font-size: 12px;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      .doc-frame-title {
        position: absolute;
        left: 18px;
        bottom: 15px;
        z-index: 2;
        color: rgba(17,17,17,.58);
        font-size: 10px;
        letter-spacing: .14em;
        text-transform: uppercase;
      }

      .doc-annotation-layer {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .page-annotation-layer {
        position: absolute;
        inset: 0;
        z-index: 30;
        pointer-events: none;
      }

      .page-annotation-line {
        stroke: var(--arrow-color, #111);
        stroke-width: var(--arrow-width, 3);
      }

      .page-annotation-text {
        position: absolute;
        z-index: 31;
        min-width: 120px;
        max-width: 260px;
        color: var(--text-color, #111);
        font-family: Georgia, serif;
        font-size: var(--text-size, 18px);
        line-height: 1.25;
        outline: 0;
        pointer-events: auto;
        text-shadow: 0 1px 0 rgba(255,255,255,.75);
        transform: translate(-6px, -50%);
      }

      .page-frames.arrow-draw-mode {
        cursor: crosshair;
      }

      .page-frames.arrow-draw-mode::after {
        content: "Clique e arraste para criar a seta";
        position: absolute;
        left: 50%;
        top: 10px;
        z-index: 40;
        transform: translateX(-50%);
        border-radius: 999px;
        background: rgba(17,17,17,.82);
        color: #fff;
        padding: 8px 12px;
        font-size: 10px;
        letter-spacing: .14em;
        text-transform: uppercase;
        pointer-events: none;
      }

      .doc-annotation-line {
        stroke: var(--arrow-color, #111);
        stroke-width: var(--arrow-width, 2);
        marker-end: url(#docArrowHead);
      }

      .doc-annotation-text {
        position: absolute;
        z-index: 4;
        max-width: 210px;
        color: #111;
        color: var(--text-color, #111);
        font-family: Georgia, serif;
        font-size: var(--text-size, 17px);
        line-height: 1.25;
        text-shadow: 0 1px 0 rgba(255,255,255,.75);
      }

      .environment-page .doc-annotation-text[data-drag-annotation] {
        cursor: move;
      }

      .frame-arrow-target {
        position: absolute;
        z-index: 5;
        width: 14px;
        height: 14px;
        border: 2px solid #111;
        border-radius: 50%;
        background: #f7f4ee;
        transform: translate(-50%, -50%);
        cursor: grab;
      }

      .preview-frame-tools {
        position: absolute;
        top: -92px;
        right: 0;
        z-index: 10;
        display: none;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
      }

      .environment-page.editable .doc-photo-frame.is-selected .preview-frame-tools {
        display: flex;
      }

      .preview-frame-tools button,
      .preview-frame-tools label,
      .shape-select {
        border: 1px solid rgba(17,17,17,.22);
        background: rgba(247,244,238,.9);
        color: #111;
        padding: 7px 9px;
        font-family: 'Montserrat', sans-serif;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: .12em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .frame-resize-handle {
        position: absolute;
        z-index: 12;
        width: 12px;
        height: 12px;
        border: 2px solid #7c46ff;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,.16);
        display: none;
      }

      .environment-page.editable .doc-photo-frame.is-selected .frame-resize-handle {
        display: block;
      }

      .frame-resize-handle[data-resize-frame="nw"] { left: -7px; top: -7px; cursor: nwse-resize; }
      .frame-resize-handle[data-resize-frame="n"] { left: 50%; top: -7px; transform: translateX(-50%); cursor: ns-resize; }
      .frame-resize-handle[data-resize-frame="ne"] { right: -7px; top: -7px; cursor: nesw-resize; }
      .frame-resize-handle[data-resize-frame="e"] { right: -7px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
      .frame-resize-handle[data-resize-frame="se"] { right: -7px; bottom: -7px; cursor: nwse-resize; }
      .frame-resize-handle[data-resize-frame="s"] { left: 50%; bottom: -7px; transform: translateX(-50%); cursor: ns-resize; }
      .frame-resize-handle[data-resize-frame="sw"] { left: -7px; bottom: -7px; cursor: nesw-resize; }
      .frame-resize-handle[data-resize-frame="w"] { left: -7px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }

      .frame-selection-toolbar {
        position: absolute;
        left: 50%;
        top: -48px;
        z-index: 18;
        display: none;
        align-items: center;
        gap: 6px;
        padding: 6px;
        border: 1px solid rgba(17,17,17,.14);
        border-radius: 999px;
        background: rgba(255,255,255,.96);
        box-shadow: 0 10px 30px rgba(0,0,0,.16);
        transform: translateX(-50%);
        white-space: nowrap;
      }

      .environment-page.editable .doc-photo-frame.is-selected .frame-selection-toolbar {
        display: flex;
      }

      .frame-selection-toolbar button,
      .frame-selection-toolbar label {
        border: 0;
        background: transparent;
        color: #111;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .frame-selection-toolbar input[type="range"] {
        width: 88px;
      }

      .frame-context-menu {
        position: fixed;
        z-index: 999;
        min-width: 260px;
        display: none;
        overflow: hidden;
        border: 1px solid rgba(17,17,17,.12);
        border-radius: 14px;
        background: rgba(255,255,255,.98);
        box-shadow: 0 18px 60px rgba(0,0,0,.18);
        color: #2a2a2a;
        font-family: 'Montserrat', sans-serif;
      }

      .frame-context-menu.active { display: block; }

      .frame-context-menu button {
        width: 100%;
        display: grid;
        grid-template-columns: 28px 1fr auto;
        align-items: center;
        gap: 8px;
        border: 0;
        background: transparent;
        color: inherit;
        padding: 12px 14px;
        text-align: left;
        font-size: 13px;
        cursor: pointer;
      }

      .frame-context-menu button:hover { background: #f1f1f4; }
      .frame-context-menu kbd {
        border-radius: 5px;
        background: #f0f0f2;
        color: #666;
        padding: 3px 6px;
        font-size: 11px;
        font-family: inherit;
      }

      .preview-frame-tools input[type="file"] { display: none; }

      .annotation-edit-row {
        position: absolute;
        left: 12px;
        bottom: 12px;
        right: 12px;
        z-index: 11;
        display: flex;
        gap: 6px;
      }

      .annotation-edit-row input {
        flex: 1;
        border: 1px solid rgba(17,17,17,.22);
        background: rgba(247,244,238,.92);
        color: #111;
        padding: 8px;
        font-size: 12px;
      }

      .annotation-edit-row input[type="color"],
      .annotation-edit-row input[type="number"] {
        flex: 0 0 44px;
        min-width: 0;
        padding: 4px;
      }

      .section-heading {
        display: grid;
        grid-template-columns: 32px minmax(240px, auto) 1fr;
        align-items: center;
        gap: 28px;
        margin-bottom: 42px;
      }

      .section-number {
        color: var(--gold);
        font-family: 'Cormorant Garamond', serif;
        font-size: 15px;
        letter-spacing: .12em;
      }

      .section-heading h2 {
        margin: 0;
        font-family: 'Cormorant Garamond', serif;
        font-size: 52px;
        font-weight: 300;
        line-height: 1;
      }

      .section-line {
        height: 1px;
        background: var(--line);
      }

      .portfolio-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 274px;
        gap: 28px;
        align-items: stretch;
      }

      .photo-mural {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-auto-rows: 156px;
        grid-auto-flow: dense;
        gap: 5px;
        min-height: 604px;
      }

      .tile-full { grid-column: span 12; grid-row: span 4; }
      .tile-half { grid-column: span 6; grid-row: span 4; }
      .tile-third { grid-column: span 4; grid-row: span 3; }
      .tile-wide { grid-column: span 8; grid-row: span 3; }
      .tile-small { grid-column: span 4; grid-row: span 3; }
      .tile-hero { grid-column: span 8; grid-row: span 4; }
      .tile-tall { grid-column: span 4; grid-row: span 4; }

      .photo-card {
        position: relative;
        min-height: 286px;
        overflow: hidden;
        border: 0;
        background: #15120f;
        padding: 0;
        color: inherit;
        cursor: zoom-in;
      }

      .photo-card img {
        width: 100%;
        height: 100%;
        min-height: inherit;
        display: block;
        object-fit: cover;
        transform-origin: center;
        transition: transform .75s cubic-bezier(.2, .7, .2, 1), filter .75s ease;
      }

      .photo-card:hover img {
        transform: scale(1.045) translateY(-4px);
        filter: brightness(.9);
      }

      .photo-label {
        position: absolute;
        left: 24px;
        bottom: 19px;
        color: rgba(247, 242, 234, .48);
        font-size: 10px;
        letter-spacing: .24em;
        opacity: .75;
        transform: translateY(8px);
        transition: opacity .45s ease, transform .45s ease;
        text-transform: uppercase;
      }

      .photo-card:hover .photo-label {
        opacity: 1;
        transform: translateY(0);
      }

      .photo-index {
        position: absolute;
        top: 18px;
        left: 20px;
        color: var(--gold-soft);
        font-size: 10px;
        letter-spacing: .2em;
      }

      .info-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 604px;
        background: var(--panel);
        padding: 42px 30px;
      }

      .spec-group + .spec-group {
        margin-top: 20px;
      }

      .spec-title {
        display: block;
        margin-bottom: 8px;
        color: var(--gold);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: .28em;
        text-transform: uppercase;
      }

      .spec-value {
        color: var(--text);
        font-size: 15px;
        line-height: 1.35;
      }

      .colors {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      .color-item {
        display: grid;
        justify-items: center;
        gap: 8px;
        width: 62px;
      }

      .color-dot {
        width: 58px;
        height: 58px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, .12);
        background-size: cover;
        background-position: center;
      }

      .color-name {
        color: var(--muted);
        font-size: 10px;
        line-height: 1.15;
        letter-spacing: .12em;
        text-align: center;
        text-transform: uppercase;
      }

      .notes {
        margin-top: 28px;
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }

      .notes p {
        margin: 0 0 5px;
        color: var(--danger);
        font-size: 12px;
        line-height: 1.35;
      }

      .client-footer {
        margin-top: 18px;
        color: rgba(138, 128, 112, .75);
        font-size: 9px;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      .mural-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin: -22px 0 18px;
        padding-left: 60px;
      }

      .layout-suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .layout-suggestions button,
      .photo-upload {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(17, 16, 14, .8);
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: .16em;
        padding: 8px 11px;
        text-transform: uppercase;
      }

      .layout-suggestions button.active,
      .layout-suggestions button:hover,
      .photo-upload:hover {
        border-color: rgba(184, 151, 106, .55);
        color: var(--gold-soft);
      }

      .photo-upload input { display: none; }

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, .88);
        padding: 36px;
      }

      .lightbox.active { display: flex; }

      .lightbox img {
        max-width: 94vw;
        max-height: 88vh;
        object-fit: contain;
        box-shadow: 0 30px 90px rgba(0, 0, 0, .55);
      }

      .lightbox button {
        position: absolute;
        top: 22px;
        right: 28px;
        border: 1px solid rgba(255, 255, 255, .25);
        background: rgba(0, 0, 0, .35);
        color: var(--text);
        width: 42px;
        height: 42px;
        border-radius: 50%;
        font-size: 26px;
        line-height: 1;
        cursor: pointer;
      }

      @media (max-width: 1100px) {
        .topbar { padding: 0 24px; }
        .nav { display: none; }
        .cover { min-height: calc(100vh - 84px); }
        .environment { padding: 30px 24px 58px; }
        .portfolio-layout { grid-template-columns: 1fr; }
        .info-panel { min-height: auto; }
      }

      @media (max-width: 760px) {
        .section-heading {
          grid-template-columns: 28px 1fr;
          gap: 16px;
        }

        .section-line { grid-column: 1 / -1; }
        .section-heading h2 { font-size: 42px; }
        .mural-tools { padding-left: 0; align-items: flex-start; flex-direction: column; }
        .photo-mural { grid-template-columns: 1fr; grid-auto-rows: auto; }
        .tile-full, .tile-half, .tile-third, .tile-wide, .tile-small, .tile-hero, .tile-tall {
          grid-column: auto;
          grid-row: auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="logo" id="documentLogo">D'coratto<small>sob medida</small></div>
      <nav class="nav" id="nav"></nav>
    </header>

    <main id="document"></main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
      <button type="button" aria-label="Fechar imagem expandida">×</button>
      <img alt="" />
    </div>

    <script>
      const fallbackImage = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#2b241d"/>
              <stop offset=".55" stop-color="#5c4630"/>
              <stop offset="1" stop-color="#14110e"/>
            </linearGradient>
          </defs>
          <rect width="1200" height="800" fill="url(#g)"/>
          <rect x="120" y="120" width="960" height="560" fill="none" stroke="#b8976a" stroke-opacity=".35"/>
          <text x="600" y="390" fill="#d7c2a7" font-family="Arial" font-size="34" text-anchor="middle" letter-spacing="8">D'CORATTO</text>
          <text x="600" y="438" fill="#8a8070" font-family="Arial" font-size="16" text-anchor="middle" letter-spacing="5">IMAGEM DO AMBIENTE</text>
        </svg>
      `);

      const storageKey = 'dcoratto.portfolio.document.v1';
      const isEditablePreview = new URLSearchParams(window.location.search).has('preview');
      let documentData = JSON.parse(localStorage.getItem(storageKey) || 'null') || {
        client: {
          name: 'CLIENTE MODELO',
          address: '',
        },
        environments: [
          {
            number: '04',
            title: 'Escritorio',
            specs: {
              tamponamentos: '15 e 25mm',
              portas: 'LISA',
              puxadores: 'PASSANTE',
            },
            colors: [],
            notes: ['Apenas Marcenaria considerado no Projeto', 'Leds nao inclusos'],
            layout: 'balanced',
            photos: [
              { title: 'Vista 1', src: fallbackImage },
              { title: 'Vista 2', src: fallbackImage },
              { title: 'Detalhe 1', src: fallbackImage },
              { title: 'Detalhe 2', src: fallbackImage },
            ],
          },
          {
            number: '05',
            title: 'Sala de TV',
            specs: {
              tamponamentos: '15mm',
              portas: 'LISA',
              puxadores: 'CAVA 45°',
            },
            colors: [],
            notes: ['Apenas Marcenaria considerado no Projeto'],
            layout: 'balanced',
            photos: [
              { title: 'Painel TV', src: fallbackImage },
              { title: 'Painel Sofa', src: fallbackImage },
            ],
          },
        ],
      };

      documentData = normalizeDocumentData(documentData);
      const selectedFrameKeys = new Set();
      let frameClipboard = [];
      let arrowDrawMode = null;

      const nav = document.getElementById('nav');
      const root = document.getElementById('document');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = lightbox.querySelector('img');

      renderDocument();

      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox || event.target.tagName === 'BUTTON') closeLightbox();
      });

      document.addEventListener('keydown', (event) => {
        const target = event.target;
        if (target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName)) return;
        if (event.key === 'Escape') {
          closeLightbox();
          clearFrameSelection();
          closeFrameContextMenu();
        }
        if ((event.key === 'Delete' || event.key === 'Backspace') && isEditablePreview && selectedFrameKeys.size) {
          event.preventDefault();
          deleteSelectedFrames();
        }
        if (!isEditablePreview) return;
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'c') {
          event.preventDefault();
          copySelectedFrames();
        }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'v') {
          event.preventDefault();
          pasteCopiedFrames();
        }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'd') {
          event.preventDefault();
          duplicateSelectedFrames();
        }
      });

      document.addEventListener('click', (event) => {
        if (!event.target.closest('.frame-context-menu, [data-open-frame-menu]')) closeFrameContextMenu();
      });

      window.addEventListener('storage', (event) => {
        if (event.key === storageKey) {
          documentData = normalizeDocumentData(JSON.parse(event.newValue || 'null'));
          renderDocument();
        }
      });

      function normalizeDocumentData(raw) {
        const legacySample = raw?.client?.name === 'Marcos Vinicius'
          && String(raw?.client?.address || '').includes('Eco Park');

        if (!raw || legacySample) {
          return {
            projectType: 'Projeto Inicial',
            year: new Date().getFullYear(),
            branding: { logo: '', companyName: "D'Coratto Sob Medida" },
            client: { name: 'CLIENTE MODELO', address: '', contractNumber: '', manufacturers: [] },
            environments: [],
          };
        }

        return {
          projectType: raw.projectType || 'Projeto Inicial',
          year: raw.year || new Date().getFullYear(),
          branding: {
            logo: raw.branding?.logo || '',
            companyName: raw.branding?.companyName || "D'Coratto Sob Medida",
          },
          client: {
            name: raw.client?.name || 'CLIENTE MODELO',
            address: raw.client?.address || '',
            contractNumber: raw.client?.contractNumber || '',
            manufacturers: raw.client?.manufacturers || [],
          },
          environments: (raw.environments || []).filter(environment => environment && environment.title),
        };
      }

      function renderDocument() {
        renderLogo();
        nav.innerHTML = documentData.environments.map((environment) => `
          <a href="#${slug(environment.title)}">${environment.title}</a>
        `).join('');

        root.innerHTML = `
          ${renderCover()}
          ${documentData.environments.map(renderEnvironment).join('')}
        `;

        bindDocumentEvents();
      }

      function renderLogo() {
        const logo = document.getElementById('documentLogo');
        if (!logo) return;
        if (documentData.branding?.logo) {
          logo.innerHTML = `<img src="${escapeAttribute(documentData.branding.logo)}" alt="D'Coratto Sob Medida">`;
        } else {
          logo.innerHTML = "D'coratto<small>sob medida</small>";
        }
      }

      function renderCover() {
        const environmentsCount = documentData.environments.length;
        const photosCount = documentData.environments.reduce((total, environment) => {
          const pagePhotos = (environment.pages || []).reduce((sum, page) => sum + normalizePhotos(page.photos).length, 0);
          return total + normalizePhotos(environment.photos).length + pagePhotos;
        }, 0);

        return `
          <section class="cover">
            <div>
              <div class="cover-kicker">${escapeHTML(documentData.projectType)} - ${escapeHTML(documentData.year)}</div>
              <h1>${escapeHTML(documentData.client.name || 'CLIENTE MODELO')}</h1>
              <div class="cover-address">${escapeHTML(documentData.client.address || '')}</div>
              <div class="cover-brand">${escapeHTML(documentData.branding?.companyName || "D'Coratto Sob Medida")}</div>
              <div class="cover-stats">
                <div class="cover-stat">
                  <strong>${String(environmentsCount).padStart(2, '0')}</strong>
                  <span>Ambientes</span>
                </div>
                <div class="cover-stat">
                  <strong>${String(photosCount).padStart(2, '0')}</strong>
                  <span>Fotos</span>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function bindDocumentEvents() {
        applyFrameSelectionClasses();

        document.querySelectorAll('[data-lightbox-src]').forEach((button) => {
          button.addEventListener('click', () => {
            lightboxImage.src = button.dataset.lightboxSrc;
            lightboxImage.alt = button.dataset.lightboxTitle || '';
            lightbox.classList.add('active');
            document.body.classList.add('lightbox-open');
          });
        });

        document.querySelectorAll('[data-layout]').forEach((button) => {
          button.addEventListener('click', () => {
            const environment = documentData.environments[Number(button.dataset.environmentIndex)];
            environment.layout = button.dataset.layout;
            persistAndRender();
          });
        });

        document.querySelectorAll('[data-photo-input]').forEach((input) => {
          input.addEventListener('change', async () => {
            const environment = documentData.environments[Number(input.dataset.environmentIndex)];
            const files = Array.from(input.files || []);
            const photos = await Promise.all(files.map((file, offset) => readPhoto(file, environment.photos.length + offset)));
            environment.photos.push(...photos);
            environment.layout = suggestDefaultLayout(environment.photos.length);
            persistAndRender();
          });
        });

        document.querySelectorAll('[data-photo-src]').forEach((node) => {
          node.addEventListener('dragstart', (event) => {
            event.dataTransfer?.setData('text/dcoratto-photo', node.dataset.photoSrc || '');
            event.dataTransfer?.setData('text/plain', node.dataset.photoSrc || '');
          });
        });

        document.querySelectorAll('[data-frame-photo-input]').forEach((input) => {
          input.addEventListener('change', async () => {
            const { environmentIndex, pageIndex, frameIndex } = input.dataset;
            const frame = pageFrame(Number(environmentIndex), Number(pageIndex), Number(frameIndex));
            const file = input.files?.[0];
            if (!frame || !file) return;
            const photo = await readPhoto(file, 0);
            frame.photo = photo.src;
            persistAndRender();
          });
        });

        document.querySelectorAll('[data-frame-shape]').forEach((select) => {
          select.addEventListener('change', () => {
            const frame = pageFrame(Number(select.dataset.environmentIndex), Number(select.dataset.pageIndex), Number(select.dataset.frameIndex));
            if (!frame) return;
            frame.shape = select.value;
            persistAndRender();
          });
        });

        document.querySelectorAll('[data-delete-frame]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            const frame = pageFrame(Number(button.dataset.environmentIndex), Number(button.dataset.pageIndex), Number(button.dataset.frameIndex));
            if (!frame) return;
            selectSingleFrame(frameKey(button.dataset.environmentIndex, button.dataset.pageIndex, button.dataset.frameIndex));
            deleteSelectedFrames();
          });
        });

        document.querySelectorAll('[data-copy-frame]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            ensureFrameButtonSelection(button);
            copySelectedFrames();
          });
        });

        document.querySelectorAll('[data-paste-frame]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            ensureFrameButtonSelection(button);
            pasteCopiedFrames();
          });
        });

        document.querySelectorAll('[data-duplicate-frame]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            ensureFrameButtonSelection(button);
            duplicateSelectedFrames();
          });
        });

        document.querySelectorAll('[data-open-frame-menu]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            ensureFrameButtonSelection(button);
            openFrameContextMenu(button);
          });
        });

        document.querySelectorAll('[data-edit-image]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            const frame = pageFrame(Number(button.dataset.environmentIndex), Number(button.dataset.pageIndex), Number(button.dataset.frameIndex));
            if (!frame) return;
            frame.editImage = !frame.editImage;
            persistAndRender();
          });
        });

        document.querySelectorAll('[data-image-zoom]').forEach((input) => {
          input.addEventListener('input', () => {
            const frame = pageFrame(Number(input.dataset.environmentIndex), Number(input.dataset.pageIndex), Number(input.dataset.frameIndex));
            if (!frame) return;
            frame.imgScale = Number(input.value);
            updateFrameImageTransform(input.closest('.doc-photo-frame'), frame);
            persistWithoutRender();
          });
        });

        document.querySelectorAll('[data-add-frame]').forEach((button) => {
          button.addEventListener('click', () => {
            const page = environmentPage(Number(button.dataset.environmentIndex), Number(button.dataset.pageIndex));
            if (!page) return;
            page.frames = Array.isArray(page.frames) ? page.frames : [];
            page.frames.push({
              id: `frame-${Date.now()}-${Math.random().toString(16).slice(2, 7)}`,
              title: `Moldura ${page.frames.length + 1}`,
              photo: '',
              shape: 'rounded',
              ...frameDefaultLayout(page.frames.length),
              annotations: [],
            });
            persistAndRender();
          });
        });

        document.querySelectorAll('[data-page-arrow-button]').forEach((button) => {
          button.addEventListener('click', () => {
            arrowDrawMode = {
              environmentIndex: Number(button.dataset.environmentIndex),
              pageIndex: Number(button.dataset.pageIndex),
            };
            applyArrowDrawMode();
          });
        });

        document.querySelectorAll('[data-add-annotation]').forEach((button) => {
          button.addEventListener('click', () => {
            arrowDrawMode = {
              environmentIndex: Number(button.dataset.environmentIndex),
              pageIndex: Number(button.dataset.pageIndex),
            };
            applyArrowDrawMode();
          });
        });

        document.querySelectorAll('[data-annotation-text]').forEach((input) => {
          input.addEventListener('input', () => {
            const annotation = frameAnnotation(Number(input.dataset.environmentIndex), Number(input.dataset.pageIndex), Number(input.dataset.frameIndex), Number(input.dataset.annotationIndex));
            if (!annotation) return;
            annotation.text = input.value;
            persistWithoutRender();
            const label = document.querySelector(`[data-annotation-label="${input.dataset.environmentIndex}-${input.dataset.pageIndex}-${input.dataset.frameIndex}-${input.dataset.annotationIndex}"]`);
            if (label) label.textContent = input.value;
          });
        });

        document.querySelectorAll('[data-annotation-style]').forEach((input) => {
          input.addEventListener('input', () => {
            const annotation = frameAnnotation(Number(input.dataset.environmentIndex), Number(input.dataset.pageIndex), Number(input.dataset.frameIndex), Number(input.dataset.annotationIndex));
            if (!annotation) return;
            const field = input.dataset.annotationStyle;
            annotation[field] = input.type === 'number' ? Number(input.value) : input.value;
            persistAndRender();
          });
        });

        document.querySelectorAll('[data-remove-annotation]').forEach((button) => {
          button.addEventListener('click', () => {
            const frame = pageFrame(Number(button.dataset.environmentIndex), Number(button.dataset.pageIndex), Number(button.dataset.frameIndex));
            if (!frame) return;
            frame.annotations.splice(Number(button.dataset.annotationIndex), 1);
            persistAndRender();
          });
        });

        document.querySelectorAll('[data-drag-annotation]').forEach((node) => {
          node.addEventListener('pointerdown', startPreviewAnnotationDrag);
        });

        document.querySelectorAll('[data-page-annotation-text]').forEach((node) => {
          node.addEventListener('input', () => {
            const annotation = pageAnnotation(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.annotationIndex));
            if (!annotation) return;
            annotation.text = node.textContent.trim() || 'Texto da seta';
            persistWithoutRender();
          });
        });

        document.querySelectorAll('[data-drag-page-annotation]').forEach((node) => {
          node.addEventListener('pointerdown', startPageAnnotationDrag);
        });

        document.querySelectorAll('[data-draggable-frame]').forEach((node) => {
          node.addEventListener('pointerdown', startPreviewFrameDrag);
          node.addEventListener('dragover', handleFrameDragOver);
          node.addEventListener('dragleave', handleFrameDragLeave);
          node.addEventListener('drop', handleFrameDrop);
        });

        document.querySelectorAll('[data-resize-frame]').forEach((node) => {
          node.addEventListener('pointerdown', startPreviewFrameResize);
        });

        document.querySelectorAll('[data-editable-frame-image]').forEach((node) => {
          node.addEventListener('pointerdown', startFrameImagePan);
        });

        document.querySelectorAll('[data-page-frames]').forEach((node) => {
          node.addEventListener('pointerdown', startPageArrowDraw);
        });

        applyArrowDrawMode();
      }

      function environmentPage(environmentIndex, pageIndex) {
        return documentData.environments?.[environmentIndex]?.pages?.[pageIndex] || null;
      }

      function pageFrame(environmentIndex, pageIndex, frameIndex) {
        const page = environmentPage(environmentIndex, pageIndex);
        if (!page) return null;
        page.frames = Array.isArray(page.frames) ? page.frames : [];
        return page.frames[frameIndex] || null;
      }

      function frameAnnotation(environmentIndex, pageIndex, frameIndex, annotationIndex) {
        const frame = pageFrame(environmentIndex, pageIndex, frameIndex);
        if (!frame) return null;
        frame.annotations = Array.isArray(frame.annotations) ? frame.annotations : [];
        return frame.annotations[annotationIndex] || null;
      }

      function pageAnnotation(environmentIndex, pageIndex, annotationIndex) {
        const page = environmentPage(environmentIndex, pageIndex);
        if (!page) return null;
        page.annotations = Array.isArray(page.annotations) ? page.annotations : [];
        return page.annotations[annotationIndex] || null;
      }

      function pagePoint(event, pageNode) {
        const rect = pageNode.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(100, ((event.clientX - rect.left) / rect.width) * 100)),
          y: Math.max(0, Math.min(100, ((event.clientY - rect.top) / rect.height) * 100)),
        };
      }

      function applyArrowDrawMode() {
        document.querySelectorAll('[data-page-frames]').forEach((node) => {
          const active = arrowDrawMode
            && Number(node.dataset.environmentIndex) === arrowDrawMode.environmentIndex
            && Number(node.dataset.pageIndex) === arrowDrawMode.pageIndex;
          node.classList.toggle('arrow-draw-mode', Boolean(active));
        });
      }

      function frameKey(environmentIndex, pageIndex, frameIndex) {
        return `${environmentIndex}:${pageIndex}:${frameIndex}`;
      }

      function selectSingleFrame(key) {
        selectedFrameKeys.clear();
        selectedFrameKeys.add(key);
        applyFrameSelectionClasses();
      }

      function toggleFrameSelection(key) {
        if (selectedFrameKeys.has(key)) selectedFrameKeys.delete(key);
        else selectedFrameKeys.add(key);
        applyFrameSelectionClasses();
      }

      function clearFrameSelection() {
        selectedFrameKeys.clear();
        applyFrameSelectionClasses();
      }

      function ensureFrameButtonSelection(node) {
        const key = frameKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.frameIndex);
        if (!selectedFrameKeys.has(key)) selectSingleFrame(key);
      }

      function applyFrameSelectionClasses() {
        document.querySelectorAll('[data-draggable-frame]').forEach((node) => {
          const key = frameKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.frameIndex);
          node.classList.toggle('is-selected', selectedFrameKeys.has(key));
        });
      }

      function deleteSelectedFrames() {
        const grouped = new Map();
        selectedFrameKeys.forEach((key) => {
          const [environmentIndex, pageIndex, frameIndex] = key.split(':').map(Number);
          const pageKey = `${environmentIndex}:${pageIndex}`;
          if (!grouped.has(pageKey)) grouped.set(pageKey, []);
          grouped.get(pageKey).push(frameIndex);
        });
        grouped.forEach((indexes, pageKey) => {
          const [environmentIndex, pageIndex] = pageKey.split(':').map(Number);
          const page = environmentPage(environmentIndex, pageIndex);
          if (!page || !Array.isArray(page.frames)) return;
          indexes.sort((a, b) => b - a).forEach((index) => page.frames.splice(index, 1));
        });
        selectedFrameKeys.clear();
        persistAndRender();
      }

      function selectedFrameRefs() {
        return [...selectedFrameKeys].map((key) => {
          const [environmentIndex, pageIndex, frameIndex] = key.split(':').map(Number);
          const page = environmentPage(environmentIndex, pageIndex);
          const frame = pageFrame(environmentIndex, pageIndex, frameIndex);
          return page && frame ? { key, environmentIndex, pageIndex, frameIndex, page, frame } : null;
        }).filter(Boolean);
      }

      function cloneFrame(frame, offset = 3) {
        const clone = JSON.parse(JSON.stringify(frame));
        clone.id = `frame-${Date.now()}-${Math.random().toString(16).slice(2, 7)}`;
        clone.title = `${clone.title || 'Moldura'} cópia`;
        clone.x = Math.max(0, Math.min(92, Number(clone.x || 0) + offset));
        clone.y = Math.max(0, Math.min(92, Number(clone.y || 0) + offset));
        clone.editImage = false;
        return clone;
      }

      function copySelectedFrames() {
        const refs = selectedFrameRefs();
        if (!refs.length) return;
        frameClipboard = refs.map(ref => JSON.parse(JSON.stringify(ref.frame)));
      }

      function pasteTargetPage() {
        const ref = selectedFrameRefs()[0];
        if (ref?.page) return ref;
        const page = documentData.environments?.[0]?.pages?.[0] || null;
        return page ? { environmentIndex: 0, pageIndex: 0, page } : null;
      }

      function pasteCopiedFrames() {
        const target = pasteTargetPage();
        if (!target?.page || !frameClipboard.length) return;
        const page = target.page;
        page.frames = Array.isArray(page.frames) ? page.frames : [];
        const start = page.frames.length;
        frameClipboard.forEach((frame, index) => page.frames.push(cloneFrame(frame, 4 + index * 2)));
        selectedFrameKeys.clear();
        frameClipboard.forEach((_, index) => selectedFrameKeys.add(frameKey(target.environmentIndex, target.pageIndex, start + index)));
        persistAndRender();
      }

      function duplicateSelectedFrames() {
        copySelectedFrames();
        pasteCopiedFrames();
      }

      function closeFrameContextMenu() {
        document.getElementById('frameContextMenu')?.classList.remove('active');
      }

      function openFrameContextMenu(anchor) {
        let menu = document.getElementById('frameContextMenu');
        if (!menu) {
          menu = document.createElement('div');
          menu.id = 'frameContextMenu';
          menu.className = 'frame-context-menu';
          document.body.appendChild(menu);
        }
        menu.innerHTML = `
          <button type="button" data-menu-action="copy"><span>⧉</span><span>Copiar</span><kbd>Ctrl+C</kbd></button>
          <button type="button" data-menu-action="paste"><span>▣</span><span>Colar</span><kbd>Ctrl+V</kbd></button>
          <button type="button" data-menu-action="duplicate"><span>⊞</span><span>Duplicar</span><kbd>Ctrl+D</kbd></button>
          <button type="button" data-menu-action="delete"><span>⌫</span><span>Excluir</span><kbd>Del</kbd></button>
        `;
        menu.querySelectorAll('button').forEach(button => {
          button.addEventListener('click', () => {
            const action = button.dataset.menuAction;
            if (action === 'copy') copySelectedFrames();
            if (action === 'paste') pasteCopiedFrames();
            if (action === 'duplicate') duplicateSelectedFrames();
            if (action === 'delete') deleteSelectedFrames();
            closeFrameContextMenu();
          });
        });
        const rect = anchor.getBoundingClientRect();
        menu.style.left = `${Math.min(window.innerWidth - 280, rect.right + 10)}px`;
        menu.style.top = `${Math.min(window.innerHeight - 230, rect.top - 4)}px`;
        menu.classList.add('active');
      }

      function frameDefaultLayout(index) {
        const presets = [
          { x: 18, y: 8, width: 64, height: 64 },
          { x: 5, y: 18, width: 43, height: 46 },
          { x: 52, y: 18, width: 43, height: 46 },
          { x: 10, y: 58, width: 34, height: 34 },
          { x: 48, y: 58, width: 42, height: 34 },
        ];
        return presets[index % presets.length];
      }

      function applyFrameLayout(frame, index) {
        const fallback = frameDefaultLayout(index);
        frame.x = Number.isFinite(Number(frame.x)) ? Number(frame.x) : fallback.x;
        frame.y = Number.isFinite(Number(frame.y)) ? Number(frame.y) : fallback.y;
        frame.width = Number.isFinite(Number(frame.width)) ? Number(frame.width) : fallback.width;
        frame.height = Number.isFinite(Number(frame.height)) ? Number(frame.height) : fallback.height;
        frame.imgScale = Number.isFinite(Number(frame.imgScale)) ? Number(frame.imgScale) : 1;
        frame.imgX = Number.isFinite(Number(frame.imgX)) ? Number(frame.imgX) : 0;
        frame.imgY = Number.isFinite(Number(frame.imgY)) ? Number(frame.imgY) : 0;
        frame.editImage = Boolean(frame.editImage);
        frame.x = Math.max(0, Math.min(98, frame.x));
        frame.y = Math.max(0, Math.min(98, frame.y));
        frame.width = Math.max(8, Math.min(100 - frame.x, frame.width));
        frame.height = Math.max(8, Math.min(100 - frame.y, frame.height));
        frame.imgScale = Math.max(1, Math.min(3, frame.imgScale));
        frame.imgX = Math.max(-100, Math.min(100, frame.imgX));
        frame.imgY = Math.max(-100, Math.min(100, frame.imgY));
        return frame;
      }

      function startPreviewFrameDrag(event) {
        if (!isEditablePreview) return;
        if (event.target.closest('.preview-frame-tools, .frame-selection-toolbar, .annotation-edit-row, [data-drag-annotation], [data-resize-frame]')) return;
        event.preventDefault();
        const node = event.currentTarget;
        const key = frameKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.frameIndex);
        if (event.shiftKey || event.ctrlKey || event.metaKey) toggleFrameSelection(key);
        else if (!selectedFrameKeys.has(key)) selectSingleFrame(key);
        if (event.target.closest('[data-editable-frame-image]')) return;
        const frame = pageFrame(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.frameIndex));
        const canvas = node.closest('.page-frames');
        if (!frame || !canvas) return;
        const canvasRect = canvas.getBoundingClientRect();
        const startX = event.clientX;
        const startY = event.clientY;
        const selected = [...selectedFrameKeys].map((selectedKey) => {
          const [environmentIndex, pageIndex, frameIndex] = selectedKey.split(':').map(Number);
          const selectedFrame = pageFrame(environmentIndex, pageIndex, frameIndex);
          const selectedNode = document.querySelector(`[data-draggable-frame][data-environment-index="${environmentIndex}"][data-page-index="${pageIndex}"][data-frame-index="${frameIndex}"]`);
          return selectedFrame && selectedNode ? { frame: selectedFrame, node: selectedNode, x: Number(selectedFrame.x || 0), y: Number(selectedFrame.y || 0) } : null;
        }).filter(Boolean);

        const move = (pointerEvent) => {
          const dx = ((pointerEvent.clientX - startX) / canvasRect.width) * 100;
          const dy = ((pointerEvent.clientY - startY) / canvasRect.height) * 100;
          selected.forEach((item) => {
            item.frame.x = Math.max(0, Math.min(100 - Number(item.frame.width || 20), item.x + dx));
            item.frame.y = Math.max(0, Math.min(100 - Number(item.frame.height || 20), item.y + dy));
            item.node.style.left = `${item.frame.x}%`;
            item.node.style.top = `${item.frame.y}%`;
          });
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function startPreviewFrameResize(event) {
        if (!isEditablePreview) return;
        event.preventDefault();
        event.stopPropagation();
        const node = event.currentTarget.closest('.doc-photo-frame');
        const frame = pageFrame(Number(node?.dataset.environmentIndex), Number(node?.dataset.pageIndex), Number(node?.dataset.frameIndex));
        const canvas = node?.closest('.page-frames');
        if (!frame || !canvas || !node) return;
        selectSingleFrame(frameKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.frameIndex));
        const handle = event.currentTarget.dataset.resizeFrame || 'se';
        const canvasRect = canvas.getBoundingClientRect();
        const startX = event.clientX;
        const startY = event.clientY;
        const initial = {
          x: Number(frame.x || 0),
          y: Number(frame.y || 0),
          width: Number(frame.width || 20),
          height: Number(frame.height || 20),
        };

        const move = (pointerEvent) => {
          const dw = ((pointerEvent.clientX - startX) / canvasRect.width) * 100;
          const dh = ((pointerEvent.clientY - startY) / canvasRect.height) * 100;
          if (handle.includes('e')) frame.width = Math.max(8, Math.min(100 - initial.x, initial.width + dw));
          if (handle.includes('s')) frame.height = Math.max(8, Math.min(100 - initial.y, initial.height + dh));
          if (handle.includes('w')) {
            const nextX = Math.max(0, Math.min(initial.x + initial.width - 8, initial.x + dw));
            frame.x = nextX;
            frame.width = Math.max(8, Math.min(100 - nextX, initial.width + (initial.x - nextX)));
          }
          if (handle.includes('n')) {
            const nextY = Math.max(0, Math.min(initial.y + initial.height - 8, initial.y + dh));
            frame.y = nextY;
            frame.height = Math.max(8, Math.min(100 - nextY, initial.height + (initial.y - nextY)));
          }
          node.style.left = `${frame.x}%`;
          node.style.top = `${frame.y}%`;
          node.style.width = `${frame.width}%`;
          node.style.height = `${frame.height}%`;
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function handleFrameDragOver(event) {
        if (!isEditablePreview) return;
        event.preventDefault();
        event.currentTarget.classList.add('drag-over');
      }

      function handleFrameDragLeave(event) {
        event.currentTarget.classList.remove('drag-over');
      }

      function handleFrameDrop(event) {
        if (!isEditablePreview) return;
        event.preventDefault();
        const node = event.currentTarget;
        node.classList.remove('drag-over');
        const frame = pageFrame(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.frameIndex));
        if (!frame) return;
        const photoSrc = event.dataTransfer?.getData('text/dcoratto-photo') || event.dataTransfer?.getData('text/plain');
        const file = event.dataTransfer?.files?.[0];
        if (file && file.type.startsWith('image/')) {
          readPhoto(file, 0).then(photo => {
            frame.photo = photo.src;
            persistAndRender();
          });
          return;
        }
        if (photoSrc && photoSrc.startsWith('data:image')) {
          frame.photo = photoSrc;
          persistAndRender();
        }
      }

      function startPageArrowDraw(event) {
        if (!isEditablePreview || !arrowDrawMode) return;
        if (event.target.closest('.preview-frame-tools, .frame-selection-toolbar, .annotation-edit-row, [data-resize-frame], [data-drag-page-annotation], [contenteditable="true"]')) return;
        const pageNode = event.currentTarget;
        const environmentIndex = Number(pageNode.dataset.environmentIndex);
        const pageIndex = Number(pageNode.dataset.pageIndex);
        if (environmentIndex !== arrowDrawMode.environmentIndex || pageIndex !== arrowDrawMode.pageIndex) return;
        event.preventDefault();
        event.stopPropagation();
        const page = environmentPage(environmentIndex, pageIndex);
        if (!page) return;
        page.annotations = Array.isArray(page.annotations) ? page.annotations : [];
        const start = pagePoint(event, pageNode);
        const annotation = {
          id: `page-ann-${Date.now()}-${Math.random().toString(16).slice(2, 7)}`,
          text: 'Texto da seta',
          fromX: start.x + 12,
          fromY: start.y + 8,
          toX: start.x,
          toY: start.y,
          arrowColor: '#111111',
          textColor: '#111111',
          fontSize: 18,
          arrowWidth: 3,
        };
        page.annotations.push(annotation);
        const annotationIndex = page.annotations.length - 1;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('class', 'page-annotation-line');
        line.style.setProperty('--arrow-color', annotation.arrowColor);
        line.style.setProperty('--arrow-width', annotation.arrowWidth);
        line.setAttribute('x1', `${annotation.fromX}%`);
        line.setAttribute('y1', `${annotation.fromY}%`);
        line.setAttribute('x2', `${annotation.toX}%`);
        line.setAttribute('y2', `${annotation.toY}%`);
        const overlay = pageNode.querySelector('.page-annotation-layer');
        overlay?.appendChild(line);

        const move = (pointerEvent) => {
          const end = pagePoint(pointerEvent, pageNode);
          annotation.fromX = end.x;
          annotation.fromY = end.y;
          line.setAttribute('x1', `${annotation.fromX}%`);
          line.setAttribute('y1', `${annotation.fromY}%`);
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          arrowDrawMode = null;
          persistAndRender();
          requestAnimationFrame(() => {
            const label = document.querySelector(`[data-page-annotation-text="${environmentIndex}-${pageIndex}-${annotationIndex}"]`);
            label?.focus();
            document.getSelection()?.selectAllChildren(label);
          });
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function startPageAnnotationDrag(event) {
        if (!isEditablePreview) return;
        event.preventDefault();
        event.stopPropagation();
        const node = event.currentTarget;
        const pageNode = node.closest('[data-page-frames]');
        const annotation = pageAnnotation(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.annotationIndex));
        if (!pageNode || !annotation) return;
        const handle = node.dataset.dragPageAnnotation;
        const keyX = handle === 'head' ? 'toX' : 'fromX';
        const keyY = handle === 'head' ? 'toY' : 'fromY';

        const move = (pointerEvent) => {
          const point = pagePoint(pointerEvent, pageNode);
          annotation[keyX] = point.x;
          annotation[keyY] = point.y;
          const id = `${node.dataset.environmentIndex}-${node.dataset.pageIndex}-${node.dataset.annotationIndex}`;
          const line = pageNode.querySelector(`[data-page-annotation-line="${id}"]`);
          const label = pageNode.querySelector(`[data-page-annotation-text="${id}"]`);
          const head = pageNode.querySelector(`[data-page-annotation-head="${id}"]`);
          if (line) {
            line.setAttribute(handle === 'head' ? 'x2' : 'x1', `${point.x}%`);
            line.setAttribute(handle === 'head' ? 'y2' : 'y1', `${point.y}%`);
          }
          if (handle === 'text' && label) {
            label.style.left = `${point.x}%`;
            label.style.top = `${point.y}%`;
          }
          if (handle === 'head' && head) {
            head.style.left = `${point.x}%`;
            head.style.top = `${point.y}%`;
          }
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function updateFrameImageTransform(frameNode, frame) {
        const image = frameNode?.querySelector('[data-editable-frame-image]');
        if (!image || !frame) return;
        image.style.transform = `translate(${Number(frame.imgX || 0)}%, ${Number(frame.imgY || 0)}%) scale(${Number(frame.imgScale || 1)})`;
      }

      function startFrameImagePan(event) {
        if (!isEditablePreview) return;
        const frameNode = event.currentTarget.closest('.doc-photo-frame');
        const frame = pageFrame(Number(frameNode?.dataset.environmentIndex), Number(frameNode?.dataset.pageIndex), Number(frameNode?.dataset.frameIndex));
        if (!frame || !frame.editImage) return;
        event.preventDefault();
        event.stopPropagation();
        selectSingleFrame(frameKey(frameNode.dataset.environmentIndex, frameNode.dataset.pageIndex, frameNode.dataset.frameIndex));
        const startX = event.clientX;
        const startY = event.clientY;
        const initial = { x: Number(frame.imgX || 0), y: Number(frame.imgY || 0) };

        const move = (pointerEvent) => {
          const rect = frameNode.getBoundingClientRect();
          frame.imgX = Math.max(-100, Math.min(100, initial.x + ((pointerEvent.clientX - startX) / rect.width) * 100));
          frame.imgY = Math.max(-100, Math.min(100, initial.y + ((pointerEvent.clientY - startY) / rect.height) * 100));
          updateFrameImageTransform(frameNode, frame);
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function startPreviewAnnotationDrag(event) {
        if (!isEditablePreview) return;
        event.preventDefault();
        event.stopPropagation();
        const node = event.currentTarget;
        const frameNode = node.closest('.doc-photo-frame');
        const annotation = frameAnnotation(
          Number(node.dataset.environmentIndex),
          Number(node.dataset.pageIndex),
          Number(node.dataset.frameIndex),
          Number(node.dataset.annotationIndex),
        );
        if (!frameNode || !annotation) return;
        const handle = node.dataset.dragAnnotation;
        const keyX = handle === 'label' ? 'fromX' : 'toX';
        const keyY = handle === 'label' ? 'fromY' : 'toY';

        const move = (pointerEvent) => {
          const rect = frameNode.getBoundingClientRect();
          const x = Math.max(0, Math.min(100, ((pointerEvent.clientX - rect.left) / rect.width) * 100));
          const y = Math.max(0, Math.min(100, ((pointerEvent.clientY - rect.top) / rect.height) * 100));
          annotation[keyX] = x;
          annotation[keyY] = y;
          const id = `${node.dataset.environmentIndex}-${node.dataset.pageIndex}-${node.dataset.frameIndex}-${node.dataset.annotationIndex}`;
          const line = frameNode.querySelector(`[data-annotation-line="${id}"]`);
          const label = frameNode.querySelector(`[data-annotation-label="${id}"]`);
          const target = frameNode.querySelector(`[data-annotation-target="${id}"]`);
          if (handle === 'label') {
            if (line) { line.setAttribute('x1', `${x}%`); line.setAttribute('y1', `${y}%`); }
            if (label) { label.style.left = `${x}%`; label.style.top = `${y}%`; }
          } else {
            if (line) { line.setAttribute('x2', `${x}%`); line.setAttribute('y2', `${y}%`); }
            if (target) { target.style.left = `${x}%`; target.style.top = `${y}%`; }
          }
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function renderEnvironment(environment, index) {
        const photos = normalizePhotos(environment.photos);
        const layout = environment.layout || suggestDefaultLayout(photos.length);
        return `
          <section class="environment" id="${slug(environment.title)}">
            <div class="section-heading">
              <span class="section-number">${escapeHTML(environment.number || String(index + 1).padStart(2, '0'))}</span>
              <h2>${escapeHTML(environment.title)}</h2>
              <span class="section-line"></span>
            </div>
            ${isEditablePreview ? `<div class="mural-tools">
              <div class="layout-suggestions">
                ${layoutSuggestions(photos.length).map((suggestion) => `
                  <button type="button" class="${layout === suggestion.key ? 'active' : ''}" data-environment-index="${index}" data-layout="${suggestion.key}">
                    ${suggestion.label}
                  </button>
                `).join('')}
              </div>
              <label class="photo-upload">
                Adicionar fotos
                <input type="file" accept="image/*" multiple data-photo-input data-environment-index="${index}" />
              </label>
            </div>` : ''}
            <div class="portfolio-layout">
              <div class="photo-mural layout-${escapeAttribute(layout)}">
                ${photos.map((photo, photoIndex) => `
                  <button class="photo-card ${tileClass(photoIndex, photos.length, layout)}" type="button" draggable="true" data-photo-src="${escapeAttribute(photo.src)}" data-lightbox-src="${escapeAttribute(photo.src)}" data-lightbox-title="${escapeAttribute(photo.title)}">
                    <img src="${escapeAttribute(photo.src)}" alt="${escapeAttribute(photo.title)}" draggable="true" data-photo-src="${escapeAttribute(photo.src)}" />
                    <span class="photo-index">${String(photoIndex + 1).padStart(2, '0')}</span>
                    <span class="photo-label">${escapeHTML(photo.title || `Vista ${photoIndex + 1}`)}</span>
                  </button>
                `).join('')}
              </div>
              <aside class="info-panel">
                ${renderSpec('Tamponamentos', environment.specs?.tamponamentos)}
                ${renderSpec('Portas', environment.specs?.portas)}
                ${renderSpec('Puxadores', environment.specs?.puxadores)}
                ${renderSpec('Corrediças', environment.specs?.corredicas)}
                <div class="spec-group">
                  <span class="spec-title">Cores</span>
                  <div class="colors">
                    ${(environment.colors || []).map((color) => `
                      <div class="color-item">
                        <span class="color-dot" style="background-color:${escapeAttribute(color.hex)};${color.textureUrl ? `background-image:url('${escapeAttribute(color.textureUrl)}')` : ''}"></span>
                        <span class="color-name">${escapeHTML(color.name)}${color.quality ? ' / '+escapeHTML(color.quality) : ''}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
                <div class="notes">
                  ${(environment.notes || []).map((note) => `<p>${escapeHTML(note)}</p>`).join('')}
                </div>
                <div class="client-footer">${escapeHTML(documentData.client.address || '')}</div>
              </aside>
            </div>
          </section>
          ${(environment.pages || []).map((page, pageIndex) => renderEnvironmentPage(environment, page, index, pageIndex)).join('')}
        `;
      }

      function renderEnvironmentPage(environment, page, environmentIndex, pageIndex) {
        const pageNumber = page.number || `${String(environmentIndex + 1).padStart(2, '0')}.${String(pageIndex + 1).padStart(2, '0')}`;
        const frames = normalizeFrames(page);
        return `
          <section class="environment-page ${isEditablePreview ? 'editable' : ''}" id="${slug(environment.title)}-${slug(page.title || `pagina-${pageIndex + 1}`)}">
            <div class="page-fixed-title">
              <strong>${escapeHTML(documentData.projectType || 'Projeto Inicial')}</strong>
              <span>${escapeHTML(environment.title)}</span>
            </div>
            <div class="cover-kicker" style="color:#8f7044;text-align:center;margin-bottom:10px">${escapeHTML(pageNumber)} · ${escapeHTML(page.title || `Página ${pageIndex + 1}`)}</div>
            ${page.description ? `<p class="page-description">${escapeHTML(page.description)}</p>` : ''}
            ${isEditablePreview ? `
              <div class="mural-tools" style="justify-content:center;margin:0 0 24px;padding-left:0">
                <button type="button" class="photo-upload" data-add-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}">Adicionar moldura</button>
                <button type="button" class="photo-upload" data-page-arrow-button data-environment-index="${environmentIndex}" data-page-index="${pageIndex}">Seta para texto</button>
              </div>
            ` : ''}
            <div class="page-frames" data-page-frames data-environment-index="${environmentIndex}" data-page-index="${pageIndex}">
              ${frames.map((frame, frameIndex) => renderDocumentFrame(frame, page, frameIndex, environmentIndex, pageIndex)).join('')}
              ${renderPageAnnotations(page, environmentIndex, pageIndex)}
            </div>
          </section>
        `;
      }

      function renderPageAnnotations(page, environmentIndex, pageIndex) {
        page.annotations = Array.isArray(page.annotations) ? page.annotations : [];
        return `
          <svg class="page-annotation-layer" viewBox="0 0 100 100" preserveAspectRatio="none">
            <defs>
              ${page.annotations.map((annotation, annotationIndex) => `
                <marker id="pageArrowHead-${environmentIndex}-${pageIndex}-${annotationIndex}" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                  <path d="M0,0 L8,4 L0,8 Z" fill="${escapeAttribute(annotation.arrowColor || '#111111')}"></path>
                </marker>
              `).join('')}
            </defs>
            ${page.annotations.map((annotation, annotationIndex) => `
              <line data-page-annotation-line="${environmentIndex}-${pageIndex}-${annotationIndex}" class="page-annotation-line" style="--arrow-color:${escapeAttribute(annotation.arrowColor || '#111111')};--arrow-width:${Number(annotation.arrowWidth ?? 3)};marker-end:url(#pageArrowHead-${environmentIndex}-${pageIndex}-${annotationIndex})" x1="${Number(annotation.fromX ?? 30)}%" y1="${Number(annotation.fromY ?? 30)}%" x2="${Number(annotation.toX ?? 20)}%" y2="${Number(annotation.toY ?? 20)}%"></line>
            `).join('')}
          </svg>
          ${page.annotations.map((annotation, annotationIndex) => `
            <span
              data-page-annotation-text="${environmentIndex}-${pageIndex}-${annotationIndex}"
              data-drag-page-annotation="text"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-annotation-index="${annotationIndex}"
              class="page-annotation-text"
              contenteditable="${isEditablePreview ? 'true' : 'false'}"
              style="left:${Number(annotation.fromX ?? 30)}%;top:${Number(annotation.fromY ?? 30)}%;--text-color:${escapeAttribute(annotation.textColor || '#111111')};--text-size:${Number(annotation.fontSize ?? 18)}px"
            >${escapeHTML(annotation.text || 'Texto da seta')}</span>
            ${isEditablePreview ? `<span
              data-page-annotation-head="${environmentIndex}-${pageIndex}-${annotationIndex}"
              data-drag-page-annotation="head"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-annotation-index="${annotationIndex}"
              class="frame-arrow-target"
              style="left:${Number(annotation.toX ?? 20)}%;top:${Number(annotation.toY ?? 20)}%"
            ></span>` : ''}
          `).join('')}
        `;
      }

      function normalizeFrames(page) {
        if (Array.isArray(page.frames) && page.frames.length) {
          page.frames.forEach((frame, index) => {
            frame.id ||= `frame-${Date.now()}-${Math.random().toString(16).slice(2, 7)}`;
            frame.title ||= `Moldura ${index + 1}`;
            frame.photo ||= frame.photos?.[0]?.src || '';
            frame.shape ||= 'rounded';
            frame.annotations = Array.isArray(frame.annotations) ? frame.annotations : [];
            applyFrameLayout(frame, index);
          });
          return page.frames;
        }
        return normalizePhotos(page.photos).map((photo, index) => ({
          id: `frame-${Date.now()}-${index}`,
          title: photo.title || `Moldura ${index + 1}`,
          photo: photo.src,
          shape: 'rounded',
          ...frameDefaultLayout(index),
          annotations: [],
        }));
      }

      function renderDocumentFrame(frame, page, frameIndex, environmentIndex, pageIndex) {
        applyFrameLayout(frame, frameIndex);
        const hasPhoto = Boolean(frame.photo);
        const shape = ['circle', 'square', 'rounded', 'rectangle'].includes(frame.shape) ? frame.shape : 'rounded';
        const frameStyle = `left:${Number(frame.x)}%;top:${Number(frame.y)}%;width:${Number(frame.width)}%;height:${Number(frame.height)}%`;
        const imageStyle = `transform:translate(${Number(frame.imgX || 0)}%, ${Number(frame.imgY || 0)}%) scale(${Number(frame.imgScale || 1)})`;
        const handles = ['nw','n','ne','e','se','s','sw','w'].map(handle => `<span class="frame-resize-handle" data-resize-frame="${handle}"></span>`).join('');
        return `
          <div
            class="doc-photo-frame is-positioned shape-${escapeAttribute(shape)} ${frame.editImage ? 'is-editing-image' : ''}"
            style="${frameStyle}"
            ${isEditablePreview ? `data-draggable-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}"` : ''}
          >
            ${isEditablePreview ? renderFramePreviewTools(frame, environmentIndex, pageIndex, frameIndex) : ''}
            <div class="frame-clip">
              ${hasPhoto ? `<img src="${escapeAttribute(frame.photo)}" alt="${escapeAttribute(frame.title || page.title)}" draggable="true" data-photo-src="${escapeAttribute(frame.photo)}" data-editable-frame-image style="${imageStyle}" />` : '<span class="doc-frame-empty">Moldura sem foto</span>'}
              ${isEditablePreview ? '<span class="drop-hint">Solte a foto aqui</span>' : ''}
              <svg class="doc-annotation-layer" viewBox="0 0 100 100" preserveAspectRatio="none">
                <defs>
                  ${(frame.annotations || []).map((annotation, annotationIndex) => `
                    <marker id="docArrowHead-${environmentIndex}-${pageIndex}-${frameIndex}-${annotationIndex}" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                      <path d="M0,0 L8,4 L0,8 Z" fill="${escapeAttribute(annotation.arrowColor || '#111111')}"></path>
                    </marker>
                  `).join('')}
                </defs>
                ${(frame.annotations || []).map((annotation, annotationIndex) => `
                  <line data-annotation-line="${environmentIndex}-${pageIndex}-${frameIndex}-${annotationIndex}" class="doc-annotation-line" style="--arrow-color:${escapeAttribute(annotation.arrowColor || '#111')};--arrow-width:${Number(annotation.arrowWidth ?? 2)};marker-end:url(#docArrowHead-${environmentIndex}-${pageIndex}-${frameIndex}-${annotationIndex})" x1="${Number(annotation.fromX ?? 18)}%" y1="${Number(annotation.fromY ?? 18)}%" x2="${Number(annotation.toX ?? 58)}%" y2="${Number(annotation.toY ?? 48)}%"></line>
                `).join('')}
              </svg>
              ${(frame.annotations || []).map((annotation, annotationIndex) => `
                <span
                  data-annotation-label="${environmentIndex}-${pageIndex}-${frameIndex}-${annotationIndex}"
                  ${isEditablePreview ? `data-drag-annotation="label" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}" data-annotation-index="${annotationIndex}"` : ''}
                  class="doc-annotation-text"
                  style="left:${Number(annotation.fromX ?? 18)}%;top:${Number(annotation.fromY ?? 18)}%;--text-color:${escapeAttribute(annotation.textColor || '#111')};--text-size:${Number(annotation.fontSize ?? 17)}px"
                >${escapeHTML(annotation.text || '')}</span>
                ${isEditablePreview ? `<span
                  data-annotation-target="${environmentIndex}-${pageIndex}-${frameIndex}-${annotationIndex}"
                  data-drag-annotation="target"
                  data-environment-index="${environmentIndex}"
                  data-page-index="${pageIndex}"
                  data-frame-index="${frameIndex}"
                  data-annotation-index="${annotationIndex}"
                  class="frame-arrow-target"
                  style="left:${Number(annotation.toX ?? 58)}%;top:${Number(annotation.toY ?? 48)}%"
                ></span>` : ''}
              `).join('')}
              <span class="doc-frame-title">${String(frameIndex + 1).padStart(2, '0')} · ${escapeHTML(frame.title || 'Moldura')}</span>
            </div>
            ${isEditablePreview ? `
              <span class="frame-selection-toolbar">
                <button type="button" data-copy-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">Copiar</button>
                <button type="button" data-paste-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">Colar</button>
                <button type="button" data-duplicate-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">Duplicar</button>
                <button type="button" data-edit-image data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">${frame.editImage ? 'Mover moldura' : 'Editar foto'}</button>
