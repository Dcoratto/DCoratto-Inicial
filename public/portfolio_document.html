      async function pasteSystemClipboard() {
        const target = lastCanvasPasteTarget || defaultPasteTargetPage();
        if (!target?.page || !navigator.clipboard) return;
        try {
          if (navigator.clipboard.read) {
            const items = await navigator.clipboard.read();
            for (const item of items) {
              const imageType = item.types.find(type => type.startsWith('image/'));
              if (imageType) {
                const blob = await item.getType(imageType);
                const file = new File([blob], 'clipboard-image.png', { type: imageType });
                const photo = await readPhoto(file, 0);
                addFreeElement(target, { type: 'image', src: photo.src, width: 22, height: 16 });
                return;
              }
            }
          }
          const text = await navigator.clipboard.readText();
          if (text && text.trim()) {
            addFreeElement(target, { type: 'text', text: text.trim(), width: 24, height: 8 });
          }
        } catch (error) {
          console.warn('Nao foi possivel ler a area de transferencia. Use Ctrl+V na pagina.', error);
        }
      }

      function bringPageAnnotationForward() {
        selectedPageAnnotationRefs().forEach((ref) => {
          const allAnnotations = ref.page.annotations || [];
          const currentIndex = allAnnotations.indexOf(ref.annotation);
          if (currentIndex < allAnnotations.length - 1) {
            [allAnnotations[currentIndex], allAnnotations[currentIndex + 1]] = [allAnnotations[currentIndex + 1], allAnnotations[currentIndex]];
          }
        });
        persistAndRender();
      }

      function sendPageAnnotationBackward() {
        selectedPageAnnotationRefs().forEach((ref) => {
          const allAnnotations = ref.page.annotations || [];
          const currentIndex = allAnnotations.indexOf(ref.annotation);
          if (currentIndex > 0) {
            [allAnnotations[currentIndex], allAnnotations[currentIndex - 1]] = [allAnnotations[currentIndex - 1], allAnnotations[currentIndex]];
          }
        });
        persistAndRender();
      }

      function cycleOverlappingAnnotations(clientX, clientY, environmentIndex, pageIndex) {
        const page = environmentPage(environmentIndex, pageIndex);
        if (!page || !Array.isArray(page.annotations)) return;
        
        // Encontra quais anotações estão perto do clique
        const tolerance = 50; // pixels
        const nearby = page.annotations
          .map((annotation, index) => ({
            annotation,
            index,
            key: pageAnnotationKey(environmentIndex, pageIndex, index)
          }))
          .filter(({ annotation }) => {
            const allTexts = document.querySelectorAll(`[data-page-annotation-text^="${environmentIndex}-${pageIndex}"]`);
            let found = false;
            for (let i = 0; i < allTexts.length; i++) {
              if (allTexts[i].textContent.trim() === (annotation.text || 'Texto da seta').trim()) {
                const rect = allTexts[i].getBoundingClientRect();
                const dist = Math.hypot(rect.left + rect.width / 2 - clientX, rect.top + rect.height / 2 - clientY);
                if (dist < tolerance) {
                  found = true;
                }
                break;
              }
            }
            return found;
          });
        
        if (nearby.length === 0) return;
        
        // Encontra a próxima anotação na sequência
        const currentIndex = nearby.findIndex(item => selectedPageAnnotationKeys.has(item.key));
        const nextIndex = (currentIndex + 1) % nearby.length;
        selectSinglePageAnnotation(nearby[nextIndex].key);
      }

      function frameFormatOptions() {
        return [
          { name: 'Quadrada Pequena', width: 25, height: 25 },
          { name: 'Retangular Pequena', width: 35, height: 25 },
          { name: 'Quadrada Média', width: 35, height: 35 },
          { name: 'Retangular Média', width: 45, height: 30 },
          { name: 'Grande', width: 45, height: 45 },
        ];
      }

      function getRandomPosition() {
        return {
          x: Math.max(5, Math.min(85, Math.random() * 70 + 15)),
          y: Math.max(5, Math.min(85, Math.random() * 70 + 15)),
        };
      }

      function frameDefaultLayout(index) {
        const presets = [
          { x: 18, y: 8, width: 64, height: 64 },
          { x: 5, y: 18, width: 43, height: 46 },
          { x: 52, y: 18, width: 43, height: 46 },
          { x: 10, y: 58, width: 34, height: 34 },
          { x: 48, y: 58, width: 42, height: 34 },
        ];
        return presets[index % presets.length];
      }

      function applyFrameLayout(frame, index) {
        const fallback = frameDefaultLayout(index);
        frame.x = Number.isFinite(Number(frame.x)) ? Number(frame.x) : fallback.x;
        frame.y = Number.isFinite(Number(frame.y)) ? Number(frame.y) : fallback.y;
        frame.width = Number.isFinite(Number(frame.width)) ? Number(frame.width) : fallback.width;
        frame.height = Number.isFinite(Number(frame.height)) ? Number(frame.height) : fallback.height;
        frame.imgScale = Number.isFinite(Number(frame.imgScale)) ? Number(frame.imgScale) : 1;
        frame.imgX = Number.isFinite(Number(frame.imgX)) ? Number(frame.imgX) : 0;
        frame.imgY = Number.isFinite(Number(frame.imgY)) ? Number(frame.imgY) : 0;
        frame.editImage = Boolean(frame.editImage);
        frame.x = Math.max(0, Math.min(98, frame.x));
        frame.y = Math.max(0, Math.min(98, frame.y));
        frame.width = Math.max(8, Math.min(100 - frame.x, frame.width));
        frame.height = Math.max(8, Math.min(100 - frame.y, frame.height));
        frame.imgScale = Math.max(1, Math.min(3, frame.imgScale));
        frame.imgX = Math.max(-100, Math.min(100, frame.imgX));
        frame.imgY = Math.max(-100, Math.min(100, frame.imgY));
        return frame;
      }

      function startPreviewFrameDrag(event) {
        if (!isEditablePreview) return;
        // Se modo de desenho de setas está ativo, não permitir arrastar frames
        if (arrowDrawMode && Number(event.currentTarget.dataset.environmentIndex) === arrowDrawMode.environmentIndex && Number(event.currentTarget.dataset.pageIndex) === arrowDrawMode.pageIndex) return;
        if (event.target.closest('.preview-frame-tools, .frame-selection-toolbar, .annotation-edit-row, [data-drag-annotation], [data-resize-frame]')) return;
        event.preventDefault();
        const node = event.currentTarget;
        const key = frameKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.frameIndex);
        // Não selecionar frame se estamos em qualquer modo de seta
        if (arrowDrawMode) return;
        if (event.shiftKey || event.ctrlKey || event.metaKey) toggleFrameSelection(key);
        else if (!selectedFrameKeys.has(key)) selectSingleFrame(key);
        if (event.target.closest('[data-editable-frame-image]')) return;
        const frame = pageFrame(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.frameIndex));
        const canvas = node.closest('.page-frames');
        if (!frame || !canvas) return;
        const canvasRect = canvas.getBoundingClientRect();
        const startX = event.clientX;
        const startY = event.clientY;
        const selected = [...selectedFrameKeys].map((selectedKey) => {
          const [environmentIndex, pageIndex, frameIndex] = selectedKey.split(':').map(Number);
          const selectedFrame = pageFrame(environmentIndex, pageIndex, frameIndex);
          const selectedNode = document.querySelector(`[data-draggable-frame][data-environment-index="${environmentIndex}"][data-page-index="${pageIndex}"][data-frame-index="${frameIndex}"]`);
          return selectedFrame && selectedNode ? { frame: selectedFrame, node: selectedNode, x: Number(selectedFrame.x || 0), y: Number(selectedFrame.y || 0) } : null;
        }).filter(Boolean);

        const move = (pointerEvent) => {
          const dx = ((pointerEvent.clientX - startX) / canvasRect.width) * 100;
          const dy = ((pointerEvent.clientY - startY) / canvasRect.height) * 100;
          selected.forEach((item) => {
            item.frame.x = Math.max(0, Math.min(100 - Number(item.frame.width || 20), item.x + dx));
            item.frame.y = Math.max(0, Math.min(100 - Number(item.frame.height || 20), item.y + dy));
            item.node.style.left = `${item.frame.x}%`;
            item.node.style.top = `${item.frame.y}%`;
          });
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function startPreviewFrameResize(event) {
        if (!isEditablePreview) return;
        // Se modo de desenho de setas está ativo, não permitir redimensionar frames
        const node = event.currentTarget.closest('.doc-photo-frame');
        if (arrowDrawMode && Number(node?.dataset.environmentIndex) === arrowDrawMode.environmentIndex && Number(node?.dataset.pageIndex) === arrowDrawMode.pageIndex) return;
        event.preventDefault();
        event.stopPropagation();
        const frame = pageFrame(Number(node?.dataset.environmentIndex), Number(node?.dataset.pageIndex), Number(node?.dataset.frameIndex));
        const canvas = node?.closest('.page-frames');
        if (!frame || !canvas || !node) return;
        selectSingleFrame(frameKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.frameIndex));
        const handle = event.currentTarget.dataset.resizeFrame || 'se';
        const canvasRect = canvas.getBoundingClientRect();
        const startX = event.clientX;
        const startY = event.clientY;
        const initial = {
          x: Number(frame.x || 0),
          y: Number(frame.y || 0),
          width: Number(frame.width || 20),
          height: Number(frame.height || 20),
        };

        const move = (pointerEvent) => {
          const dw = ((pointerEvent.clientX - startX) / canvasRect.width) * 100;
          const dh = ((pointerEvent.clientY - startY) / canvasRect.height) * 100;
          if (handle.includes('e')) frame.width = Math.max(8, Math.min(100 - initial.x, initial.width + dw));
          if (handle.includes('s')) frame.height = Math.max(8, Math.min(100 - initial.y, initial.height + dh));
          if (handle.includes('w')) {
            const nextX = Math.max(0, Math.min(initial.x + initial.width - 8, initial.x + dw));
            frame.x = nextX;
            frame.width = Math.max(8, Math.min(100 - nextX, initial.width + (initial.x - nextX)));
          }
          if (handle.includes('n')) {
            const nextY = Math.max(0, Math.min(initial.y + initial.height - 8, initial.y + dh));
            frame.y = nextY;
            frame.height = Math.max(8, Math.min(100 - nextY, initial.height + (initial.y - nextY)));
          }
          node.style.left = `${frame.x}%`;
          node.style.top = `${frame.y}%`;
          node.style.width = `${frame.width}%`;
          node.style.height = `${frame.height}%`;
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function handleFrameDragOver(event) {
        if (!isEditablePreview) return;
        event.preventDefault();
        event.currentTarget.classList.add('drag-over');
      }

      function handleFrameDragLeave(event) {
        event.currentTarget.classList.remove('drag-over');
      }

      function handleFrameDrop(event) {
        if (!isEditablePreview) return;
        event.preventDefault();
        const node = event.currentTarget;
        node.classList.remove('drag-over');
        const frame = pageFrame(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.frameIndex));
        if (!frame) return;
        const photoSrc = event.dataTransfer?.getData('text/dcoratto-photo') || event.dataTransfer?.getData('text/plain');
        const file = event.dataTransfer?.files?.[0];
        if (file && file.type.startsWith('image/')) {
          readPhoto(file, 0).then(photo => {
            frame.photo = photo.src;
            persistAndRender();
          });
          return;
        }
        if (photoSrc && photoSrc.startsWith('data:image')) {
          frame.photo = photoSrc;
          persistAndRender();
        }
      }

      function handleDetailImageDrop(event) {
        if (!isEditablePreview) return;
        event.preventDefault();
        const node = event.currentTarget;
        node.classList.remove('drag-over');
        const annotation = pageAnnotation(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.annotationIndex));
        if (!annotation) return;
        const photoSrc = event.dataTransfer?.getData('text/dcoratto-photo') || event.dataTransfer?.getData('text/plain');
        const file = event.dataTransfer?.files?.[0];
        if (file && file.type.startsWith('image/')) {
          readPhoto(file, 0).then(photo => {
            annotation.image = photo.src;
            persistAndRender();
          });
          return;
        }
        if (photoSrc) {
          annotation.image = photoSrc;
          persistAndRender();
        }
      }

      function startPageArrowDraw(event) {
        if (!isEditablePreview || !arrowDrawMode) return;
        if (event.target.closest('.preview-frame-tools, .frame-selection-toolbar, .page-annotation-toolbar, .page-detail-frame, .page-free-element, [data-page-annotation-line], [data-resize-frame], [data-drag-page-annotation], [contenteditable="true"]')) return;
        const pageNode = event.currentTarget;
        const environmentIndex = Number(pageNode.dataset.environmentIndex);
        const pageIndex = Number(pageNode.dataset.pageIndex);
        if (environmentIndex !== arrowDrawMode.environmentIndex || pageIndex !== arrowDrawMode.pageIndex) return;
        event.preventDefault();
        event.stopPropagation();
        const page = environmentPage(environmentIndex, pageIndex);
        if (!page) return;
        page.annotations = Array.isArray(page.annotations) ? page.annotations : [];
        const start = pagePoint(event, pageNode);
        const startClient = { x: event.clientX, y: event.clientY };
        const dragThreshold = 3;
        let annotation = null;
        let line = null;
        let arrowHead = null;

        clearFrameSelection();

        const ensureDraftAnnotation = () => {
          if (annotation) return;
          const isDetailMode = arrowDrawMode?.type === 'detail-image';
          annotation = {
            id: `page-ann-${Date.now()}-${Math.random().toString(16).slice(2, 7)}`,
            type: isDetailMode ? 'detail-image' : 'text',
            text: isDetailMode ? '' : 'Texto da seta',
            fromX: start.x,
            fromY: start.y,
            toX: start.x,
            toY: start.y,
            ...pageAnnotationDefaults,
          };
          if (isDetailMode) {
            annotation.image = '';
            annotation.detailShape = 'circle';
            annotation.detailSize = 16;
            annotation.detailBorderColor = pageAnnotationArrowColor(annotation);
            annotation.detailBorderWidth = 1.2;
          }
          page.annotations.push(annotation);
          const annotationIndex = page.annotations.length - 1;
          selectedPageAnnotationKeys.add(pageAnnotationKey(environmentIndex, pageIndex, annotationIndex));
          line = document.createElement('span');
          line.setAttribute('class', 'page-annotation-line');
          line.style.setProperty('--arrow-color', pageAnnotationArrowColor(annotation));
          line.style.setProperty('--arrow-width-px', `${annotation.arrowWidth}px`);
          arrowHead = document.createElement('span');
          arrowHead.setAttribute('class', 'page-annotation-arrow-head');
          arrowHead.style.setProperty('--arrow-color', pageAnnotationArrowColor(annotation));
          pageNode.append(line, arrowHead);
        };

        const move = (pointerEvent) => {
          const distance = Math.hypot(pointerEvent.clientX - startClient.x, pointerEvent.clientY - startClient.y);
          if (distance < dragThreshold) return;
          ensureDraftAnnotation();
          const end = pagePoint(pointerEvent, pageNode);
          annotation.fromX = end.x;
          annotation.fromY = end.y;
          updatePageAnnotationLine(line, annotation, pageNode);
          updatePageAnnotationArrowHead(arrowHead, annotation, pageNode);
        };

        const up = (pointerEvent) => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          const distance = Math.hypot(pointerEvent.clientX - startClient.x, pointerEvent.clientY - startClient.y);
          if (!annotation && distance < dragThreshold) return;
          ensureDraftAnnotation();
          const end = pagePoint(pointerEvent, pageNode);
          annotation.fromX = end.x;
          annotation.fromY = end.y;
          updatePageAnnotationLine(line, annotation, pageNode);
          updatePageAnnotationArrowHead(arrowHead, annotation, pageNode);
          persistAndRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function startPageAnnotationMove(event) {
        if (!isEditablePreview) return;
        event.preventDefault();
        event.stopPropagation();
        const node = event.currentTarget;
        const pageNode = node.closest('[data-page-frames]');
        const annotation = pageAnnotation(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.annotationIndex));
        if (!pageNode || !annotation) return;
        selectSinglePageAnnotation(pageAnnotationKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.annotationIndex));
        const start = pagePoint(event, pageNode);
        const initial = {
          fromX: Number(annotation.fromX || 0),
          fromY: Number(annotation.fromY || 0),
          toX: Number(annotation.toX || 0),
          toY: Number(annotation.toY || 0),
        };
        const id = `${node.dataset.environmentIndex}-${node.dataset.pageIndex}-${node.dataset.annotationIndex}`;
        const label = pageNode.querySelector(`[data-page-annotation-text="${id}"]`);
        const detailFrame = pageNode.querySelector(`[data-page-detail-frame="${id}"]`);
        const head = pageNode.querySelector(`[data-page-annotation-head="${id}"]`);
        const tail = pageNode.querySelector(`[data-page-annotation-tail="${id}"]`);
        const arrowHead = pageNode.querySelector(`[data-page-annotation-arrow-head="${id}"]`);
        const toolbar = pageNode.querySelector(`[data-page-annotation-toolbar][data-environment-index="${node.dataset.environmentIndex}"][data-page-index="${node.dataset.pageIndex}"][data-annotation-index="${node.dataset.annotationIndex}"]`);

        const move = (pointerEvent) => {
          const point = pagePoint(pointerEvent, pageNode);
          const dx = point.x - start.x;
          const dy = point.y - start.y;
          annotation.fromX = Math.max(0, Math.min(100, initial.fromX + dx));
          annotation.fromY = Math.max(0, Math.min(100, initial.fromY + dy));
          annotation.toX = Math.max(0, Math.min(100, initial.toX + dx));
          annotation.toY = Math.max(0, Math.min(100, initial.toY + dy));
          updatePageAnnotationLine(node, annotation, pageNode);
          if (label) {
            updatePageAnnotationText(label, annotation, pageNode);
          }
          updatePageDetailFrame(detailFrame, annotation);
          if (tail) {
            tail.style.left = `${annotation.fromX}%`;
            tail.style.top = `${annotation.fromY}%`;
          }
          if (head) {
            head.style.left = `${annotation.toX}%`;
            head.style.top = `${annotation.toY}%`;
          }
          updatePageAnnotationArrowHead(arrowHead, annotation, pageNode);
          if (toolbar) {
            toolbar.style.left = `${annotation.fromX}%`;
            toolbar.style.top = `${annotation.fromY}%`;
          }
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function startPageAnnotationDrag(event) {
        if (!isEditablePreview) return;
        event.preventDefault();
        event.stopPropagation();
        const node = event.currentTarget;
        const pageNode = node.closest('[data-page-frames]');
        const annotation = pageAnnotation(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.annotationIndex));
        if (!pageNode || !annotation) return;
        selectSinglePageAnnotation(pageAnnotationKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.annotationIndex));
        const handle = node.dataset.dragPageAnnotation;
        const keyX = handle === 'head' ? 'toX' : 'fromX';
        const keyY = handle === 'head' ? 'toY' : 'fromY';

        const move = (pointerEvent) => {
          const point = pagePoint(pointerEvent, pageNode);
          annotation[keyX] = point.x;
          annotation[keyY] = point.y;
          const id = `${node.dataset.environmentIndex}-${node.dataset.pageIndex}-${node.dataset.annotationIndex}`;
          const line = pageNode.querySelector(`[data-page-annotation-line="${id}"]`);
          const label = pageNode.querySelector(`[data-page-annotation-text="${id}"]`);
          const detailFrame = pageNode.querySelector(`[data-page-detail-frame="${id}"]`);
          const head = pageNode.querySelector(`[data-page-annotation-head="${id}"]`);
          const tail = pageNode.querySelector(`[data-page-annotation-tail="${id}"]`);
          const arrowHead = pageNode.querySelector(`[data-page-annotation-arrow-head="${id}"]`);
          updatePageAnnotationLine(line, annotation, pageNode);
          if (handle === 'text' && label) {
            updatePageAnnotationText(label, annotation, pageNode);
          }
          if (handle === 'text' && detailFrame) {
            updatePageDetailFrame(detailFrame, annotation);
          }
          if (handle === 'text') {
            if (tail) {
              tail.style.left = `${point.x}%`;
              tail.style.top = `${point.y}%`;
            }
            const toolbar = pageNode.querySelector(`[data-page-annotation-toolbar][data-environment-index="${node.dataset.environmentIndex}"][data-page-index="${node.dataset.pageIndex}"][data-annotation-index="${node.dataset.annotationIndex}"]`);
            if (toolbar) {
              toolbar.style.left = `${point.x}%`;
              toolbar.style.top = `${point.y}%`;
            }
          }
          if (handle === 'head' && head) {
            head.style.left = `${point.x}%`;
            head.style.top = `${point.y}%`;
          }
          updatePageAnnotationArrowHead(arrowHead, annotation, pageNode);
          updatePageAnnotationText(label, annotation, pageNode);
          updatePageDetailFrame(detailFrame, annotation);
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function updateFrameImageTransform(frameNode, frame) {
        const image = frameNode?.querySelector('[data-editable-frame-image]');
        if (!image || !frame) return;
        image.style.transform = `translate(${Number(frame.imgX || 0)}%, ${Number(frame.imgY || 0)}%) scale(${Number(frame.imgScale || 1)})`;
      }

      function updateFreeImageTransform(node, element) {
        const image = node?.querySelector('img');
        if (!image || !element) return;
        image.style.transform = `translate(${Number(element.imgX || 0)}%, ${Number(element.imgY || 0)}%) scale(${Number(element.imgScale || 1)})`;
      }

      function toggleFreeImageCrop(node) {
        if (!isEditablePreview || !node) return;
        const element = freeElement(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.elementIndex));
        if (!element || element.type !== 'image') return;
        element.cropMode = !element.cropMode;
        selectSingleFreeElement(freeElementKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.elementIndex));
        persistAndRender();
      }

      function startFrameImagePan(event) {
        if (!isEditablePreview) return;
        const frameNode = event.currentTarget.closest('.doc-photo-frame');
        // Se modo de desenho de setas está ativo, não permitir mover a imagem
        if (arrowDrawMode && Number(frameNode?.dataset.environmentIndex) === arrowDrawMode.environmentIndex && Number(frameNode?.dataset.pageIndex) === arrowDrawMode.pageIndex) return;
        const frame = pageFrame(Number(frameNode?.dataset.environmentIndex), Number(frameNode?.dataset.pageIndex), Number(frameNode?.dataset.frameIndex));
        if (!frame || !frame.editImage) return;
        event.preventDefault();
        event.stopPropagation();
        selectSingleFrame(frameKey(frameNode.dataset.environmentIndex, frameNode.dataset.pageIndex, frameNode.dataset.frameIndex));
        const startX = event.clientX;
        const startY = event.clientY;
        const initial = { x: Number(frame.imgX || 0), y: Number(frame.imgY || 0) };

        const move = (pointerEvent) => {
          const rect = frameNode.getBoundingClientRect();
          frame.imgX = Math.max(-100, Math.min(100, initial.x + ((pointerEvent.clientX - startX) / rect.width) * 100));
          frame.imgY = Math.max(-100, Math.min(100, initial.y + ((pointerEvent.clientY - startY) / rect.height) * 100));
          updateFrameImageTransform(frameNode, frame);
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function startFreeElementDrag(event) {
        if (!isEditablePreview) return;
        if (event.target.closest('.free-element-toolbar')) return;
        const node = event.currentTarget;
        const pageNode = node.closest('[data-page-frames]');
        const element = freeElement(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.elementIndex));
        if (!pageNode || !element) return;
        event.preventDefault();
        event.stopPropagation();
        selectSingleFreeElement(freeElementKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.elementIndex));

        if (element.type === 'image' && element.cropMode && event.detail !== 2) {
          const startX = event.clientX;
          const startY = event.clientY;
          const rect = node.getBoundingClientRect();
          const initial = { x: Number(element.imgX || 0), y: Number(element.imgY || 0) };
          const moveCrop = (pointerEvent) => {
            element.imgX = Math.max(-100, Math.min(100, initial.x + ((pointerEvent.clientX - startX) / rect.width) * 100));
            element.imgY = Math.max(-100, Math.min(100, initial.y + ((pointerEvent.clientY - startY) / rect.height) * 100));
            updateFreeImageTransform(node, element);
          };
          const upCrop = () => {
            window.removeEventListener('pointermove', moveCrop);
            window.removeEventListener('pointerup', upCrop);
            persistWithoutRender();
          };
          window.addEventListener('pointermove', moveCrop);
          window.addEventListener('pointerup', upCrop);
          return;
        }

        const start = pagePoint(event, pageNode);
        const initial = { x: Number(element.x || 0), y: Number(element.y || 0) };
        const move = (pointerEvent) => {
          const point = pagePoint(pointerEvent, pageNode);
          element.x = Math.max(0, Math.min(96, initial.x + point.x - start.x));
          element.y = Math.max(0, Math.min(96, initial.y + point.y - start.y));
          node.style.left = `${element.x}%`;
          node.style.top = `${element.y}%`;
        };
        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function startPreviewAnnotationDrag(event) {
        if (!isEditablePreview) return;
        event.preventDefault();
        event.stopPropagation();
        const node = event.currentTarget;
        const frameNode = node.closest('.doc-photo-frame');
        const annotation = frameAnnotation(
          Number(node.dataset.environmentIndex),
          Number(node.dataset.pageIndex),
          Number(node.dataset.frameIndex),
          Number(node.dataset.annotationIndex),
        );
        if (!frameNode || !annotation) return;
        const handle = node.dataset.dragAnnotation;
        const keyX = handle === 'label' ? 'fromX' : 'toX';
        const keyY = handle === 'label' ? 'fromY' : 'toY';

        const move = (pointerEvent) => {
          const rect = frameNode.getBoundingClientRect();
          const x = Math.max(0, Math.min(100, ((pointerEvent.clientX - rect.left) / rect.width) * 100));
          const y = Math.max(0, Math.min(100, ((pointerEvent.clientY - rect.top) / rect.height) * 100));
          annotation[keyX] = x;
          annotation[keyY] = y;
          const id = `${node.dataset.environmentIndex}-${node.dataset.pageIndex}-${node.dataset.frameIndex}-${node.dataset.annotationIndex}`;
          const line = frameNode.querySelector(`[data-annotation-line="${id}"]`);
          const label = frameNode.querySelector(`[data-annotation-label="${id}"]`);
          const target = frameNode.querySelector(`[data-annotation-target="${id}"]`);
          if (handle === 'label') {
            if (line) { line.setAttribute('x1', `${x}%`); line.setAttribute('y1', `${y}%`); }
            if (label) { label.style.left = `${x}%`; label.style.top = `${y}%`; }
          } else {
            if (line) { line.setAttribute('x2', `${x}%`); line.setAttribute('y2', `${y}%`); }
            if (target) { target.style.left = `${x}%`; target.style.top = `${y}%`; }
          }
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function renderEnvironment(environment, index) {
        const photos = normalizePhotos(environment.photos);
        const layout = environment.layout || suggestDefaultLayout(photos.length);
        return `
          <section class="environment" id="${slug(environment.title)}">
            <div class="section-heading">
              <span class="section-number">${escapeHTML(environment.number || String(index + 1).padStart(2, '0'))}</span>
              <h2>${escapeHTML(environment.title)}</h2>
              <span class="section-line"></span>
            </div>
            ${isEditablePreview ? `<div class="mural-tools">
              <div class="layout-suggestions">
                ${layoutSuggestions(photos.length).map((suggestion) => `
                  <button type="button" class="${layout === suggestion.key ? 'active' : ''}" data-environment-index="${index}" data-layout="${suggestion.key}">
                    ${suggestion.label}
                  </button>

              </div>
              <label class="photo-upload">

              </label>
            </div>` : ''}
            <div class="portfolio-layout">
              <div class="photo-mural layout-${escapeAttribute(layout)}">
                ${photos.map((photo, photoIndex) => `
                  <button class="photo-card ${tileClass(photoIndex, photos.length, layout)}" type="button" draggable="true" data-photo-src="${escapeAttribute(photo.src)}" data-lightbox-src="${escapeAttribute(photo.src)}" data-lightbox-title="${escapeAttribute(photo.title)}">
                    <img src="${escapeAttribute(photo.src)}" alt="${escapeAttribute(photo.title)}" draggable="true" data-photo-src="${escapeAttribute(photo.src)}" />
                    <span class="photo-index">${String(photoIndex + 1).padStart(2, '0')}</span>
                    <span class="photo-label">${escapeHTML(photo.title || `Vista ${photoIndex + 1}`)}</span>
                  </button>
                `).join('')}
              </div>
              <aside class="info-panel">
                ${renderSpec('Tamponamentos', environment.specs?.tamponamentos)}
                ${renderSpec('Portas', environment.specs?.portas)}
                ${renderSpec('Puxadores', environment.specs?.puxadores)}
                ${renderSpec('Corrediças', environment.specs?.corredicas)}
                <div class="spec-group">
                  <span class="spec-title">Cores</span>
                  <div class="colors">
                    ${(environment.colors || []).map((color) => `
                      <div class="color-item">
                        <span class="color-dot" style="background-color:${escapeAttribute(color.hex)};${color.textureUrl ? `background-image:url('${escapeAttribute(color.textureUrl)}')` : ''}"></span>
                        <span class="color-name">${escapeHTML(color.name)}${color.quality ? ' / '+escapeHTML(color.quality) : ''}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
                <div class="notes">
                  ${(environment.notes || []).map((note) => `<p>${escapeHTML(note)}</p>`).join('')}
                </div>
                <div class="client-footer">${escapeHTML(documentData.client.address || '')}</div>
              </aside>
            </div>
          </section>
          ${(environment.pages || []).map((page, pageIndex) => renderEnvironmentPage(environment, page, index, pageIndex)).join('')}
        `;
      }

      function renderEnvironmentPage(environment, page, environmentIndex, pageIndex) {
        const pageNumber = page.number || `${String(environmentIndex + 1).padStart(2, '0')}.${String(pageIndex + 1).padStart(2, '0')}`;
        const frames = normalizeFrames(page);
        return `
          <section class="environment-page ${isEditablePreview ? 'editable' : ''}" id="${slug(environment.title)}-${slug(page.title || `pagina-${pageIndex + 1}`)}">
            <div class="page-fixed-title">
              <strong>${escapeHTML(documentData.projectType || 'Projeto Inicial')}</strong>
              <span>${escapeHTML(environment.title)}</span>
            </div>
            <div class="cover-kicker" style="color:#8f7044;text-align:center;margin-bottom:10px">${escapeHTML(pageNumber)} · ${escapeHTML(page.title || `Página ${pageIndex + 1}`)}</div>
            ${page.description ? `<p class="page-description">${escapeHTML(page.description)}</p>` : ''}
            ${isEditablePreview ? `
              <div class="mural-tools" style="justify-content:center;margin:0 0 24px;padding-left:0">
                <button type="button" class="photo-upload" data-add-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}">Adicionar moldura</button>
                <button type="button" class="photo-upload" data-page-arrow-button data-environment-index="${environmentIndex}" data-page-index="${pageIndex}">Seta para texto</button>
                <button type="button" class="photo-upload" data-page-detail-button data-environment-index="${environmentIndex}" data-page-index="${pageIndex}">Seta com imagem</button>
                <button type="button" class="photo-upload history-action" data-history-undo disabled>Desfazer</button>
                <button type="button" class="photo-upload history-action" data-history-redo disabled>Refazer</button>
              </div>
            ` : ''}
            <div class="page-frames" data-page-frames data-environment-index="${environmentIndex}" data-page-index="${pageIndex}">
              ${frames.map((frame, frameIndex) => renderDocumentFrame(frame, page, frameIndex, environmentIndex, pageIndex)).join('')}
              ${renderPageAnnotations(page, environmentIndex, pageIndex)}
              ${renderFreeElements(page, environmentIndex, pageIndex)}
            </div>
          </section>
        `;
      }

      function renderFreeElements(page, environmentIndex, pageIndex) {
        page.freeElements = Array.isArray(page.freeElements) ? page.freeElements : [];
        return page.freeElements.map((element, elementIndex) => {
          const key = freeElementKey(environmentIndex, pageIndex, elementIndex);
          const selected = selectedFreeElementKeys.has(key);
          const type = element.type === 'image' ? 'image' : 'text';
          const style = [
            `left:${Number(element.x ?? 50)}%`,
            `top:${Number(element.y ?? 50)}%`,
            `width:${Number(element.width ?? (type === 'image' ? 22 : 24))}%`,
            `height:${Number(element.height ?? (type === 'image' ? 16 : 8))}%`,
            `--text-color:${escapeAttribute(element.textColor || '#f7f2ea')}`,
            `--text-size:${Number(element.fontSize || 22)}px`,
          ].join(';');
          const imageStyle = `transform:translate(${Number(element.imgX || 0)}%, ${Number(element.imgY || 0)}%) scale(${Number(element.imgScale || 1)})`;
          return `
            <div
              data-free-element="${environmentIndex}-${pageIndex}-${elementIndex}"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-element-index="${elementIndex}"
              class="page-free-element type-${type} ${selected ? 'is-selected' : ''} ${element.cropMode ? 'is-cropping' : ''}"
              style="${style}"
            >
              ${isEditablePreview ? `
                <span class="free-element-toolbar">
                  ${type === 'image' ? `
                    <button type="button" data-free-crop-toggle data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-element-index="${elementIndex}">${element.cropMode ? 'Concluir' : 'Recortar'}</button>
                    <input type="range" min="1" max="3" step="0.05" value="${Number(element.imgScale || 1)}" data-free-crop-zoom data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-element-index="${elementIndex}">
                  ` : `
                    <button type="button" data-free-crop-toggle data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-element-index="${elementIndex}">Texto</button>
                  `}
                </span>
              ` : ''}
              ${type === 'image'
                ? `<img src="${escapeAttribute(element.src || fallbackImage)}" alt="Imagem colada" draggable="false" style="${imageStyle}">`
                : `${escapeHTML(element.text || 'Texto')}`}
            </div>
          `;
        }).join('');
      }

      function renderPageAnnotations(page, environmentIndex, pageIndex) {
        page.annotations = Array.isArray(page.annotations) ? page.annotations : [];
        return `
          ${page.annotations.map((annotation, annotationIndex) => {
            const zIndex = 30 + annotationIndex;
            return `
            <span
              data-page-annotation-line="${environmentIndex}-${pageIndex}-${annotationIndex}"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-annotation-index="${annotationIndex}"
              class="page-annotation-line ${selectedPageAnnotationKeys.has(pageAnnotationKey(environmentIndex, pageIndex, annotationIndex)) ? 'is-selected' : ''}"
              style="left:${Number(annotation.fromX ?? 30)}%;top:${Number(annotation.fromY ?? 30)}%;z-index:${zIndex};--arrow-color:${escapeAttribute(pageAnnotationArrowColor(annotation))};--arrow-width:${Number(annotation.arrowWidth ?? 0.9)};--arrow-width-px:${Number(annotation.arrowWidth ?? 0.9)}px;--arrow-angle:${pageAnnotationAngle(annotation)}deg"
            ></span>
          `;
          }).join('')}
          ${page.annotations.map((annotation, annotationIndex) => {
            const zIndex = 30 + annotationIndex;
            return `
            <span
              data-page-annotation-arrow-head="${environmentIndex}-${pageIndex}-${annotationIndex}"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-annotation-index="${annotationIndex}"
              class="page-annotation-arrow-head"
              style="left:${Number(annotation.toX ?? 20)}%;top:${Number(annotation.toY ?? 20)}%;z-index:${zIndex};--arrow-color:${escapeAttribute(pageAnnotationArrowColor(annotation))};--arrow-angle:${pageAnnotationAngle(annotation)}deg"
            ></span>
          `;
          }).join('')}
          ${page.annotations.map((annotation, annotationIndex) => {
            const zIndex = 30 + annotationIndex;
            const annotationId = `${environmentIndex}-${pageIndex}-${annotationIndex}`;
            const detail = isDetailAnnotation(annotation);
            const detailShape = pageDetailShape(annotation);
            const detailSize = pageDetailSize(annotation);
            const detailHeight = detailShape === 'circle'
              ? detailSize
              : Math.max(6, Math.min(28, Number(annotation.detailHeight ?? detailSize * .68)));
            return `
            <span
              data-page-annotation-toolbar
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-annotation-index="${annotationIndex}"
              class="page-annotation-toolbar ${detail ? 'detail-toolbar' : ''}"
              style="left:${Number(annotation.fromX ?? 30)}%;top:${Number(annotation.fromY ?? 30)}%;z-index:${zIndex + 15}"
            >
              ${detail ? `
                <label>
                  Foto
                  <input type="file" accept="image/*" data-detail-image-input data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">
                </label>
                <select class="shape-select" data-detail-shape data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">
                  <option value="circle" ${detailShape === 'circle' ? 'selected' : ''}>Circulo</option>
                  <option value="rounded" ${detailShape === 'rounded' ? 'selected' : ''}>Arred.</option>
                  <option value="rectangle" ${detailShape === 'rectangle' ? 'selected' : ''}>Retang.</option>
                </select>
                <input type="number" min="7" max="34" step="1" title="Tamanho" value="${detailSize}" data-detail-size data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">
                <input type="color" title="Borda" value="${escapeAttribute(annotation.detailBorderColor || pageAnnotationArrowColor(annotation))}" data-detail-border-color data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">
                <input type="number" min="0.4" max="2.5" step="0.1" title="Seta" value="${Number(annotation.arrowWidth ?? 0.9)}" data-page-annotation-style="arrowWidth" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">
              ` : `
                <input type="color" title="Cor do texto" value="${escapeAttribute(pageAnnotationTextColor(annotation))}" data-page-annotation-style="textColor" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">
                <input type="color" title="Cor da seta" value="${escapeAttribute(pageAnnotationArrowColor(annotation))}" data-page-annotation-style="arrowColor" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">
                <input type="number" min="9" max="32" step="1" title="Fonte" value="${Number(annotation.fontSize ?? 15)}" data-page-annotation-style="fontSize" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">
                <input type="number" min="0.4" max="2.5" step="0.1" title="Seta" value="${Number(annotation.arrowWidth ?? 0.9)}" data-page-annotation-style="arrowWidth" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">
                <button type="button" class="${annotation.textShadow !== 'none' ? 'active' : ''}" data-page-annotation-toggle="textShadow" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">Sombra</button>
                <button type="button" class="${annotation.textBorder ? 'active' : ''}" data-page-annotation-toggle="textBorder" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">Borda</button>
              `}
            </span>
            ${isEditablePreview ? `<span
              data-page-annotation-tail="${environmentIndex}-${pageIndex}-${annotationIndex}"
              data-drag-page-annotation="text"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-annotation-index="${annotationIndex}"
              class="page-arrow-point ${selectedPageAnnotationKeys.has(pageAnnotationKey(environmentIndex, pageIndex, annotationIndex)) ? 'is-selected' : ''}"
              style="left:${Number(annotation.fromX ?? 30)}%;top:${Number(annotation.fromY ?? 30)}%;z-index:${zIndex + 20}"
            ></span>` : ''}
            ${detail ? `
              <span
                data-page-detail-frame="${annotationId}"
                data-drag-page-annotation="text"
                data-environment-index="${environmentIndex}"
                data-page-index="${pageIndex}"
                data-annotation-index="${annotationIndex}"
                class="page-detail-frame shape-${escapeAttribute(detailShape)} ${selectedPageAnnotationKeys.has(pageAnnotationKey(environmentIndex, pageIndex, annotationIndex)) ? 'is-selected' : ''}"
                style="left:${Number(annotation.fromX ?? 30)}%;top:${Number(annotation.fromY ?? 30)}%;z-index:${zIndex + 20};--detail-width:${detailSize}%;--detail-height:${detailHeight}%;--detail-border-color:${escapeAttribute(annotation.detailBorderColor || pageAnnotationArrowColor(annotation))};--detail-border-width:${Number(annotation.detailBorderWidth ?? 1.2)}px"
              >
                ${annotation.image ? `<img src="${escapeAttribute(annotation.image)}" alt="Detalhe" draggable="false">` : '<span class="page-detail-placeholder">Imagem do detalhe</span>'}
              </span>
            ` : `
              <span
                data-page-annotation-text="${environmentIndex}-${pageIndex}-${annotationIndex}"
                data-environment-index="${environmentIndex}"
                data-page-index="${pageIndex}"
                data-annotation-index="${annotationIndex}"
                class="page-annotation-text"
                contenteditable="${isEditablePreview ? 'true' : 'false'}"
                style="left:${Number(annotation.fromX ?? 30)}%;top:${Number(annotation.fromY ?? 30)}%;z-index:${zIndex + 20};${pageAnnotationTextPlacementStyle(annotation)};--text-color:${escapeAttribute(pageAnnotationTextColor(annotation))};--text-size:${Number(annotation.fontSize ?? 15)}px;--text-shadow:${annotation.textShadow === 'none' ? 'none' : '0 1px 4px rgba(0,0,0,.65)'};--text-stroke:${annotation.textBorder ? `.35px ${escapeAttribute(pageAnnotationArrowColor(annotation))}` : '0 transparent'}"
              >${escapeHTML(annotation.text || 'Texto da seta')}</span>
            `}
            ${isEditablePreview ? `<span
              data-page-annotation-head="${environmentIndex}-${pageIndex}-${annotationIndex}"
              data-drag-page-annotation="head"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-annotation-index="${annotationIndex}"
              class="page-arrow-point ${selectedPageAnnotationKeys.has(pageAnnotationKey(environmentIndex, pageIndex, annotationIndex)) ? 'is-selected' : ''}"
              style="left:${Number(annotation.toX ?? 20)}%;top:${Number(annotation.toY ?? 20)}%;z-index:${zIndex + 20}"
            ></span>` : ''}
          `;
          }).join('')}
        `;
      }

      function normalizeFrames(page) {
        if (Array.isArray(page.frames) && page.frames.length) {
          page.frames.forEach((frame, index) => {
            frame.id ||= `frame-${Date.now()}-${Math.random().toString(16).slice(2, 7)}`;
            frame.title ||= `Moldura ${index + 1}`;
            frame.photo ||= frame.photos?.[0]?.src || '';
            frame.shape ||= 'rounded';
            frame.annotations = [];
            applyFrameLayout(frame, index);
          });
          return page.frames;
        }
        return [];
      }

      function renderDocumentFrame(frame, page, frameIndex, environmentIndex, pageIndex) {
        applyFrameLayout(frame, frameIndex);
        const hasPhoto = Boolean(frame.photo);
        const shape = ['circle', 'square', 'rounded', 'rectangle'].includes(frame.shape) ? frame.shape : 'rounded';
        const frameStyle = `left:${Number(frame.x)}%;top:${Number(frame.y)}%;width:${Number(frame.width)}%;height:${Number(frame.height)}%`;
        const imageStyle = `transform:translate(${Number(frame.imgX || 0)}%, ${Number(frame.imgY || 0)}%) scale(${Number(frame.imgScale || 1)})`;
        const handles = ['nw','n','ne','e','se','s','sw','w'].map(handle => `<span class="frame-resize-handle" data-resize-frame="${handle}"></span>`).join('');
        return `
          <div
            class="doc-photo-frame is-positioned shape-${escapeAttribute(shape)} ${frame.editImage ? 'is-editing-image' : ''}"
            style="${frameStyle}"
            ${isEditablePreview ? `data-draggable-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}"` : ''}
          >
            ${isEditablePreview ? renderFramePreviewTools(frame, environmentIndex, pageIndex, frameIndex) : ''}
            <div class="frame-clip">
              ${hasPhoto ? `<img src="${escapeAttribute(frame.photo)}" alt="${escapeAttribute(frame.title || page.title)}" draggable="true" data-photo-src="${escapeAttribute(frame.photo)}" data-editable-frame-image style="${imageStyle}" />` : '<span class="doc-frame-empty">Moldura sem foto</span>'}
              ${isEditablePreview ? '<span class="drop-hint">Solte a foto aqui</span>' : ''}
              <span class="doc-frame-title">${String(frameIndex + 1).padStart(2, '0')} · ${escapeHTML(frame.title || 'Moldura')}</span>
            </div>
            ${isEditablePreview ? `
              <span class="frame-selection-toolbar">
                <button type="button" data-copy-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">Copiar</button>
                <button type="button" data-paste-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">Colar</button>
                <button type="button" data-duplicate-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">Duplicar</button>
                <button type="button" data-edit-image data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">${frame.editImage ? 'Mover moldura' : 'Editar foto'}</button>
                <label>Zoom <input type="range" min="1" max="3" step="0.05" value="${Number(frame.imgScale || 1)}" data-image-zoom data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}"></label>
                <button type="button" data-delete-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">Excluir</button>
                <button type="button" data-open-frame-menu data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">...</button>
              </span>
              ${handles}
            ` : ''}
          </div>
        `;
      }
      function renderFramePreviewTools(frame, environmentIndex, pageIndex, frameIndex) {
        return `
          <div class="preview-frame-tools">
            <label>
              Foto
              <input type="file" accept="image/*" data-frame-photo-input data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">
            </label>
            <select class="shape-select" data-frame-shape data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">
              <option value="rounded" ${frame.shape === 'rounded' ? 'selected' : ''}>Arred.</option>
              <option value="rectangle" ${frame.shape === 'rectangle' ? 'selected' : ''}>Retâng.</option>
              <option value="square" ${frame.shape === 'square' ? 'selected' : ''}>Quadr.</option>
              <option value="circle" ${frame.shape === 'circle' ? 'selected' : ''}>Círculo</option>
            </select>
            <button type="button" data-add-annotation data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">Seta</button>
          </div>
        `;
      }
      function renderSpec(title, value) {
        if (!value) return '';
        return `
          <div class="spec-group">
            <span class="spec-title">${title}</span>
            <div class="spec-value">${escapeHTML(value)}</div>
          </div>
        `;
      }

      function normalizePhotos(photos) {
        const list = photos && photos.length ? photos : [{ title: 'Vista 1', src: fallbackImage }];
        return list.map((photo, index) => ({
          title: photo.title || `Vista ${index + 1}`,
          src: photo.src || fallbackImage,
        }));
      }

      function layoutSuggestions(count) {
        if (count <= 1) return [{ key: 'single', label: 'Imagem unica' }];
        if (count === 2) return [
          { key: 'balanced', label: 'Meio a meio' },
          { key: 'editorial', label: 'Editorial' },
        ];
        if (count === 3) return [
          { key: 'balanced', label: '1 maior + 2 apoio' },
          { key: 'top-heavy', label: '3 alinhadas' },
          { key: 'editorial', label: 'Editorial' },
        ];
        if (count === 4) return [
          { key: 'balanced', label: 'Grade 2x2' },
          { key: 'editorial', label: 'Imagem destaque' },
        ];
        if (count === 5) return [
          { key: 'top-heavy', label: '3 em cima / 2 embaixo' },
          { key: 'bottom-heavy', label: '2 em cima / 3 embaixo' },
          { key: 'editorial', label: 'Editorial' },
        ];
        return [
          { key: 'balanced', label: 'Grade fluida' },
          { key: 'top-heavy', label: 'Ritmo horizontal' },
          { key: 'editorial', label: 'Editorial' },
        ];
      }

      function suggestDefaultLayout(count) {
        if (count === 1) return 'single';
        if (count === 5) return 'top-heavy';
        return 'balanced';
      }

      function tileClass(index, count, layout) {
        if (count === 1 || layout === 'single') return 'tile-full';
        if (count === 2 && layout !== 'editorial') return 'tile-half';

        if (layout === 'top-heavy') {
          if (count === 5) return index < 3 ? 'tile-third' : 'tile-half';
          return 'tile-third';
        }

        if (layout === 'bottom-heavy') {
          if (count === 5) return index < 2 ? 'tile-half' : 'tile-third';
          return index % 5 < 2 ? 'tile-half' : 'tile-third';
        }

        if (layout === 'editorial') {
          if (index % 6 === 0) return 'tile-hero';
          if (index % 6 === 1) return 'tile-tall';
          if (index % 6 === 2) return 'tile-wide';
          return 'tile-small';
        }

        if (count === 3) return index === 0 ? 'tile-hero' : 'tile-small';
        if (count === 4) return 'tile-half';
        if (count === 5) return index < 2 ? 'tile-half' : 'tile-third';
        return index % 5 < 2 ? 'tile-half' : 'tile-third';
      }

      function readPhoto(file, index) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve({
            title: `Vista ${index + 1}`,
            src: reader.result,
          });
          reader.readAsDataURL(file);
        });
      }

      function isDefaultEnvironmentPhoto(photo) {
        const src = String(photo?.src || '');
        const title = String(photo?.title || '').toLowerCase();
        return !src
          || src === fallbackImage
          || (src.startsWith('data:image/svg+xml') && (src.includes('AMBIENTE') || src.includes('IMAGEM%20DO%20AMBIENTE')))
          || (title.includes('imagem do ambiente') && src.startsWith('data:image/svg+xml'));
      }

      function persistAndRender() {
        safePersistDocument();
        rememberDocumentHistory();
        postPortfolioSync();
        renderDocument();
      }

      function persistWithoutRender() {
        safePersistDocument();
        rememberDocumentHistory();
        postPortfolioSync();
      }

      function safePersistDocument() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(documentData));
        } catch (error) {
          console.warn('Nao foi possivel salvar o documento completo no armazenamento local. A edicao visual continua ativa.', error);
        }
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.classList.remove('lightbox-open');
        lightboxImage.removeAttribute('src');
      }

      function slug(value) {
        return String(value || 'ambiente')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/(^-|-$)/g, '');
      }

      function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        }[char]));
      }

      function escapeAttribute(value) {
        return escapeHTML(value).replace(/`/g, '&#96;');
      }
    </script>
  </body>
</html>
