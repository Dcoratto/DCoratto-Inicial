<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>D'coratto | Portfolio HTML</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500;600&family=Allura:wght@400&family=Dancingscript:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root {
        --bg: #080807;
        --panel: #11100e;
        --line: rgba(184, 151, 106, .18);
        --gold: #b8976a;
        --gold-soft: #d7c2a7;
        --muted: #8a8070;
        --text: #f7f2ea;
        --danger: #ff6a55;
      }

      body.client-view {
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      body.client-view * {
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      body.client-view .page-annotation-line,
      body.client-view .page-annotation-arrow-head,
      body.client-view .page-annotation-text,
      body.client-view .page-detail-frame,
      body.client-view .page-free-element,
      body.client-view .page-arrow-point,
      body.client-view .doc-annotation-line,
      body.client-view .doc-annotation-text {
        pointer-events: none !important;
      }

      body.client-view .page-annotation-toolbar,
      body.client-view .frame-selection-toolbar,
      body.client-view .preview-frame-tools,
      body.client-view .frame-resize-handle,
      body.client-view .page-arrow-point,
      body.client-view .frame-context-menu,
      body.client-view .free-element-toolbar,
      body.client-view .annotation-edit-row {
        display: none !important;
      }

      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Montserrat', sans-serif;
        font-weight: 300;
      }

      body.lightbox-open { overflow: hidden; }

      body.client-intro-open {
        overflow: auto;
      }

      .client-intro {
        position: relative;
        z-index: 1;
        display: none;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 30%, rgba(184,151,106,.24), transparent 34%),
          radial-gradient(circle at 18% 82%, rgba(215,194,167,.12), transparent 30%),
          linear-gradient(135deg, #070604 0%, #15110c 52%, #050504 100%);
        color: #f8f2e8;
        cursor: default;
      }

      .client-intro.active {
        display: grid;
      }

      .client-intro.is-leaving {
        animation: none;
      }

      .client-intro::before,
      .client-intro::after {
        content: "";
        position: absolute;
        width: 54vmax;
        height: 54vmax;
        border: 1px solid rgba(184,151,106,.14);
        border-radius: 50%;
        animation: introOrb 5s ease-in-out infinite alternate;
      }

      .client-intro::before {
        left: -20vmax;
        top: -24vmax;
      }

      .client-intro::after {
        right: -22vmax;
        bottom: -26vmax;
        animation-delay: .8s;
      }

      .client-intro-card {
        position: relative;
        z-index: 2;
        display: grid;
        width: min(860px, calc(100vw - 42px));
        justify-items: center;
        gap: 22px;
        text-align: center;
        transform: translateY(14px);
      }

      .client-intro-text {
        margin: 0;
        max-width: 780px;
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(29px, 4.2vw, 62px);
        font-weight: 300;
        line-height: 1.04;
        letter-spacing: .015em;
        opacity: 0;
        animation: introTextIn 2.4s ease .4s forwards;
      }

      .client-intro-text span {
        display: block;
        margin-top: 18px;
        color: rgba(248,242,232,.68);
        font-family: 'Montserrat', sans-serif;
        font-size: clamp(10px, 1vw, 13px);
        font-weight: 300;
        letter-spacing: .06em;
        line-height: 1.6;
        text-transform: none;
      }

      .client-intro-text .word-forma {
        display: inline;
        margin: 0 .12em;
        font-family: 'Allura', cursive;
        font-size: 2em;
        font-weight: 400;
        font-style: italic;
        color: #d7c2a7;
        letter-spacing: -.03em;
        text-transform: none !important;
        white-space: nowrap;
        opacity: 0;
        animation: formaHandwriting 3.6s cubic-bezier(.25, .46, .45, .94) 2.8s forwards;
      }

      @keyframes formaHandwriting {
        0% {
          opacity: 0;
          filter: blur(1px);
          transform: scaleX(0.1);
          transform-origin: left center;
        }
        15% {
          opacity: 0.3;
          filter: blur(0.8px);
        }
        40% {
          opacity: 0.7;
          filter: blur(0.3px);
        }
        70% {
          opacity: 1;
          filter: blur(0);
          transform: scaleX(0.95);
        }
        100% {
          opacity: 1;
          filter: blur(0);
          transform: scaleX(1);
        }
      }

      .client-intro-logo {
        display: grid;
        min-height: 58px;
        place-items: center;
        opacity: 0;
        transform: translateY(8px1s ease 6.6);
        animation: introLogoIn 1.2s ease 4.4s forwards;
      }

      .client-intro-logo img {
        max-width: 154px;
        max-height: 54px;
        object-fit: contain;
      }

      .client-intro-logo div {
        color: #f8f2e8;
        font-size: 32px;
        letter-spacing: -.04em;
        line-height: .85;
      }

      .client-intro-logo small {
        display: block;
        margin-left: 66px;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: .02em;
      }

      .client-intro-gesture {
        display: grid;
        justify-items: center;
        gap: 10px;
        margin-top: 8px;
        color: rgba(215,194,167,.86);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: .18em;
        opacity: 0;
        text-transform: uppercase;
        animation: introGestureIn 1s ease 8.6s forwards;
      }

      .client-intro-gesture-icon {
        position: relative;
        width: 34px;
        height: 54px;
        border: 1px solid rgba(215,194,167,.74);
        border-radius: 999px;
      }

      .client-intro-gesture-icon::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 10px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #d7c2a7;
        transform: translateX(-50%);
        animation: introScrollHint 1.2s ease-in-out infinite;
      }

      .client-intro-gesture-icon::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -19px;
        width: 9px;
        height: 9px;
        border-right: 1px solid rgba(215,194,167,.78);
        border-bottom: 1px solid rgba(215,194,167,.78);
        transform: translateX(-50%) rotate(45deg);
        animation: introArrowHint 1.2s ease-in-out infinite;
      }

      @keyframes introTextIn {
        from { opacity: 0; transform: translateY(18px); filter: blur(8px); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }

      @keyframes introLogoIn {
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes introGestureIn {
        to { opacity: 1; }
      }

      @keyframes introScrollHint {
        0% { opacity: .35; transform: translate(-50%, 0); }
        50% { opacity: 1; transform: translate(-50%, 18px); }
        100% { opacity: .35; transform: translate(-50%, 0); }
      }

      @keyframes introArrowHint {
        0%, 100% { opacity: .35; transform: translate(-50%, -2px) rotate(45deg); }
        50% { opacity: 1; transform: translate(-50%, 6px) rotate(45deg); }
      }

      @keyframes introOrb {
        from { transform: scale(.92) rotate(0deg); opacity: .55; }
        to { transform: scale(1.08) rotate(9deg); opacity: 1; }
      }

      @keyframes introFadeOut {
        to { opacity: 0; visibility: hidden; }
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 84px;
        border-bottom: 1px solid var(--line);
        background: rgba(8, 8, 7, .96);
        padding: 0 72px;
        backdrop-filter: blur(12px);
      }

      .logo {
        font-size: 33px;
        font-weight: 300;
        letter-spacing: -.04em;
        line-height: .9;
      }

      .logo small {
        display: block;
        margin-left: 69px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: .02em;
      }

      .logo img {
        max-width: 190px;
        max-height: 58px;
        object-fit: contain;
        display: block;
      }

      .nav {
        display: flex;
        gap: 30px;
        align-items: center;
      }

      .nav a {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: .22em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .nav a:hover { color: var(--gold-soft); }

      .cover {
        display: grid;
        place-items: center;
        min-height: calc(100vh - 84px);
        border-bottom: 1px solid var(--line);
        padding: 72px 28px;
        text-align: center;
      }

      .cover::before {
        content: "";
        width: 1px;
        height: 98px;
        margin-bottom: 58px;
        background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      }

      .cover-kicker {
        color: var(--gold);
        font-size: 12px;
        letter-spacing: .34em;
        margin-bottom: 38px;
        text-transform: uppercase;
      }

      .cover h1 {
        margin: 0;
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(66px, 8vw, 126px);
        font-weight: 300;
        line-height: .9;
      }

      .cover-address {
        margin-top: 28px;
        color: var(--gold);
        font-size: 12px;
        letter-spacing: .24em;
        text-transform: uppercase;
      }

      .cover-brand {
        margin-top: 14px;
        color: rgba(247, 242, 234, .48);
        font-size: 12px;
        letter-spacing: .18em;
      }

      .cover-stats {
        display: inline-grid;
        grid-template-columns: repeat(2, minmax(112px, 1fr));
        gap: 0;
        margin-top: 68px;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }

      .cover-stat {
        padding: 10px 48px;
      }

      .cover-stat + .cover-stat {
        border-left: 1px solid var(--line);
      }

      .cover-stat strong {
        display: block;
        color: var(--gold-soft);
        font-family: 'Cormorant Garamond', serif;
        font-size: 40px;
        font-weight: 300;
        line-height: 1;
      }

      .cover-stat span {
        display: block;
        margin-top: 12px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: .28em;
        text-transform: uppercase;
      }

      .environment {
        min-height: calc(100vh - 84px);
        padding: 34px 60px 76px;
      }

      .environment-page {
        min-height: calc(100vh - 84px);
        padding: 42px 54px 58px;
        border-top: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
      }

      .page-fixed-title {
        text-align: center;
        margin-bottom: 18px;
      }

      .page-fixed-title strong {
        display: block;
        color: var(--text);
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(34px, 4.8vw, 68px);
        font-weight: 300;
        font-style: italic;
        line-height: .9;
        text-transform: none;
      }

      .page-fixed-title span {
        display: block;
        margin-top: 4px;
        color: var(--gold-soft);
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(28px, 4vw, 58px);
        font-weight: 300;
        letter-spacing: .03em;
        text-transform: uppercase;
      }

      .page-description {
        max-width: 760px;
        margin: 0 auto 24px;
        color: rgba(247, 242, 234, .68);
        font-family: Georgia, serif;
        font-size: 18px;
        line-height: 1.55;
        text-align: center;
      }

      .page-frames {
        position: relative;
        min-height: 720px;
        display: block;
      }

      .doc-photo-frame {
        position: relative;
        width: 46%;
        height: 330px;
        min-height: 330px;
        background: transparent;
        overflow: visible;
        border: 0;
        padding: 0;
        color: var(--text);
        cursor: default;
      }

      .doc-photo-frame.is-positioned {
        position: absolute;
        min-height: 0;
        touch-action: none;
      }

      .environment-page.editable .doc-photo-frame {
        outline: 1px dashed rgba(215, 194, 167, .24);
        outline-offset: 2px;
        cursor: move;
      }

      .environment-page.editable .doc-photo-frame:hover,
      .environment-page.editable .doc-photo-frame.is-selected {
        outline: 2px solid #7c46ff;
        outline-offset: 0;
      }

      .doc-photo-frame.shape-circle {
        aspect-ratio: 1 / 1;
        height: auto !important;
        min-height: 0;
      }

      .doc-photo-frame.shape-square {
        aspect-ratio: 1 / 1;
        height: auto !important;
        min-height: 0;
      }

      .doc-photo-frame.shape-rounded .frame-clip {
        border-radius: 28px;
      }

      .doc-photo-frame.shape-rectangle .frame-clip,
      .doc-photo-frame.shape-square .frame-clip {
        border-radius: 0;
      }

      .doc-photo-frame.shape-circle .frame-clip {
        border-radius: 50%;
      }

      .frame-clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border: 1px solid rgba(184, 151, 106, .18);
        background: #15120f;
        box-shadow: 0 24px 60px rgba(0, 0, 0, .26);
      }

      .doc-photo-frame img {
        width: 100%;
        height: 100%;
        min-height: inherit;
        object-fit: cover;
        display: block;
        transform-origin: center;
        user-select: none;
      }

      .environment-page.editable .doc-photo-frame.is-editing-image img {
        cursor: grab;
      }

      .photo-card img {
        -webkit-user-drag: element;
      }

      .drop-hint {
        position: absolute;
        inset: 14px;
        z-index: 6;
        display: none;
        place-items: center;
        border: 1px dashed rgba(215,194,167,.45);
        color: var(--gold-soft);
        background: rgba(8,8,7,.72);
        font-size: 10px;
        letter-spacing: .18em;
        text-transform: uppercase;
        pointer-events: none;
      }

      .environment-page.editable .doc-photo-frame.drag-over .drop-hint {
        display: grid;
      }

      .doc-frame-empty {
        display: grid;
        place-items: center;
        min-height: inherit;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      .doc-frame-title {
        position: absolute;
        left: 18px;
        bottom: 15px;
        z-index: 2;
        color: rgba(215,194,167,.72);
        font-size: 10px;
        letter-spacing: .14em;
        text-transform: uppercase;
      }

      .doc-annotation-layer {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .page-annotation-line {
        position: absolute;
        z-index: 30;
        display: block;
        width: 1px;
        height: 14px;
        cursor: move;
        pointer-events: auto;
        transform: translateY(-50%) rotate(var(--arrow-angle, 0deg));
        transform-origin: 0 50%;
      }

      .page-annotation-line::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: var(--arrow-width-px, 1px);
        border-radius: 999px;
        background: var(--arrow-color, #111);
        transform: translateY(-50%);
      }

      .page-annotation-line.is-selected {
        filter: drop-shadow(0 0 2px rgba(124,70,255,.55));
      }

      .page-annotation-arrow-head {
        position: absolute;
        z-index: 31;
        width: 7px;
        height: 7px;
        background: var(--arrow-color, #111);
        clip-path: polygon(100% 50%, 0 0, 0 100%);
        pointer-events: none;
        transform: translate(-100%, -50%) rotate(var(--arrow-angle, 0deg));
        transform-origin: 100% 50%;
      }

      .page-annotation-text {
        position: absolute;
        z-index: 31;
        min-width: 120px;
        max-width: 260px;
        color: var(--text-color, #111);
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: var(--text-size, 15px);
        line-height: 1.25;
        letter-spacing: .02em;
        outline: 0;
        pointer-events: auto;
        text-shadow: var(--text-shadow, 0 1px 0 rgba(255,255,255,.75));
        -webkit-text-stroke: var(--text-stroke, 0 transparent);
        text-align: var(--text-align, left);
        transform: translate(var(--text-offset-x, 8px), var(--text-offset-y, -50%));
      }

      .page-annotation-text.is-selected {
        outline: 1px solid rgba(124,70,255,.7);
        outline-offset: 3px;
      }

      .page-detail-frame {
        position: absolute;
        z-index: 31;
        width: var(--detail-width, 16%);
        height: var(--detail-height, 16%);
        min-width: 92px;
        min-height: 72px;
        transform: translate(-50%, -50%);
        overflow: hidden;
        border: var(--detail-border-width, 1.2px) solid var(--detail-border-color, #d7c2a7);
        background: rgba(21,18,15,.96);
        box-shadow: 0 18px 44px rgba(0,0,0,.38);
        cursor: move;
        pointer-events: auto;
      }

      .page-detail-frame.shape-circle {
        aspect-ratio: 1 / 1;
        height: auto;
        border-radius: 50%;
      }

      .page-detail-frame.shape-rounded {
        border-radius: 26px;
      }

      .page-detail-frame.shape-rectangle {
        border-radius: 2px;
      }

      .page-detail-frame.is-selected {
        outline: 1.5px solid rgba(124,70,255,.9);
        outline-offset: 4px;
      }

      .page-detail-frame.drag-over {
        border-color: #f7f2ea;
        box-shadow: 0 0 0 4px rgba(215,194,167,.14), 0 18px 44px rgba(0,0,0,.38);
      }

      .page-detail-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
        user-select: none;
      }

      .page-detail-placeholder {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        color: rgba(215,194,167,.72);
        font-size: 9px;
        letter-spacing: .16em;
        text-align: center;
        text-transform: uppercase;
        padding: 12px;
      }

      .page-free-element {
        position: absolute;
        z-index: 38;
        min-width: 64px;
        min-height: 36px;
        color: #f7f2ea;
        cursor: move;
        pointer-events: auto;
        touch-action: none;
      }

      .page-free-element.is-selected {
        outline: 1.5px solid rgba(124,70,255,.92);
        outline-offset: 4px;
      }

      .page-free-element.is-cropping {
        outline-color: rgba(215,194,167,.95);
      }

      .page-free-element.type-image {
        overflow: hidden;
        background: rgba(21,18,15,.72);
        box-shadow: 0 18px 44px rgba(0,0,0,.34);
      }

      .page-free-element.type-image img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        transform-origin: center;
        pointer-events: none;
        user-select: none;
      }

      .page-free-element.type-text {
        max-width: 480px;
        color: var(--text-color, #f7f2ea);
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: var(--text-size, 22px);
        line-height: 1.25;
        text-shadow: 0 1px 4px rgba(0,0,0,.58);
        white-space: pre-wrap;
      }

      .page-free-element.type-text.is-selected {
        background: rgba(17,16,14,.26);
      }

      .free-element-toolbar {
        position: absolute;
        left: 50%;
        top: -14px;
        z-index: 48;
        display: none;
        align-items: center;
        gap: 6px;
        transform: translate(-50%, -100%);
        border: 1px solid rgba(17,17,17,.14);
        border-radius: 999px;
        background: rgba(255,255,255,.96);
        box-shadow: 0 10px 30px rgba(0,0,0,.16);
        padding: 6px 8px;
        color: #111;
      }

      .page-free-element.is-selected .free-element-toolbar {
        display: flex;
      }

      .free-element-toolbar button,
      .free-element-toolbar input {
        border: 1px solid rgba(17,17,17,.16);
        border-radius: 7px;
        background: #fff;
        color: #111;
        padding: 5px 8px;
        font-family: 'Montserrat', sans-serif;
        font-size: 10px;
        font-weight: 600;
      }

      .free-element-toolbar input[type="range"] {
        width: 96px;
        padding: 0;
      }

      .page-annotation-toolbar {
        position: absolute;
        z-index: 45;
        display: none;
        align-items: center;
        gap: 6px;
        transform: translate(0, calc(-100% - 12px));
        border: 1px solid rgba(17,17,17,.14);
        border-radius: 999px;
        background: rgba(255,255,255,.96);
        box-shadow: 0 10px 30px rgba(0,0,0,.14);
        padding: 6px 8px;
        pointer-events: auto;
      }

      .page-annotation-toolbar.is-selected { display: flex; }

      .page-annotation-toolbar input[type="color"] {
        width: 28px;
        height: 26px;
        border: 0;
        padding: 0;
        background: transparent;
      }

      .page-annotation-toolbar input[type="number"] {
        width: 48px;
        border: 1px solid rgba(17,17,17,.16);
        border-radius: 7px;
        padding: 5px;
        font-size: 11px;
      }

      .page-annotation-toolbar button {
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #111;
        padding: 6px 8px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }

      .page-annotation-toolbar button.active {

    <script>
      const fallbackImage = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">

          <text x="600" y="390" fill="#d7c2a7" font-family="Arial" font-size="34" text-anchor="middle" letter-spacing="8">D'CORATTO</text>
          <text x="600" y="438" fill="#8a8070" font-family="Arial" font-size="16" text-anchor="middle" letter-spacing="5">IMAGEM DO AMBIENTE</text>
        </svg>
      `);

      const storageKey = 'dcoratto.portfolio.document.v1';
      const isEditablePreview = new URLSearchParams(window.location.search).has('preview');
      const isClientView = Boolean(window.__DCORATTO_CLIENT_VIEW__) && !isEditablePreview;
      
      // Aplicar classe para desabilitar seleção em client view
      if (isClientView) {

      let documentData = window.__DCORATTO_PORTFOLIO_DOCUMENT__
        || JSON.parse(localStorage.getItem(storageKey) || 'null')
        || {
        client: {

        },

      documentData = normalizeDocumentData(documentData);

      let frameClipboard = [];

      let lastClickTime = 0;
      let lastClickTarget = null;
      
      document.addEventListener('pointerdown', (event) => {
        if (!isEditablePreview) return;
        const pageNode = event.target.closest('[data-page-frames]');
        if (pageNode) lastCanvasPasteTarget = pasteTargetFromEvent(event, pageNode);
        if (event.target.closest('button, input, textarea, select, a, [contenteditable="true"], .doc-photo-frame, .page-annotation-text, .page-detail-frame, .page-free-element, .page-annotation-toolbar, .page-annotation-line, .page-arrow-point, .frame-context-menu, .preview-frame-tools, .frame-selection-toolbar')) return;
        
        // Duplo clique desativa arrow draw mode
        const now = Date.now();
        const isDoubleClick = (now - lastClickTime < 300) && (lastClickTarget === event.target);
        if (isDoubleClick && arrowDrawMode) {
          arrowDrawMode = null;
          applyArrowDrawMode();
          lastClickTime = 0;
          return;
        }
        lastClickTime = now;
        lastClickTarget = event.target;
        
        // Clique em área vazia desativa arrow draw mode
        if (arrowDrawMode) {
          arrowDrawMode = null;
          applyArrowDrawMode();
          return;
        }
        
        clearFrameSelection();
      });

      document.addEventListener('keydown', (event) => {
        const target = event.target;
        const isTextEditing = target && (target.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName));
        const isModifierShortcut = event.ctrlKey || event.metaKey;
        if (isEditablePreview && isModifierShortcut && !event.altKey && event.key.toLowerCase() === 'z' && !isTextEditing) {
          event.preventDefault();
          if (event.shiftKey) redoLastAction();
          else undoLastAction();
          return;
        }
        if (isEditablePreview && isModifierShortcut && !event.altKey && event.key.toLowerCase() === 'y' && !isTextEditing) {
          event.preventDefault();
          redoLastAction();
          return;
        }
        if (isTextEditing) return;
        if (event.key === 'Escape') {
          closeLightbox();
          arrowDrawMode = null;
          applyArrowDrawMode();
          clearFrameSelection();
          closeFrameContextMenu();
        }
        if ((event.key === 'Delete' || event.key === 'Backspace') && isEditablePreview && (selectedFrameKeys.size || selectedPageAnnotationKeys.size || selectedFreeElementKeys.size)) {
          event.preventDefault();
          deleteSelectedElements();
        }
        if (!isEditablePreview) return;
        if (isModifierShortcut && event.key.toLowerCase() === 'c') {
          event.preventDefault();
          copySelectedElements();
        }
        if (isModifierShortcut && event.key.toLowerCase() === 'v') {
          if (frameClipboard.length || pageAnnotationClipboard.length || freeElementClipboard.length) {
            event.preventDefault();
            pasteCopiedElements();
          }
        }
        if (isModifierShortcut && event.key.toLowerCase() === 'd') {
          event.preventDefault();
          duplicateSelectedElements();
        }
      });

      document.addEventListener('click', (event) => {
        if (!event.target.closest('.frame-context-menu, [data-open-frame-menu]')) closeFrameContextMenu();
      });

      document.addEventListener('paste', (event) => {
        if (!isEditablePreview) return;
        const target = event.target;
        if (target && (target.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName))) return;
        const pasteTarget = lastCanvasPasteTarget || defaultPasteTargetPage();
        if (!pasteTarget?.page) return;
        const items = Array.from(event.clipboardData?.items || []);
        const imageItem = items.find(item => item.type.startsWith('image/'));
        if (imageItem) {
          event.preventDefault();
          const file = imageItem.getAsFile();
          if (!file) return;
          readPhoto(file, 0).then(photo => addFreeElement(pasteTarget, {
            type: 'image',
            src: photo.src,
            width: 22,
            height: 16,
          }));
          return;
        }
        const text = event.clipboardData?.getData('text/plain');
        if (text && text.trim()) {
          event.preventDefault();
          addFreeElement(pasteTarget, {
            type: 'text',
            text: text.trim(),
            width: 24,
            height: 8,
          });
        }
      });

      window.addEventListener('storage', (event) => {
        if (event.key === storageKey) {
          documentData = normalizeDocumentData(JSON.parse(event.newValue || 'null'));
          renderDocument();
          resetDocumentHistory();
        }
      });

      function normalizeDocumentData(raw) {
        const legacySample = raw?.client?.name === 'Marcos Vinicius'
          && String(raw?.client?.address || '').includes('Eco Park');

        if (!raw || legacySample) {
          return {
            projectType: 'Projeto Inicial',
            year: new Date().getFullYear(),
            branding: { logo: '', companyName: "D'Coratto Sob Medida" },
            client: { name: 'CLIENTE MODELO', address: '', contractNumber: '', manufacturers: [] },
            environments: [],
          };
        }

        return {
          projectType: raw.projectType || 'Projeto Inicial',
          year: raw.year || new Date().getFullYear(),
          branding: {
            logo: raw.branding?.logo || '',
            companyName: raw.branding?.companyName || "D'Coratto Sob Medida",
          },
          client: {
            name: raw.client?.name || 'CLIENTE MODELO',
            address: raw.client?.address || '',
            contractNumber: raw.client?.contractNumber || '',
            manufacturers: raw.client?.manufacturers || [],
          },
          environments: (raw.environments || []).filter(environment => environment && environment.title),
        };
      }

      function loadPageAnnotationDefaults() {
        try {
          const stored = JSON.parse(localStorage.getItem(annotationDefaultsKey) || 'null') || {};
          if (stored.arrowColor === '#111111') stored.arrowColor = '#d7c2a7';
          if (stored.textColor === '#111111') stored.textColor = '#f7f2ea';
          return {
            arrowColor: '#d7c2a7',
            textColor: '#f7f2ea',
            fontSize: 15,
            arrowWidth: 0.9,
            textShadow: 'soft',
            textBorder: false,
            ...stored,
          };
        } catch {
          return { arrowColor: '#d7c2a7', textColor: '#f7f2ea', fontSize: 15, arrowWidth: 0.9, textShadow: 'soft', textBorder: false };
        }
      }

      function savePageAnnotationDefaults(annotation) {
        pageAnnotationDefaults = {
          arrowColor: annotation.arrowColor || '#d7c2a7',
          textColor: annotation.textColor || '#f7f2ea',
          fontSize: Number(annotation.fontSize ?? 15),
          arrowWidth: Number(annotation.arrowWidth ?? 0.9),
          textShadow: annotation.textShadow || 'soft',
          textBorder: Boolean(annotation.textBorder),
        };
        localStorage.setItem(annotationDefaultsKey, JSON.stringify(pageAnnotationDefaults));
      }

      function serializeDocumentData(data = documentData) {
        try {
          return JSON.stringify(data);
        } catch {
          return '';
        }
      }

      function resetDocumentHistory() {
        undoStack.length = 0;
        redoStack.length = 0;
        lastHistorySnapshot = serializeDocumentData();
        updateHistoryControls();
      }

      function rememberDocumentHistory() {
        const snapshot = serializeDocumentData();
        if (!snapshot) return;
        if (!isEditablePreview || isApplyingHistory) {
          lastHistorySnapshot = snapshot;
          updateHistoryControls();
          return;
        }
        if (snapshot === lastHistorySnapshot) {
          updateHistoryControls();
          return;
        }
        if (lastHistorySnapshot) {
          undoStack.push(lastHistorySnapshot);
          if (undoStack.length > historyLimit) undoStack.shift();
        }
        redoStack.length = 0;
        lastHistorySnapshot = snapshot;
        updateHistoryControls();
      }

      function postPortfolioSync() {
        if (window.parent === window) return;
        window.parent.postMessage({
          type: 'dcoratto:editor-state',
          action: 'portfolio_sync',
          preview: documentData,
          sentAt: new Date().toISOString(),
        }, window.location.origin);
      }

      function restoreHistorySnapshot(snapshot) {
        if (!snapshot) return;
        isApplyingHistory = true;
        try {
          documentData = normalizeDocumentData(JSON.parse(snapshot));
          selectedFrameKeys.clear();
          selectedPageAnnotationKeys.clear();
          arrowDrawMode = null;
          lastHistorySnapshot = serializeDocumentData();
          safePersistDocument();
          postPortfolioSync();
          renderDocument();
        } catch (error) {
          console.warn('Nao foi possivel restaurar o historico do documento.', error);
        } finally {
          isApplyingHistory = false;
          updateHistoryControls();
        }
      }

      function undoLastAction(event) {
        event?.preventDefault?.();
        if (!isEditablePreview || !undoStack.length) return;
        const currentSnapshot = serializeDocumentData();
        const previousSnapshot = undoStack.pop();
        if (currentSnapshot && currentSnapshot !== previousSnapshot) {
          redoStack.push(currentSnapshot);
          if (redoStack.length > historyLimit) redoStack.shift();
        }
        restoreHistorySnapshot(previousSnapshot);
      }

      function redoLastAction(event) {
        event?.preventDefault?.();
        if (!isEditablePreview || !redoStack.length) return;
        const currentSnapshot = serializeDocumentData();
        const nextSnapshot = redoStack.pop();
        if (currentSnapshot && currentSnapshot !== nextSnapshot) {
          undoStack.push(currentSnapshot);
          if (undoStack.length > historyLimit) undoStack.shift();
        }
        restoreHistorySnapshot(nextSnapshot);
      }

      function updateHistoryControls() {
        document.querySelectorAll('[data-history-undo]').forEach((button) => {
          button.disabled = !undoStack.length;
          button.title = undoStack.length ? 'Desfazer ultima acao (Ctrl+Z)' : 'Nada para desfazer';
        });
        document.querySelectorAll('[data-history-redo]').forEach((button) => {
          button.disabled = !redoStack.length;
          button.title = redoStack.length ? 'Refazer ultima acao (Ctrl+Y)' : 'Nada para refazer';
        });
      }

      function renderDocument() {
        renderLogo();
        nav.innerHTML = documentData.environments.map((environment) => `
          <a href="#${slug(environment.title)}">${environment.title}</a>
        `).join('');

        root.innerHTML = `
          ${renderCover()}
          ${documentData.environments.map(renderEnvironment).join('')}
        `;

        bindDocumentEvents();
      }

      function renderLogo() {
        const logo = document.getElementById('documentLogo');
        if (!logo) return;
        if (documentData.branding?.logo) {
          logo.innerHTML = `<img src="${escapeAttribute(documentData.branding.logo)}" alt="D'Coratto Sob Medida">`;
        } else {
          logo.innerHTML = "D'coratto<small>sob medida</small>";
        }
      }

      function renderIntroLogo() {
        const logo = document.getElementById('clientIntroLogo');
        if (!logo) return;
        if (documentData.branding?.logo) {
          logo.innerHTML = `<img src="${escapeAttribute(documentData.branding.logo)}" alt="D'Coratto Sob Medida">`;
        } else {
          logo.innerHTML = "<div>D'coratto<small>sob medida</small></div>";
        }
      }

      function initClientIntro() {
        if (!isClientView || !clientIntro) return;
        renderIntroLogo();
        document.body.insertBefore(clientIntro, document.body.firstElementChild);
        clientIntro.classList.add('active');
        document.body.classList.add('client-intro-open');
        clientIntro.setAttribute('aria-hidden', 'false');
      }

      function renderCover() {
        const environmentsCount = documentData.environments.length;
        const photosCount = documentData.environments.reduce((total, environment) => {
          const pagePhotos = (environment.pages || []).reduce((sum, page) => {
            const framePhotos = Array.isArray(page.frames) ? page.frames.filter(frame => frame.photo).length : 0;
            return sum + framePhotos;
          }, 0);
          return total + normalizePhotos(environment.photos).length + pagePhotos;
        }, 0);

        return `
          <section class="cover">
            <div>
              <div class="cover-kicker">${escapeHTML(documentData.projectType)} - ${escapeHTML(documentData.year)}</div>
              <h1>${escapeHTML(documentData.client.name || 'CLIENTE MODELO')}</h1>
              <div class="cover-address">${escapeHTML(documentData.client.address || '')}</div>
              <div class="cover-brand">${escapeHTML(documentData.branding?.companyName || "D'Coratto Sob Medida")}</div>
              <div class="cover-stats">
                <div class="cover-stat">
                  <strong>${String(environmentsCount).padStart(2, '0')}</strong>
                  <span>Ambientes</span>
                </div>
                <div class="cover-stat">
                  <strong>${String(photosCount).padStart(2, '0')}</strong>
                  <span>Fotos</span>
                </div>
              </div>
            </div>
          </section>
        `;
      }

            if (shouldReplaceCover) environment.photos = photos;

            input.value = '';

          node.addEventListener('contextmenu', (event) => {
            if (!isEditablePreview) return;
            if (event.target.closest('button, input, textarea, select, a, [contenteditable="true"], .doc-photo-frame, .page-annotation-text, .page-detail-frame, .page-free-element, .page-annotation-toolbar, .page-annotation-line, .page-arrow-point, .frame-context-menu, .preview-frame-tools, .frame-selection-toolbar')) return;
            event.preventDefault();
            lastCanvasPasteTarget = pasteTargetFromEvent(event, node);
            clearFrameSelection();
            openCanvasContextMenu(event.clientX, event.clientY);
          });
        });

        document.querySelectorAll('[data-free-element]').forEach((node) => {
          node.addEventListener('pointerdown', startFreeElementDrag);
          node.addEventListener('contextmenu', (event) => {
            if (!isEditablePreview) return;
            event.preventDefault();
            event.stopPropagation();
            selectSingleFreeElement(freeElementKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.elementIndex));
            openCanvasContextMenu(event.clientX, event.clientY);
          });
          node.addEventListener('dblclick', (event) => {
            event.preventDefault();
            event.stopPropagation();
            toggleFreeImageCrop(node);
          });
        });

        document.querySelectorAll('[data-free-crop-toggle]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            toggleFreeImageCrop(button.closest('[data-free-element]'));
          });
        });

        document.querySelectorAll('[data-free-crop-zoom]').forEach((input) => {
          input.addEventListener('input', () => {
            const element = freeElement(Number(input.dataset.environmentIndex), Number(input.dataset.pageIndex), Number(input.dataset.elementIndex));
            if (!element) return;
            element.imgScale = Number(input.value);
            updateFreeImageTransform(input.closest('[data-free-element]'), element);
            persistWithoutRender();
          });
        });

        applyArrowDrawMode();
        updatePageAnnotationGeometry();
        updateHistoryControls();
      }

      function environmentPage(environmentIndex, pageIndex) {
        return documentData.environments?.[environmentIndex]?.pages?.[pageIndex] || null;
      }

      function pageFrame(environmentIndex, pageIndex, frameIndex) {
        const page = environmentPage(environmentIndex, pageIndex);
        if (!page) return null;
        page.frames = Array.isArray(page.frames) ? page.frames : [];
        return page.frames[frameIndex] || null;
      }

      function frameAnnotation(environmentIndex, pageIndex, frameIndex, annotationIndex) {
        const frame = pageFrame(environmentIndex, pageIndex, frameIndex);
        if (!frame) return null;
        frame.annotations = Array.isArray(frame.annotations) ? frame.annotations : [];
        return frame.annotations[annotationIndex] || null;
      }

      function pageAnnotation(environmentIndex, pageIndex, annotationIndex) {
        const page = environmentPage(environmentIndex, pageIndex);
        if (!page) return null;
        page.annotations = Array.isArray(page.annotations) ? page.annotations : [];
        return page.annotations[annotationIndex] || null;
      }

      function freeElement(environmentIndex, pageIndex, elementIndex) {
        const page = environmentPage(environmentIndex, pageIndex);
        if (!page) return null;
        page.freeElements = Array.isArray(page.freeElements) ? page.freeElements : [];
        return page.freeElements[elementIndex] || null;
      }

      function pagePoint(event, pageNode) {
        const rect = pageNode.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(100, ((event.clientX - rect.left) / rect.width) * 100)),
          y: Math.max(0, Math.min(100, ((event.clientY - rect.top) / rect.height) * 100)),
        };
      }

      function pasteTargetFromEvent(event, pageNode) {
        if (!pageNode) return null;
        return {
          environmentIndex: Number(pageNode.dataset.environmentIndex),
          pageIndex: Number(pageNode.dataset.pageIndex),
          page: environmentPage(Number(pageNode.dataset.environmentIndex), Number(pageNode.dataset.pageIndex)),
          point: pagePoint(event, pageNode),
        };
      }

      function defaultPasteTargetPage() {
        const pageNode = document.querySelector('[data-page-frames]');
        if (!pageNode) return null;
        return {
          environmentIndex: Number(pageNode.dataset.environmentIndex),
          pageIndex: Number(pageNode.dataset.pageIndex),
          page: environmentPage(Number(pageNode.dataset.environmentIndex), Number(pageNode.dataset.pageIndex)),
          point: { x: 50, y: 50 },
        };
      }

      function pageAnnotationVector(annotation, pageNode = null) {
        const rect = pageNode?.getBoundingClientRect?.();
        const width = rect?.width || 1;
        const height = rect?.height || 1;
        return {
          dx: (Number(annotation.toX ?? 0) - Number(annotation.fromX ?? 0)) * width / 100,
          dy: (Number(annotation.toY ?? 0) - Number(annotation.fromY ?? 0)) * height / 100,
        };
      }

      function pageAnnotationAngle(annotation, pageNode = null) {
        const { dx, dy } = pageAnnotationVector(annotation, pageNode);
        return Math.atan2(dy, dx) * 180 / Math.PI;
      }

      function pageAnnotationArrowColor(annotation) {
        const color = String(annotation?.arrowColor || '').toLowerCase();
        return !color || color === '#111' || color === '#111111' || color === 'black'
          ? '#d7c2a7'
          : annotation.arrowColor;
      }

      function pageAnnotationTextColor(annotation) {
        const color = String(annotation?.textColor || '').toLowerCase();
        return !color || color === '#111' || color === '#111111' || color === 'black'
          ? '#f7f2ea'
          : annotation.textColor;
      }

      function isDetailAnnotation(annotation) {
        return annotation?.type === 'detail-image';
      }

      function pageDetailShape(annotation) {
        return ['circle', 'rounded', 'rectangle'].includes(annotation?.detailShape)
          ? annotation.detailShape
          : 'circle';
      }

      function pageDetailSize(annotation) {
        const size = Number(annotation?.detailSize ?? 16);
        return Math.max(7, Math.min(34, Number.isFinite(size) ? size : 16));
      }

      function updatePageDetailFrame(node, annotation) {
        if (!node || !annotation) return;
        const size = pageDetailSize(annotation);
        const shape = pageDetailShape(annotation);
        const height = shape === 'circle'
          ? size
          : Math.max(6, Math.min(28, Number(annotation.detailHeight ?? size * .68)));
        node.style.left = `${Number(annotation.fromX ?? 0)}%`;
        node.style.top = `${Number(annotation.fromY ?? 0)}%`;
        node.style.setProperty('--detail-width', `${size}%`);
        node.style.setProperty('--detail-height', `${height}%`);
        node.style.setProperty('--detail-border-color', annotation.detailBorderColor || pageAnnotationArrowColor(annotation));
        node.style.setProperty('--detail-border-width', `${Number(annotation.detailBorderWidth ?? 1.2)}px`);
      }

      function pageAnnotationLength(annotation, pageNode) {
        const { dx, dy } = pageAnnotationVector(annotation, pageNode);
        return Math.max(1, Math.hypot(dx, dy));
      }

      function pageAnnotationTextPlacement(annotation, pageNode = null) {
        const { dx, dy } = pageAnnotationVector(annotation, pageNode);
        const horizontal = Math.abs(dx) >= Math.abs(dy) * 1.15;
        const vertical = Math.abs(dy) >= Math.abs(dx) * 1.15;

        if (horizontal) {
          return dx >= 0
            ? { x: 'calc(-100% - 10px)', y: '-50%', align: 'right' }
            : { x: '10px', y: '-50%', align: 'left' };
        }

        if (vertical) {
          return dy >= 0
            ? { x: '-50%', y: 'calc(-100% - 10px)', align: 'center' }
            : { x: '-50%', y: '10px', align: 'center' };
        }

        return {
          x: dx >= 0 ? 'calc(-100% - 10px)' : '10px',
          y: dy >= 0 ? 'calc(-100% - 8px)' : '8px',
          align: dx >= 0 ? 'right' : 'left',
        };
      }

      function updatePageAnnotationLine(node, annotation, pageNode) {
        if (!node || !annotation) return;
        node.style.left = `${Number(annotation.fromX ?? 0)}%`;
        node.style.top = `${Number(annotation.fromY ?? 0)}%`;
        node.style.width = `${pageAnnotationLength(annotation, pageNode)}px`;
        node.style.setProperty('--arrow-color', pageAnnotationArrowColor(annotation));
        node.style.setProperty('--arrow-width-px', `${Number(annotation.arrowWidth ?? 0.9)}px`);
        node.style.setProperty('--arrow-angle', `${pageAnnotationAngle(annotation, pageNode)}deg`);
      }

      function updatePageAnnotationArrowHead(node, annotation, pageNode) {
        if (!node || !annotation) return;
        node.style.left = `${Number(annotation.toX ?? 0)}%`;
        node.style.top = `${Number(annotation.toY ?? 0)}%`;
        node.style.setProperty('--arrow-color', pageAnnotationArrowColor(annotation));
        node.style.setProperty('--arrow-angle', `${pageAnnotationAngle(annotation, pageNode)}deg`);
      }

      function updatePageAnnotationText(node, annotation, pageNode) {
        if (!node || !annotation) return;
        const placement = pageAnnotationTextPlacement(annotation, pageNode);
        node.style.left = `${Number(annotation.fromX ?? 0)}%`;
        node.style.top = `${Number(annotation.fromY ?? 0)}%`;
        node.style.setProperty('--text-offset-x', placement.x);
        node.style.setProperty('--text-offset-y', placement.y);
        node.style.setProperty('--text-align', placement.align);
      }

      function pageAnnotationTextPlacementStyle(annotation) {
        const placement = pageAnnotationTextPlacement(annotation);
        return `--text-offset-x:${placement.x};--text-offset-y:${placement.y};--text-align:${placement.align}`;
      }

      function updatePageAnnotationGeometry() {
        document.querySelectorAll('[data-page-annotation-line]').forEach((node) => {
          const pageNode = node.closest('[data-page-frames]');
          const annotation = pageAnnotation(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.annotationIndex));
          updatePageAnnotationLine(node, annotation, pageNode);
        });
        document.querySelectorAll('[data-page-annotation-arrow-head]').forEach((node) => {
          const pageNode = node.closest('[data-page-frames]');
          const annotation = pageAnnotation(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.annotationIndex));
          updatePageAnnotationArrowHead(node, annotation, pageNode);
        });
        document.querySelectorAll('[data-page-annotation-text]').forEach((node) => {
          const pageNode = node.closest('[data-page-frames]');
          const annotation = pageAnnotation(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.annotationIndex));
          updatePageAnnotationText(node, annotation, pageNode);
        });
        document.querySelectorAll('[data-page-detail-frame]').forEach((node) => {
          const annotation = pageAnnotation(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.annotationIndex));
          updatePageDetailFrame(node, annotation);
        });
      }

      function applyArrowDrawMode() {
        document.querySelectorAll('[data-page-frames]').forEach((node) => {
          const active = arrowDrawMode
            && Number(node.dataset.environmentIndex) === arrowDrawMode.environmentIndex
            && Number(node.dataset.pageIndex) === arrowDrawMode.pageIndex;
          node.classList.toggle('arrow-draw-mode', Boolean(active));
          node.classList.toggle('detail-arrow-mode', Boolean(active && arrowDrawMode?.type === 'detail-image'));
        });
      }

      function frameKey(environmentIndex, pageIndex, frameIndex) {
        return `${environmentIndex}:${pageIndex}:${frameIndex}`;
      }

      function selectSingleFrame(key) {
        selectedFrameKeys.clear();
        selectedPageAnnotationKeys.clear();
        selectedFrameKeys.add(key);
        applyElementSelectionClasses();
      }

      function toggleFrameSelection(key) {
        if (selectedFrameKeys.has(key)) selectedFrameKeys.delete(key);
        else selectedFrameKeys.add(key);
        selectedPageAnnotationKeys.clear();
        applyElementSelectionClasses();
      }

      function clearFrameSelection() {
        selectedFrameKeys.clear();
        selectedPageAnnotationKeys.clear();
        selectedFreeElementKeys.clear();
        applyElementSelectionClasses();
      }

      function ensureFrameButtonSelection(node) {
        const key = frameKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.frameIndex);
        if (!selectedFrameKeys.has(key)) selectSingleFrame(key);
      }

      function pageAnnotationKey(environmentIndex, pageIndex, annotationIndex) {
        return `page-ann:${environmentIndex}:${pageIndex}:${annotationIndex}`;
      }

      function selectSinglePageAnnotation(key) {
        selectedFrameKeys.clear();
        selectedPageAnnotationKeys.clear();
        selectedFreeElementKeys.clear();
        selectedPageAnnotationKeys.add(key);
        applyElementSelectionClasses();
      }

      function freeElementKey(environmentIndex, pageIndex, elementIndex) {
        return `free:${environmentIndex}:${pageIndex}:${elementIndex}`;
      }

      function selectSingleFreeElement(key) {
        selectedFrameKeys.clear();
        selectedPageAnnotationKeys.clear();
        selectedFreeElementKeys.clear();
        selectedFreeElementKeys.add(key);
        applyElementSelectionClasses();
      }

      function applyElementSelectionClasses() {
        document.querySelectorAll('[data-draggable-frame]').forEach((node) => {
          const key = frameKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.frameIndex);
          node.classList.toggle('is-selected', selectedFrameKeys.has(key));
        });
        document.querySelectorAll('[data-page-annotation-text]').forEach((node) => {
          const key = pageAnnotationKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.annotationIndex);
          node.classList.toggle('is-selected', selectedPageAnnotationKeys.has(key));
        });
        document.querySelectorAll('[data-page-detail-frame]').forEach((node) => {
          const key = pageAnnotationKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.annotationIndex);
          node.classList.toggle('is-selected', selectedPageAnnotationKeys.has(key));
        });
        document.querySelectorAll('[data-page-annotation-toolbar]').forEach((node) => {
          const key = pageAnnotationKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.annotationIndex);
          node.classList.toggle('is-selected', selectedPageAnnotationKeys.has(key));
        });
        document.querySelectorAll('.page-arrow-point[data-environment-index]').forEach((node) => {
          const key = pageAnnotationKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.annotationIndex);
          node.classList.toggle('is-selected', selectedPageAnnotationKeys.has(key));
        });
        document.querySelectorAll('[data-page-annotation-line]').forEach((node) => {
          const key = pageAnnotationKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.annotationIndex);
          node.classList.toggle('is-selected', selectedPageAnnotationKeys.has(key));
        });
        document.querySelectorAll('[data-free-element]').forEach((node) => {
          const key = freeElementKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.elementIndex);
          node.classList.toggle('is-selected', selectedFreeElementKeys.has(key));
        });
      }

      function deleteSelectedFrames() {
        const grouped = new Map();
        selectedFrameKeys.forEach((key) => {
          const [environmentIndex, pageIndex, frameIndex] = key.split(':').map(Number);
          const pageKey = `${environmentIndex}:${pageIndex}`;
          if (!grouped.has(pageKey)) grouped.set(pageKey, []);
          grouped.get(pageKey).push(frameIndex);
        });
        grouped.forEach((indexes, pageKey) => {
          const [environmentIndex, pageIndex] = pageKey.split(':').map(Number);
          const page = environmentPage(environmentIndex, pageIndex);
          if (!page || !Array.isArray(page.frames)) return;
          indexes.sort((a, b) => b - a).forEach((index) => page.frames.splice(index, 1));
        });
        selectedFrameKeys.clear();
        persistAndRender();
      }

      function deleteSelectedPageAnnotations() {
        const grouped = new Map();
        selectedPageAnnotationKeys.forEach((key) => {
          const [, environmentIndex, pageIndex, annotationIndex] = key.split(':').map((value, index) => index ? Number(value) : value);
          const groupKey = `${environmentIndex}:${pageIndex}`;
          if (!grouped.has(groupKey)) grouped.set(groupKey, []);
          grouped.get(groupKey).push(annotationIndex);
        });
        grouped.forEach((indexes, groupKey) => {
          const [environmentIndex, pageIndex] = groupKey.split(':').map(Number);
          const page = environmentPage(environmentIndex, pageIndex);
          if (!page || !Array.isArray(page.annotations)) return;
          indexes.sort((a, b) => b - a).forEach((index) => page.annotations.splice(index, 1));
        });
        selectedPageAnnotationKeys.clear();
      }

      function deleteSelectedFreeElements() {
        const grouped = new Map();
        selectedFreeElementKeys.forEach((key) => {
          const [, environmentIndex, pageIndex, elementIndex] = key.split(':').map((value, index) => index ? Number(value) : value);
          const groupKey = `${environmentIndex}:${pageIndex}`;
          if (!grouped.has(groupKey)) grouped.set(groupKey, []);
          grouped.get(groupKey).push(elementIndex);
        });
        grouped.forEach((indexes, groupKey) => {
          const [environmentIndex, pageIndex] = groupKey.split(':').map(Number);
          const page = environmentPage(environmentIndex, pageIndex);
          if (!page || !Array.isArray(page.freeElements)) return;
          indexes.sort((a, b) => b - a).forEach((index) => page.freeElements.splice(index, 1));
        });
        selectedFreeElementKeys.clear();
      }

      function deleteSelectedElements() {
        if (selectedFrameKeys.size) deleteSelectedFrames();
        else if (selectedFreeElementKeys.size) {
          deleteSelectedFreeElements();
          persistAndRender();
        }
        else {
          deleteSelectedPageAnnotations();
          persistAndRender();
        }
      }

      function selectedFrameRefs() {
        return [...selectedFrameKeys].map((key) => {
          const [environmentIndex, pageIndex, frameIndex] = key.split(':').map(Number);
          const page = environmentPage(environmentIndex, pageIndex);
          const frame = pageFrame(environmentIndex, pageIndex, frameIndex);
          return page && frame ? { key, environmentIndex, pageIndex, frameIndex, page, frame } : null;
        }).filter(Boolean);
      }

      function selectedPageAnnotationRefs() {
        return [...selectedPageAnnotationKeys].map((key) => {
          const [, environmentIndexRaw, pageIndexRaw, annotationIndexRaw] = key.split(':');
          const environmentIndex = Number(environmentIndexRaw);
          const pageIndex = Number(pageIndexRaw);
          const annotationIndex = Number(annotationIndexRaw);
          const page = environmentPage(environmentIndex, pageIndex);
          const annotation = pageAnnotation(environmentIndex, pageIndex, annotationIndex);
          return page && annotation ? { key, environmentIndex, pageIndex, annotationIndex, page, annotation } : null;
        }).filter(Boolean);
      }

      function selectedFreeElementRefs() {
        return [...selectedFreeElementKeys].map((key) => {
          const [, environmentIndexRaw, pageIndexRaw, elementIndexRaw] = key.split(':');
          const environmentIndex = Number(environmentIndexRaw);
          const pageIndex = Number(pageIndexRaw);
          const elementIndex = Number(elementIndexRaw);
          const page = environmentPage(environmentIndex, pageIndex);
          const element = freeElement(environmentIndex, pageIndex, elementIndex);
          return page && element ? { key, environmentIndex, pageIndex, elementIndex, page, element } : null;
        }).filter(Boolean);
      }

      function cloneFrame(frame, offset = 3) {
        const clone = JSON.parse(JSON.stringify(frame));
        clone.id = `frame-${Date.now()}-${Math.random().toString(16).slice(2, 7)}`;
        clone.title = `${clone.title || 'Moldura'} cópia`;
        clone.x = Math.max(0, Math.min(92, Number(clone.x || 0) + offset));
        clone.y = Math.max(0, Math.min(92, Number(clone.y || 0) + offset));
        clone.editImage = false;
        return clone;
      }

      function copySelectedFrames() {
        const refs = selectedFrameRefs();
        if (!refs.length) return;
        frameClipboard = refs.map(ref => JSON.parse(JSON.stringify(ref.frame)));
        pageAnnotationClipboard = [];
        freeElementClipboard = [];
      }

      function copySelectedPageAnnotations() {
        const refs = selectedPageAnnotationRefs();
        if (!refs.length) return;
        pageAnnotationClipboard = refs.map(ref => JSON.parse(JSON.stringify(ref.annotation)));
        frameClipboard = [];
        freeElementClipboard = [];
      }

      function copySelectedFreeElements() {
        const refs = selectedFreeElementRefs();
        if (!refs.length) return;
        freeElementClipboard = refs.map(ref => JSON.parse(JSON.stringify(ref.element)));
        frameClipboard = [];
        pageAnnotationClipboard = [];
      }

      function copySelectedElements() {
        if (selectedFrameKeys.size) copySelectedFrames();
        if (selectedPageAnnotationKeys.size) copySelectedPageAnnotations();
        if (selectedFreeElementKeys.size) copySelectedFreeElements();
      }

      function pasteTargetPage() {
        const ref = selectedFrameRefs()[0];
        if (ref?.page) return ref;
        const annotationRef = selectedPageAnnotationRefs()[0];
        if (annotationRef?.page) return annotationRef;
        const freeRef = selectedFreeElementRefs()[0];
        if (freeRef?.page) return {
          ...freeRef,
          point: {
            x: Math.max(0, Math.min(96, Number(freeRef.element.x || 50) + 4)),
            y: Math.max(0, Math.min(96, Number(freeRef.element.y || 50) + 4)),
          },
        };
        if (lastCanvasPasteTarget?.page) return lastCanvasPasteTarget;
        const page = documentData.environments?.[0]?.pages?.[0] || null;
        return page ? { environmentIndex: 0, pageIndex: 0, page, point: { x: 50, y: 50 } } : null;
      }

      function pasteCopiedFrames() {
        const target = pasteTargetPage();
        if (!target?.page || !frameClipboard.length) return;
        const page = target.page;
        page.frames = Array.isArray(page.frames) ? page.frames : [];
        const start = page.frames.length;
        frameClipboard.forEach((frame, index) => page.frames.push(cloneFrame(frame, 4 + index * 2)));
        selectedFrameKeys.clear();
        frameClipboard.forEach((_, index) => selectedFrameKeys.add(frameKey(target.environmentIndex, target.pageIndex, start + index)));
        persistAndRender();
      }

      function pasteCopiedPageAnnotations() {
        const target = pasteTargetPage();
        if (!target?.page || !pageAnnotationClipboard.length) return;
        target.page.annotations = Array.isArray(target.page.annotations) ? target.page.annotations : [];
        const start = target.page.annotations.length;
        pageAnnotationClipboard.forEach((annotation, index) => {
          const clone = JSON.parse(JSON.stringify(annotation));
          clone.id = `page-ann-${Date.now()}-${Math.random().toString(16).slice(2, 7)}`;
          clone.fromX = Math.max(0, Math.min(100, Number(clone.fromX || 0) + 4 + index * 2));
          clone.fromY = Math.max(0, Math.min(100, Number(clone.fromY || 0) + 4 + index * 2));
          clone.toX = Math.max(0, Math.min(100, Number(clone.toX || 0) + 4 + index * 2));
          clone.toY = Math.max(0, Math.min(100, Number(clone.toY || 0) + 4 + index * 2));
          target.page.annotations.push(clone);
        });
        selectedPageAnnotationKeys.clear();
        selectedFrameKeys.clear();
        pageAnnotationClipboard.forEach((_, index) => selectedPageAnnotationKeys.add(pageAnnotationKey(target.environmentIndex, target.pageIndex, start + index)));
        persistAndRender();
      }

      function addFreeElement(target, element) {
        if (!target?.page) return;
        target.page.freeElements = Array.isArray(target.page.freeElements) ? target.page.freeElements : [];
        const point = target.point || { x: 50, y: 50 };
        const next = {
          id: `free-${Date.now()}-${Math.random().toString(16).slice(2, 7)}`,
          type: element.type || 'text',
          text: element.text || '',
          src: element.src || '',
          x: Math.max(0, Math.min(96, Number(point.x ?? 50))),
          y: Math.max(0, Math.min(96, Number(point.y ?? 50))),
          width: Number(element.width || (element.type === 'image' ? 22 : 24)),
          height: Number(element.height || (element.type === 'image' ? 16 : 8)),
          fontSize: Number(element.fontSize || 22),
          textColor: element.textColor || '#f7f2ea',
          imgScale: Number(element.imgScale || 1),
          imgX: Number(element.imgX || 0),
          imgY: Number(element.imgY || 0),
          cropMode: false,
        };
        target.page.freeElements.push(next);
        selectedFrameKeys.clear();
        selectedPageAnnotationKeys.clear();
        selectedFreeElementKeys.clear();
        selectedFreeElementKeys.add(freeElementKey(target.environmentIndex, target.pageIndex, target.page.freeElements.length - 1));
        persistAndRender();
      }

      function pasteCopiedFreeElements() {
        const target = pasteTargetPage();
        if (!target?.page || !freeElementClipboard.length) return;
        target.page.freeElements = Array.isArray(target.page.freeElements) ? target.page.freeElements : [];
        const start = target.page.freeElements.length;
        const base = target.point || { x: 50, y: 50 };
        freeElementClipboard.forEach((element, index) => {
          const clone = JSON.parse(JSON.stringify(element));
          clone.id = `free-${Date.now()}-${Math.random().toString(16).slice(2, 7)}`;
          clone.x = Math.max(0, Math.min(96, Number(base.x ?? clone.x ?? 50) + index * 2));
          clone.y = Math.max(0, Math.min(96, Number(base.y ?? clone.y ?? 50) + index * 2));
          clone.cropMode = false;
          target.page.freeElements.push(clone);
        });
        selectedFrameKeys.clear();
        selectedPageAnnotationKeys.clear();
        selectedFreeElementKeys.clear();
        freeElementClipboard.forEach((_, index) => selectedFreeElementKeys.add(freeElementKey(target.environmentIndex, target.pageIndex, start + index)));
        persistAndRender();
      }

      function pasteCopiedElements() {
        if (freeElementClipboard.length) pasteCopiedFreeElements();
        else if (pageAnnotationClipboard.length) pasteCopiedPageAnnotations();
        else pasteCopiedFrames();
      }

      function duplicateSelectedFrames() {
        copySelectedFrames();
        pasteCopiedFrames();
      }

      function duplicateSelectedElements() {
        copySelectedElements();
        pasteCopiedElements();
      }

      function openFrameContextMenu(anchor) {
        let menu = document.getElementById('frameContextMenu');
        if (!menu) {
          menu = document.createElement('div');
          menu.id = 'frameContextMenu';
          menu.className = 'frame-context-menu';
          document.body.appendChild(menu);
        }

      function addFrameWithFormat(environmentIndex, pageIndex, formatIndex) {
