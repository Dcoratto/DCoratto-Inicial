      function startFrameImagePan(event) {
        if (!isEditablePreview) return;
        const frameNode = event.currentTarget.closest('.doc-photo-frame');
        // Se modo de desenho de setas está ativo, não permitir mover a imagem
        if (arrowDrawMode && Number(frameNode?.dataset.environmentIndex) === arrowDrawMode.environmentIndex && Number(frameNode?.dataset.pageIndex) === arrowDrawMode.pageIndex) return;
        const frame = pageFrame(Number(frameNode?.dataset.environmentIndex), Number(frameNode?.dataset.pageIndex), Number(frameNode?.dataset.frameIndex));
        if (!frame || !frame.editImage) return;
        event.preventDefault();
        event.stopPropagation();
        selectSingleFrame(frameKey(frameNode.dataset.environmentIndex, frameNode.dataset.pageIndex, frameNode.dataset.frameIndex), { keepImageEdit: true });
        const startX = event.clientX;
        const startY = event.clientY;
        const initial = { x: Number(frame.imgX || 0), y: Number(frame.imgY || 0) };

        const move = (pointerEvent) => {
          const rect = frameNode.getBoundingClientRect();
          frame.imgX = Math.max(-100, Math.min(100, initial.x + ((pointerEvent.clientX - startX) / rect.width) * 100));
          frame.imgY = Math.max(-100, Math.min(100, initial.y + ((pointerEvent.clientY - startY) / rect.height) * 100));
          updateFrameImageTransform(frameNode, frame);
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function startPageDetailImagePan(event, detailNode, annotation) {
        const startX = event.clientX;
        const startY = event.clientY;
        const initial = { x: Number(annotation.imgX || 0), y: Number(annotation.imgY || 0) };

        const move = (pointerEvent) => {
          const rect = detailNode.getBoundingClientRect();
          annotation.imgX = Math.max(-100, Math.min(100, initial.x + ((pointerEvent.clientX - startX) / rect.width) * 100));
          annotation.imgY = Math.max(-100, Math.min(100, initial.y + ((pointerEvent.clientY - startY) / rect.height) * 100));
          updatePageDetailImageTransform(detailNode, annotation);
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function imageDropTargetAt(clientX, clientY, sourceNode) {
        const stack = document.elementsFromPoint(clientX, clientY);
        for (const element of stack) {
          const detailNode = element.closest?.('[data-page-detail-frame]');
          if (detailNode && detailNode !== sourceNode && !sourceNode.contains(detailNode)) {
            return { type: 'detail', node: detailNode };
          }
          const frameNode = element.closest?.('[data-draggable-frame]');
          if (frameNode && frameNode !== sourceNode && !sourceNode.contains(frameNode)) {
            return { type: 'frame', node: frameNode };
          }
        }
        return null;
      }

      function dropFreeImageIntoTarget(sourceNode, element, pointerEvent) {
        if (!element || element.type !== 'image' || !element.src || element.cropMode || !pointerEvent) return false;
        const target = imageDropTargetAt(pointerEvent.clientX, pointerEvent.clientY, sourceNode);
        if (!target) return false;
        const page = environmentPage(Number(sourceNode.dataset.environmentIndex), Number(sourceNode.dataset.pageIndex));
        if (!page || !Array.isArray(page.freeElements)) return false;
        const elementIndex = Number(sourceNode.dataset.elementIndex);

        if (target.type === 'frame') {
          const frame = pageFrame(Number(target.node.dataset.environmentIndex), Number(target.node.dataset.pageIndex), Number(target.node.dataset.frameIndex));
          if (!frame) return false;
          frame.photo = element.src;
          resetFramePhotoPlacement(frame);
          page.freeElements.splice(elementIndex, 1);
          selectedFrameKeys.clear();
          selectedPageAnnotationKeys.clear();
          selectedFreeElementKeys.clear();
          selectedFrameKeys.add(frameKey(target.node.dataset.environmentIndex, target.node.dataset.pageIndex, target.node.dataset.frameIndex));
          persistAndRender();
          return true;
        }

        if (target.type === 'detail') {
          const annotation = pageAnnotation(Number(target.node.dataset.environmentIndex), Number(target.node.dataset.pageIndex), Number(target.node.dataset.annotationIndex));
          if (!annotation) return false;
          setDetailFrameImage(annotation, element.src);
          page.freeElements.splice(elementIndex, 1);
          selectedFrameKeys.clear();
          selectedPageAnnotationKeys.clear();
          selectedFreeElementKeys.clear();
          selectedPageAnnotationKeys.add(pageAnnotationKey(target.node.dataset.environmentIndex, target.node.dataset.pageIndex, target.node.dataset.annotationIndex));
          persistAndRender();
          return true;
        }

        return false;
      }

      function startFreeElementDrag(event) {
        if (!isEditablePreview) return;
        if (event.target.closest('.free-element-toolbar')) return;
        const node = event.currentTarget;
        const pageNode = node.closest('[data-page-frames]');
        const element = freeElement(Number(node.dataset.environmentIndex), Number(node.dataset.pageIndex), Number(node.dataset.elementIndex));
        if (!pageNode || !element) return;
        event.preventDefault();
        event.stopPropagation();
        selectSingleFreeElement(freeElementKey(node.dataset.environmentIndex, node.dataset.pageIndex, node.dataset.elementIndex));

        if (element.type === 'image' && element.cropMode && event.detail !== 2) {
          const startX = event.clientX;
          const startY = event.clientY;
          const rect = node.getBoundingClientRect();
          const initial = { x: Number(element.imgX || 0), y: Number(element.imgY || 0) };
          const moveCrop = (pointerEvent) => {
            element.imgX = Math.max(-100, Math.min(100, initial.x + ((pointerEvent.clientX - startX) / rect.width) * 100));
            element.imgY = Math.max(-100, Math.min(100, initial.y + ((pointerEvent.clientY - startY) / rect.height) * 100));
            updateFreeImageTransform(node, element);
          };
          const upCrop = () => {
            window.removeEventListener('pointermove', moveCrop);
            window.removeEventListener('pointerup', upCrop);
            persistWithoutRender();
          };
          window.addEventListener('pointermove', moveCrop);
          window.addEventListener('pointerup', upCrop);
          return;
        }

        const start = pagePoint(event, pageNode);
        const initial = { x: Number(element.x || 0), y: Number(element.y || 0) };
        const move = (pointerEvent) => {
          const point = pagePoint(pointerEvent, pageNode);
          element.x = Math.max(0, Math.min(96, initial.x + point.x - start.x));
          element.y = Math.max(0, Math.min(96, initial.y + point.y - start.y));
          node.style.left = `${element.x}%`;
          node.style.top = `${element.y}%`;
        };
        const up = (pointerEvent) => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          if (dropFreeImageIntoTarget(node, element, pointerEvent)) return;
          persistWithoutRender();
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function startPreviewAnnotationDrag(event) {
        if (!isEditablePreview) return;
        event.preventDefault();
        event.stopPropagation();
        const node = event.currentTarget;
        const frameNode = node.closest('.doc-photo-frame');
        const annotation = frameAnnotation(
          Number(node.dataset.environmentIndex),
          Number(node.dataset.pageIndex),
          Number(node.dataset.frameIndex),
          Number(node.dataset.annotationIndex),
        );
        if (!frameNode || !annotation) return;
        const handle = node.dataset.dragAnnotation;
        const keyX = handle === 'label' ? 'fromX' : 'toX';
        const keyY = handle === 'label' ? 'fromY' : 'toY';

        const move = (pointerEvent) => {
          const rect = frameNode.getBoundingClientRect();
          const x = Math.max(0, Math.min(100, ((pointerEvent.clientX - rect.left) / rect.width) * 100));
          const y = Math.max(0, Math.min(100, ((pointerEvent.clientY - rect.top) / rect.height) * 100));
          annotation[keyX] = x;
          annotation[keyY] = y;
          const id = `${node.dataset.environmentIndex}-${node.dataset.pageIndex}-${node.dataset.frameIndex}-${node.dataset.annotationIndex}`;
          const line = frameNode.querySelector(`[data-annotation-line="${id}"]`);
          const label = frameNode.querySelector(`[data-annotation-label="${id}"]`);
          const target = frameNode.querySelector(`[data-annotation-target="${id}"]`);
          if (handle === 'label') {
            if (line) { line.setAttribute('x1', `${x}%`); line.setAttribute('y1', `${y}%`); }
            if (label) { label.style.left = `${x}%`; label.style.top = `${y}%`; }
          } else {
            if (line) { line.setAttribute('x2', `${x}%`); line.setAttribute('y2', `${y}%`); }
            if (target) { target.style.left = `${x}%`; target.style.top = `${y}%`; }
          }
        };

        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          persistWithoutRender();
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      }

      function renderEnvironment(environment, index) {
        const photos = normalizePhotos(environment.photos);
        const layout = normalizeMuralLayout(environment.layout, photos.length);
        return `
          <section class="environment" id="${slug(environment.title)}">
            <div class="section-heading">
              <span class="section-number">${escapeHTML(environment.number || String(index + 1).padStart(2, '0'))}</span>
              <h2>${escapeHTML(environment.title)}</h2>
              <span class="section-line"></span>
            </div>
            ${isEditablePreview ? `<div class="mural-tools">
              <div class="layout-suggestions">
                ${layoutSuggestions(photos.length).map((suggestion) => `
                  <button type="button" class="${layout === suggestion.key ? 'active' : ''}" data-environment-index="${index}" data-layout="${suggestion.key}">
                    ${suggestion.label}
                  </button>
                `).join('')}
              </div>
              <label class="photo-upload">
                Adicionar fotos
                <input type="file" accept="image/*" multiple data-photo-input data-environment-index="${index}" />
              </label>
            </div>` : ''}
            <div class="portfolio-layout">
              <div class="photo-mural layout-${escapeAttribute(layout)}">
                ${photos.map((photo, photoIndex) => `
                  <button class="photo-card ${tileClass(photoIndex, photos.length, layout)}" type="button" draggable="true" data-photo-src="${escapeAttribute(photo.src)}" data-lightbox-src="${escapeAttribute(photo.src)}" data-lightbox-title="${escapeAttribute(photo.label)}">
                    <img src="${escapeAttribute(photo.src)}" alt="${escapeAttribute(photo.label || environment.title || 'Foto')}" draggable="true" data-photo-src="${escapeAttribute(photo.src)}" />
                    ${photo.label ? `<span class="photo-label">${escapeHTML(photo.label)}</span>` : ''}
                  </button>
                `).join('')}
              </div>
              <aside class="info-panel">
                ${renderSpec('Tamponamentos', environment.specs?.tamponamentos)}
                ${renderSpec('Portas', environment.specs?.portas)}
                ${renderSpec('Puxadores', environment.specs?.puxadores)}
                ${renderSpec('Corrediças', environment.specs?.corredicas)}
                <div class="spec-group">
                  <span class="spec-title">Cores</span>
                  <div class="colors">
                    ${(environment.colors || []).map((color) => `
                      <div class="color-item">
                        <span class="color-dot" style="background-color:${escapeAttribute(color.hex)};${color.textureUrl ? `background-image:url('${escapeAttribute(color.textureUrl)}')` : ''}"></span>
                        <span class="color-name">${escapeHTML(color.name)}${color.quality ? ' / '+escapeHTML(color.quality) : ''}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
                <div class="notes">
                  ${(environment.notes || []).map((note) => `<p>${escapeHTML(note)}</p>`).join('')}
                </div>
                <div class="client-footer">${escapeHTML(documentData.client.address || '')}</div>
              </aside>
            </div>
          </section>
          ${(environment.pages || []).map((page, pageIndex) => renderEnvironmentPage(environment, page, index, pageIndex)).join('')}
        `;
      }

      function renderEnvironmentPage(environment, page, environmentIndex, pageIndex) {
        const pageNumber = page.number || `${String(environmentIndex + 1).padStart(2, '0')}.${String(pageIndex + 1).padStart(2, '0')}`;
        const frames = normalizeFrames(page);
        const mobileFlow = isClientView ? renderMobileFrameFlow(page, frames, environmentIndex, pageIndex) : '';
        return `
          <section class="environment-page ${isEditablePreview ? 'editable' : ''} ${mobileFlow ? 'has-mobile-flow' : ''}" id="${slug(environment.title)}-${slug(page.title || `pagina-${pageIndex + 1}`)}">
            <div class="page-fixed-title">
              <strong>${escapeHTML(documentData.projectType || 'Projeto Inicial')}</strong>
              <span>${escapeHTML(environment.title)}</span>
            </div>
            <div class="cover-kicker" style="color:#8f7044;text-align:center;margin-bottom:10px">${escapeHTML(pageNumber)} · ${escapeHTML(page.title || `Página ${pageIndex + 1}`)}</div>
            ${page.description ? `<p class="page-description">${escapeHTML(page.description)}</p>` : ''}
            ${isEditablePreview ? `
              <div class="mural-tools" style="justify-content:center;margin:0 0 24px;padding-left:0">
                <button type="button" class="photo-upload" data-add-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}">Adicionar moldura</button>
                <button type="button" class="photo-upload" data-page-arrow-button data-environment-index="${environmentIndex}" data-page-index="${pageIndex}">Seta para texto</button>
                <button type="button" class="photo-upload" data-page-detail-button data-environment-index="${environmentIndex}" data-page-index="${pageIndex}">Seta com imagem</button>
                <button type="button" class="photo-upload history-action" data-history-undo disabled>Desfazer</button>
                <button type="button" class="photo-upload history-action" data-history-redo disabled>Refazer</button>
              </div>
            ` : ''}
            <div class="page-frames" data-page-frames data-environment-index="${environmentIndex}" data-page-index="${pageIndex}">
              ${frames.map((frame, frameIndex) => renderDocumentFrame(frame, page, frameIndex, environmentIndex, pageIndex)).join('')}
              ${renderPageAnnotations(page, environmentIndex, pageIndex)}
              ${renderFreeElements(page, environmentIndex, pageIndex)}
            </div>
            ${mobileFlow}
          </section>
        `;
      }

      function renderMobileFrameFlow(page, frames, environmentIndex, pageIndex) {
        if (!frames.length) return '';
        const frameEntries = frames.map((frame, frameIndex) => ({
          frame,
          frameIndex,
          order: frameIndex,
          callouts: normalizeFrameAnnotations(frame).map((annotation, annotationIndex) =>
            mobileCalloutFromFrameAnnotation(annotation, annotationIndex)
          ).filter(Boolean),
        }));

        const extraCallouts = [];
        (Array.isArray(page.annotations) ? page.annotations : []).forEach((annotation, annotationIndex) => {
          const assigned = nearestMobileFrame(annotation, frameEntries);
          const callout = mobileCalloutFromPageAnnotation(annotation, assigned?.frame, annotationIndex);
          if (!callout) return;
          if (assigned?.entry) assigned.entry.callouts.push(callout);
          else extraCallouts.push(callout);
        });

        const ordered = frameEntries
          .slice()
          .sort((a, b) => (Number(a.frame.y || 0) - Number(b.frame.y || 0)) || (Number(a.frame.x || 0) - Number(b.frame.x || 0)) || (a.order - b.order));

        const frameCards = ordered.map((entry, orderIndex) =>
          renderMobileFrameCard(entry, orderIndex, ordered.length, environmentIndex, pageIndex)
        ).join('');
        const freeElementCards = renderMobileFreeElementCards(page.freeElements);
        const extras = extraCallouts.length ? `
          <div class="mobile-frame-card is-note-card">
            <div class="mobile-feed-counter">Observacoes</div>
            <div class="mobile-frame-callouts">
              ${extraCallouts.map((callout, index) => renderMobileCallout(callout, index)).join('')}
            </div>
          </div>
        ` : '';

        return `<div class="mobile-frame-flow">${frameCards}${extras}${freeElementCards}</div>`;
      }

      function renderMobileFrameCard(entry, orderIndex, totalFrames, environmentIndex, pageIndex) {
        const frame = entry.frame;
        const shape = supportedFrameShapes().includes(frame.shape) ? frame.shape : 'square';
        const hasPhoto = Boolean(frame.photo);
        const callouts = entry.callouts.map((callout, index) => ({
          ...callout,
          marker: index + 1,
        }));
        return `
          <div class="mobile-frame-card shape-${escapeAttribute(shape)}">
            <div class="mobile-feed-counter">Moldura ${String(orderIndex + 1).padStart(2, '0')} / ${String(totalFrames).padStart(2, '0')}</div>
            <button
              class="mobile-frame-media"
              type="button"
              ${hasPhoto ? `data-lightbox-src="${escapeAttribute(frame.photo)}" data-lightbox-title="${escapeAttribute(frame.title || `Moldura ${orderIndex + 1}`)}"` : ''}
            >
              ${hasPhoto
                ? `<img src="${escapeAttribute(frame.photo)}" alt="${escapeAttribute(frame.title || `Moldura ${orderIndex + 1}`)}" loading="lazy">`
                : '<span class="doc-frame-empty">Moldura sem foto</span>'}
              ${renderMobileFrameArrows(callouts, environmentIndex, pageIndex, entry.frameIndex)}
              ${callouts.map((callout) => `
                <span
                  class="mobile-frame-marker"
                  style="left:${callout.start.x}%;top:${callout.start.y}%;--callout-color:${escapeAttribute(callout.color)}"
                >${callout.marker}</span>
              `).join('')}
            </button>
            ${frame.title ? `<div class="mobile-frame-title">${escapeHTML(frame.title)}</div>` : ''}
            ${callouts.length ? `<div class="mobile-frame-callouts">${callouts.map(renderMobileCallout).join('')}</div>` : ''}
          </div>
        `;
      }

      function renderMobileFrameArrows(callouts, environmentIndex, pageIndex, frameIndex) {
        if (!callouts.length) return '';
        const markerDefs = callouts.map((callout, index) => {
          const markerId = mobileArrowMarkerId(environmentIndex, pageIndex, frameIndex, index);
          return `<marker id="${markerId}" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="${escapeAttribute(callout.color)}"></path></marker>`;
        }).join('');
        const lines = callouts.map((callout, index) => {
          const markerId = mobileArrowMarkerId(environmentIndex, pageIndex, frameIndex, index);
          return `<line x1="${callout.start.x}" y1="${callout.start.y}" x2="${callout.target.x}" y2="${callout.target.y}" stroke="${escapeAttribute(callout.color)}" stroke-width="${callout.arrowWidth}" stroke-linecap="round" vector-effect="non-scaling-stroke" marker-end="url(#${markerId})"></line>`;
        }).join('');
        return `<svg class="mobile-frame-arrows" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs>${markerDefs}</defs>${lines}</svg>`;
      }

      function renderMobileCallout(callout, index) {
        const marker = callout.marker || index + 1;
        return `
          <div class="mobile-callout" style="--callout-color:${escapeAttribute(callout.color)}">
            <span class="mobile-callout-number">${marker}</span>
            <span class="mobile-callout-content">
              ${escapeHTML(callout.text || `Detalhe ${marker}`)}
              ${callout.image ? `<img class="mobile-callout-image" src="${escapeAttribute(callout.image)}" alt="${escapeAttribute(callout.text || `Detalhe ${marker}`)}" loading="lazy">` : ''}
            </span>
          </div>
        `;
      }

      function renderMobileFreeElementCards(elements) {
        if (!Array.isArray(elements) || !elements.length) return '';
        return elements.map((element, index) => {
          if (element?.type === 'image' && element.src) {
            return `
              <div class="mobile-frame-card">
                <div class="mobile-feed-counter">Imagem complementar</div>
                <button class="mobile-frame-media" type="button" data-lightbox-src="${escapeAttribute(element.src)}" data-lightbox-title="Imagem ${index + 1}">
                  <img src="${escapeAttribute(element.src)}" alt="Imagem ${index + 1}" loading="lazy">
                </button>
              </div>
            `;
          }
          const text = String(element?.text || '').trim();
          if (!text) return '';
          return `
            <div class="mobile-frame-card is-note-card">
              <div class="mobile-feed-counter">Observacao</div>
              <div class="mobile-free-text">${escapeHTML(text)}</div>
            </div>
          `;
        }).join('');
      }

      function mobileCalloutFromFrameAnnotation(annotation, annotationIndex) {
        const target = {
          x: clampPercent(annotation.toX, 58),
          y: clampPercent(annotation.toY, 46),
        };
        let start = {
          x: clampPercent(annotation.fromX, 18),
          y: clampPercent(annotation.fromY, 18 + Math.min(annotationIndex * 10, 48)),
        };
        if (mobilePointDistance(start, target) < 8) start = mobileFallbackStart(target, annotationIndex);
        return {
          text: annotation.text || '',
          image: '',
          color: annotation.arrowColor || '#d7c2a7',
          arrowWidth: Math.max(.7, Math.min(2.4, Number(annotation.arrowWidth || 1.2))),
          start,
          target,
        };
      }

      function mobileCalloutFromPageAnnotation(annotation, frame, annotationIndex) {
        const targetPoint = {
          x: Number(annotation.toX ?? annotation.fromX ?? 50),
          y: Number(annotation.toY ?? annotation.fromY ?? 50),
        };
        const sourcePoint = {
          x: Number(annotation.fromX ?? annotation.toX ?? 50),
          y: Number(annotation.fromY ?? annotation.toY ?? 50),
        };
        const target = frame ? mobilePointInFrame(targetPoint, frame) : {
          x: clampPercent(targetPoint.x, 50),
          y: clampPercent(targetPoint.y, 50),
        };
        let start = frame ? mobileSourcePointInFrame(sourcePoint, frame, target, annotationIndex) : mobileFallbackStart(target, annotationIndex);
        if (mobilePointDistance(start, target) < 8) start = mobileFallbackStart(target, annotationIndex);
        return {
          text: annotation.text || '',
          image: isDetailAnnotation(annotation) ? annotation.image || '' : '',
          color: pageAnnotationArrowColor(annotation),
          arrowWidth: Math.max(.7, Math.min(2.4, Number(annotation.arrowWidth || 1.1))),
          start,
          target,
        };
      }

      function nearestMobileFrame(annotation, entries) {
        if (!entries.length) return null;
        const point = {
          x: Number(annotation.toX ?? annotation.fromX ?? 50),
          y: Number(annotation.toY ?? annotation.fromY ?? 50),
        };
        let best = null;
        entries.forEach((entry) => {
          const frame = entry.frame;
          const contains = point.x >= Number(frame.x || 0) - 1
            && point.x <= Number(frame.x || 0) + Number(frame.width || 1) + 1
            && point.y >= Number(frame.y || 0) - 1
            && point.y <= Number(frame.y || 0) + Number(frame.height || 1) + 1;
          const center = {
            x: Number(frame.x || 0) + Number(frame.width || 1) / 2,
            y: Number(frame.y || 0) + Number(frame.height || 1) / 2,
          };
          const distance = Math.hypot(point.x - center.x, point.y - center.y);
          const score = distance + (contains ? -1000 : 0);
          if (!best || score < best.score) best = { entry, frame, score };
        });
        return best;
      }

      function mobilePointInFrame(point, frame) {
        const width = Math.max(1, Number(frame.width || 1));
        const height = Math.max(1, Number(frame.height || 1));
        return {
          x: clampPercent(((Number(point.x || 0) - Number(frame.x || 0)) / width) * 100, 50, 4, 96),
          y: clampPercent(((Number(point.y || 0) - Number(frame.y || 0)) / height) * 100, 50, 4, 96),
        };
      }

      function mobileSourcePointInFrame(point, frame, target, index) {
        const x = Number(point.x || 0);
        const y = Number(point.y || 0);
        const left = Number(frame.x || 0);
        const top = Number(frame.y || 0);
        const right = left + Number(frame.width || 1);
        const bottom = top + Number(frame.height || 1);
        if (x >= left && x <= right && y >= top && y <= bottom) {
          return mobilePointInFrame(point, frame);
        }
        const relativeY = clampPercent(((y - top) / Math.max(1, Number(frame.height || 1))) * 100, target.y, 8, 92);
        const relativeX = clampPercent(((x - left) / Math.max(1, Number(frame.width || 1))) * 100, target.x, 8, 92);
        if (x < left) return { x: 7, y: relativeY };
        if (x > right) return { x: 93, y: relativeY };
        if (y < top) return { x: relativeX, y: 7 };
        if (y > bottom) return { x: relativeX, y: 93 };
        return mobileFallbackStart(target, index);
      }

      function mobileFallbackStart(target, index) {
        const side = index % 4;
        if (side === 0) return { x: target.x < 50 ? 92 : 8, y: clampPercent(target.y - 12, 50, 8, 92) };
        if (side === 1) return { x: target.x < 50 ? 92 : 8, y: clampPercent(target.y + 12, 50, 8, 92) };
        if (side === 2) return { x: clampPercent(target.x - 12, 50, 8, 92), y: target.y < 50 ? 92 : 8 };
        return { x: clampPercent(target.x + 12, 50, 8, 92), y: target.y < 50 ? 92 : 8 };
      }

      function mobilePointDistance(a, b) {
        return Math.hypot(Number(a.x || 0) - Number(b.x || 0), Number(a.y || 0) - Number(b.y || 0));
      }

      function mobileArrowMarkerId(environmentIndex, pageIndex, frameIndex, annotationIndex) {
        return `mobileArrow-${environmentIndex}-${pageIndex}-${frameIndex}-${annotationIndex}`;
      }

      function renderFreeElements(page, environmentIndex, pageIndex) {
        page.freeElements = Array.isArray(page.freeElements) ? page.freeElements : [];
        return page.freeElements.map((element, elementIndex) => {
          const key = freeElementKey(environmentIndex, pageIndex, elementIndex);
          const selected = selectedFreeElementKeys.has(key);
          const type = element.type === 'image' ? 'image' : 'text';
          const style = [
            `left:${Number(element.x ?? 50)}%`,
            `top:${Number(element.y ?? 50)}%`,
            `width:${Number(element.width ?? (type === 'image' ? 22 : 24))}%`,
            `height:${Number(element.height ?? (type === 'image' ? 16 : 8))}%`,
            `--text-color:${escapeAttribute(element.textColor || '#f7f2ea')}`,
            `--text-size:${Number(element.fontSize || 22)}px`,
          ].join(';');
          const imageStyle = `transform:translate(${Number(element.imgX || 0)}%, ${Number(element.imgY || 0)}%) scale(${Number(element.imgScale || 1)})`;
          return `
            <div
              data-free-element="${environmentIndex}-${pageIndex}-${elementIndex}"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-element-index="${elementIndex}"
              class="page-free-element type-${type} ${selected ? 'is-selected' : ''} ${element.cropMode ? 'is-cropping' : ''}"
              style="${style}"
            >
              ${isEditablePreview ? `
                <span class="free-element-toolbar">
                  ${type === 'image' ? `
                    <button type="button" data-free-crop-toggle data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-element-index="${elementIndex}">${element.cropMode ? 'Concluir' : 'Recortar'}</button>
                    <input type="range" min="1" max="3" step="0.05" value="${Number(element.imgScale || 1)}" data-free-crop-zoom data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-element-index="${elementIndex}">
                  ` : `
                    <button type="button" data-free-crop-toggle data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-element-index="${elementIndex}">Texto</button>
                  `}
                </span>
              ` : ''}
              ${type === 'image'
                ? `<img src="${escapeAttribute(element.src || fallbackImage)}" alt="Imagem colada" draggable="false" style="${imageStyle}">`
                : `${escapeHTML(element.text || 'Texto')}`}
            </div>
          `;
        }).join('');
      }

      function renderPageAnnotations(page, environmentIndex, pageIndex) {
        page.annotations = Array.isArray(page.annotations) ? page.annotations : [];
        return `
          ${page.annotations.map((annotation, annotationIndex) => {
            const zIndex = 30 + annotationIndex;
            return `
            <span
              data-page-annotation-line="${environmentIndex}-${pageIndex}-${annotationIndex}"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-annotation-index="${annotationIndex}"
              class="page-annotation-line ${selectedPageAnnotationKeys.has(pageAnnotationKey(environmentIndex, pageIndex, annotationIndex)) ? 'is-selected' : ''}"
              style="left:${Number(annotation.fromX ?? 30)}%;top:${Number(annotation.fromY ?? 30)}%;z-index:${zIndex};--arrow-color:${escapeAttribute(pageAnnotationArrowColor(annotation))};--arrow-width:${Number(annotation.arrowWidth ?? 0.9)};--arrow-width-px:${Number(annotation.arrowWidth ?? 0.9)}px;--arrow-angle:${pageAnnotationAngle(annotation)}deg"
            ></span>
          `;
          }).join('')}
          ${page.annotations.map((annotation, annotationIndex) => {
            const zIndex = 30 + annotationIndex;
            return `
            <span
              data-page-annotation-arrow-head="${environmentIndex}-${pageIndex}-${annotationIndex}"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-annotation-index="${annotationIndex}"
              class="page-annotation-arrow-head"
              style="left:${Number(annotation.toX ?? 20)}%;top:${Number(annotation.toY ?? 20)}%;z-index:${zIndex};--arrow-color:${escapeAttribute(pageAnnotationArrowColor(annotation))};--arrow-angle:${pageAnnotationAngle(annotation)}deg"
            ></span>
          `;
          }).join('')}
          ${page.annotations.map((annotation, annotationIndex) => {
            const zIndex = 30 + annotationIndex;
            const annotationId = `${environmentIndex}-${pageIndex}-${annotationIndex}`;
            const detail = isDetailAnnotation(annotation);
            const detailShape = pageDetailShape(annotation);
            const detailSize = pageDetailSize(annotation);
            const detailHeight = Math.max(6, Math.min(44, Number(annotation.detailHeight ?? detailSize)));
            const detailImageStyle = `transform:translate(${Number(annotation.imgX || 0)}%, ${Number(annotation.imgY || 0)}%) scale(${Number(annotation.imgScale || 1)})`;
            const detailHandles = isEditablePreview
              ? ['nw','n','ne','e','se','s','sw','w'].map(handle => `<span class="frame-resize-handle" data-resize-detail="${handle}"></span>`).join('')
              : '';
            return `
            ${!detail ? `<span
              data-page-annotation-toolbar
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-annotation-index="${annotationIndex}"
              class="page-annotation-toolbar"
              style="left:${Number(annotation.fromX ?? 30)}%;top:${Number(annotation.fromY ?? 30)}%;z-index:${zIndex + 15}"
            >
                <input type="color" title="Cor do texto" value="${escapeAttribute(pageAnnotationTextColor(annotation))}" data-page-annotation-style="textColor" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">
                <input type="color" title="Cor da seta" value="${escapeAttribute(pageAnnotationArrowColor(annotation))}" data-page-annotation-style="arrowColor" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">
                <input type="number" min="9" max="32" step="1" title="Fonte" value="${Number(annotation.fontSize ?? 15)}" data-page-annotation-style="fontSize" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">
                <input type="number" min="0.4" max="2.5" step="0.1" title="Seta" value="${Number(annotation.arrowWidth ?? 0.9)}" data-page-annotation-style="arrowWidth" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">
                <button type="button" class="${annotation.textShadow !== 'none' ? 'active' : ''}" data-page-annotation-toggle="textShadow" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">Sombra</button>
                <button type="button" class="${annotation.textBorder ? 'active' : ''}" data-page-annotation-toggle="textBorder" data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-annotation-index="${annotationIndex}">Borda</button>
            </span>` : ''}
            ${isEditablePreview ? `<span
              data-page-annotation-tail="${environmentIndex}-${pageIndex}-${annotationIndex}"
              data-drag-page-annotation="text"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-annotation-index="${annotationIndex}"
              class="page-arrow-point ${selectedPageAnnotationKeys.has(pageAnnotationKey(environmentIndex, pageIndex, annotationIndex)) ? 'is-selected' : ''}"
              style="left:${Number(annotation.fromX ?? 30)}%;top:${Number(annotation.fromY ?? 30)}%;z-index:${zIndex + 20}"
            ></span>` : ''}
            ${detail ? `
              <span
                data-page-detail-frame="${annotationId}"
                data-drag-page-annotation="text"
                data-environment-index="${environmentIndex}"
                data-page-index="${pageIndex}"
                data-annotation-index="${annotationIndex}"
                class="page-detail-frame shape-${escapeAttribute(detailShape)} ${selectedPageAnnotationKeys.has(pageAnnotationKey(environmentIndex, pageIndex, annotationIndex)) ? 'is-selected' : ''} ${annotation.editImage ? 'is-editing-image' : ''}"
                style="left:${Number(annotation.fromX ?? 30)}%;top:${Number(annotation.fromY ?? 30)}%;z-index:${zIndex + 20};--detail-width:${detailSize}%;--detail-height:${detailHeight}%;--detail-border-color:${escapeAttribute(annotation.detailBorderColor || pageAnnotationArrowColor(annotation))};--detail-border-width:${Number(annotation.detailBorderWidth ?? 1.2)}px"
              >
                <span class="page-detail-clip">
                  ${annotation.image ? `<img src="${escapeAttribute(annotation.image)}" alt="Detalhe" draggable="false" style="${detailImageStyle}">` : '<span class="page-detail-placeholder">Imagem do detalhe</span>'}
                </span>
                ${detailHandles}
              </span>
            ` : `
              <span
                data-page-annotation-text="${environmentIndex}-${pageIndex}-${annotationIndex}"
                data-environment-index="${environmentIndex}"
                data-page-index="${pageIndex}"
                data-annotation-index="${annotationIndex}"
                class="page-annotation-text"
                contenteditable="${isEditablePreview ? 'true' : 'false'}"
                style="left:${Number(annotation.fromX ?? 30)}%;top:${Number(annotation.fromY ?? 30)}%;z-index:${zIndex + 20};${pageAnnotationTextPlacementStyle(annotation)};--text-color:${escapeAttribute(pageAnnotationTextColor(annotation))};--text-size:${Number(annotation.fontSize ?? 15)}px;--text-shadow:${annotation.textShadow === 'none' ? 'none' : '0 1px 4px rgba(0,0,0,.65)'};--text-stroke:${annotation.textBorder ? `.35px ${escapeAttribute(pageAnnotationArrowColor(annotation))}` : '0 transparent'}"
              >${escapeHTML(annotation.text || 'Texto da seta')}</span>
            `}
            ${isEditablePreview ? `<span
              data-page-annotation-head="${environmentIndex}-${pageIndex}-${annotationIndex}"
              data-drag-page-annotation="head"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-annotation-index="${annotationIndex}"
              class="page-arrow-point ${selectedPageAnnotationKeys.has(pageAnnotationKey(environmentIndex, pageIndex, annotationIndex)) ? 'is-selected' : ''}"
              style="left:${Number(annotation.toX ?? 20)}%;top:${Number(annotation.toY ?? 20)}%;z-index:${zIndex + 20}"
            ></span>` : ''}
          `;
          }).join('')}
        `;
      }

      function normalizeFrames(page) {
        if (Array.isArray(page.frames) && page.frames.length) {
          page.frames.forEach((frame, index) => {
            frame.id ||= `frame-${Date.now()}-${Math.random().toString(16).slice(2, 7)}`;
            frame.title ||= `Moldura ${index + 1}`;
            frame.photo ||= frame.photos?.[0]?.src || '';
            frame.shape = supportedFrameShapes().includes(frame.shape || frame.frameType)
              ? (frame.shape || frame.frameType)
              : 'square';
            frame.frameType = frame.shape;
            normalizeFrameAnnotations(frame);
            applyFrameLayout(frame, index);
          });
          return page.frames;
        }
        return [];
      }

      function normalizeFrameAnnotations(frame) {
        frame.annotations = Array.isArray(frame?.annotations) ? frame.annotations : [];
        frame.annotations = frame.annotations.filter(annotation => annotation && typeof annotation === 'object');
        frame.annotations.forEach((annotation, index) => {
          annotation.text ||= '';
          annotation.fromX = clampPercent(annotation.fromX, 18, 0, 100);
          annotation.fromY = clampPercent(annotation.fromY, 18 + Math.min(index * 10, 48), 0, 100);
          annotation.toX = clampPercent(annotation.toX, 58, 0, 100);
          annotation.toY = clampPercent(annotation.toY, 46, 0, 100);
          annotation.arrowColor ||= '#d7c2a7';
          annotation.textColor ||= '#f7f2ea';
          annotation.fontSize = clampPercent(annotation.fontSize, 17, 8, 42);
          annotation.arrowWidth = clampPercent(annotation.arrowWidth, 1.2, .4, 8);
        });
        return frame.annotations;
      }

      function renderDocumentFrame(frame, page, frameIndex, environmentIndex, pageIndex) {
        applyFrameLayout(frame, frameIndex);
        const annotations = normalizeFrameAnnotations(frame);
        const hasPhoto = Boolean(frame.photo);
        const shape = supportedFrameShapes().includes(frame.shape) ? frame.shape : 'square';
        const frameStyle = `left:${Number(frame.x)}%;top:${Number(frame.y)}%;width:${Number(frame.width)}%;height:${Number(frame.height)}%`;
        const imageStyle = `transform:translate(${Number(frame.imgX || 0)}%, ${Number(frame.imgY || 0)}%) scale(${Number(frame.imgScale || 1)})`;
        const handles = ['nw','n','ne','e','se','s','sw','w'].map(handle => `<span class="frame-resize-handle" data-resize-frame="${handle}"></span>`).join('');
        return `
          <div
            class="doc-photo-frame is-positioned shape-${escapeAttribute(shape)} ${frame.editImage ? 'is-editing-image' : ''}"
            style="${frameStyle}"
            ${isEditablePreview ? `data-draggable-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}"` : ''}
          >
            <div class="frame-clip">
              ${hasPhoto ? `<img src="${escapeAttribute(frame.photo)}" alt="${escapeAttribute(frame.title || page.title)}" draggable="false" data-photo-src="${escapeAttribute(frame.photo)}" data-editable-frame-image style="${imageStyle}" />` : '<span class="doc-frame-empty">Moldura sem foto</span>'}
              ${isEditablePreview ? '<span class="drop-hint">Solte a foto aqui</span>' : ''}
            </div>
            ${renderFrameAnnotations(annotations, environmentIndex, pageIndex, frameIndex)}
            ${isEditablePreview ? `
              <span class="frame-selection-toolbar">
                <button type="button" data-copy-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">Copiar</button>
                <button type="button" data-paste-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">Colar</button>
                <button type="button" data-duplicate-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">Duplicar</button>
                <button type="button" data-edit-image data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">${frame.editImage ? 'Mover moldura' : 'Editar foto'}</button>
                <label>Zoom <input type="range" min="1" max="3" step="0.05" value="${Number(frame.imgScale || 1)}" data-image-zoom data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}"></label>
                <button type="button" data-delete-frame data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">Excluir</button>
                <button type="button" data-open-frame-menu data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">...</button>
              </span>
              ${handles}
            ` : ''}
          </div>
        `;
      }

      function renderFrameAnnotations(annotations, environmentIndex, pageIndex, frameIndex) {
        if (!annotations.length) return '';
        const defs = annotations.map((annotation, annotationIndex) => {
          const markerId = frameArrowMarkerId(environmentIndex, pageIndex, frameIndex, annotationIndex);
          const color = annotation.arrowColor || '#d7c2a7';
          return `<marker id="${markerId}" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="${escapeAttribute(color)}"></path></marker>`;
        }).join('');
        const lines = annotations.map((annotation, annotationIndex) => {
          const id = `${environmentIndex}-${pageIndex}-${frameIndex}-${annotationIndex}`;
          const markerId = frameArrowMarkerId(environmentIndex, pageIndex, frameIndex, annotationIndex);
          return `<line
            data-annotation-line="${id}"
            class="doc-annotation-line"
            x1="${Number(annotation.fromX)}%"
            y1="${Number(annotation.fromY)}%"
            x2="${Number(annotation.toX)}%"
            y2="${Number(annotation.toY)}%"
            style="--arrow-color:${escapeAttribute(annotation.arrowColor || '#d7c2a7')};--arrow-width-px:${Number(annotation.arrowWidth || 1.2)}px"
            marker-end="url(#${markerId})"
          ></line>`;
        }).join('');
        const labels = annotations.map((annotation, annotationIndex) => {
          const id = `${environmentIndex}-${pageIndex}-${frameIndex}-${annotationIndex}`;
          return `
            <span
              data-annotation-label="${id}"
              data-drag-annotation="label"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-frame-index="${frameIndex}"
              data-annotation-index="${annotationIndex}"
              class="doc-annotation-text ${selectedFrameKeys.has(frameKey(environmentIndex, pageIndex, frameIndex)) ? 'is-selected' : ''}"
              style="left:${Number(annotation.fromX)}%;top:${Number(annotation.fromY)}%;--text-color:${escapeAttribute(annotation.textColor || '#f7f2ea')};--text-size:${Number(annotation.fontSize || 17)}px;transform:translate(-50%,-50%)"
            >${escapeHTML(annotation.text || 'Texto da seta')}</span>
            ${isEditablePreview ? `<span
              data-annotation-target="${id}"
              data-drag-annotation="target"
              data-environment-index="${environmentIndex}"
              data-page-index="${pageIndex}"
              data-frame-index="${frameIndex}"
              data-annotation-index="${annotationIndex}"
              class="frame-arrow-target"
              style="left:${Number(annotation.toX)}%;top:${Number(annotation.toY)}%"
            ></span>` : ''}
          `;
        }).join('');
        return `<svg class="doc-annotation-layer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs>${defs}</defs>${lines}</svg>${labels}`;
      }

      function frameArrowMarkerId(environmentIndex, pageIndex, frameIndex, annotationIndex) {
        return `frameArrow-${environmentIndex}-${pageIndex}-${frameIndex}-${annotationIndex}`;
      }

      function renderFramePreviewTools(frame, environmentIndex, pageIndex, frameIndex) {
        return `
          <div class="preview-frame-tools">
            <label>
              Foto
              <input type="file" accept="image/*" data-frame-photo-input data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">
            </label>
            <select class="shape-select" data-frame-shape data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">
              <option value="square" ${frame.shape === 'square' ? 'selected' : ''}>Quadrado</option>
              <option value="circle" ${frame.shape === 'circle' ? 'selected' : ''}>C&iacute;rculo</option>
            </select>
            <button type="button" data-add-annotation data-environment-index="${environmentIndex}" data-page-index="${pageIndex}" data-frame-index="${frameIndex}">Seta</button>
          </div>
        `;
      }
      function renderSpec(title, value) {
        if (!value) return '';
        return `
          <div class="spec-group">
            <span class="spec-title">${title}</span>
            <div class="spec-value">${escapeHTML(value)}</div>
          </div>
        `;
      }

      function normalizePhotos(photos) {
        const list = photos && photos.length ? photos : [{ label: '', src: fallbackImage }];
        return list.map((photo) => ({
          label: photo.label || '',
          title: photo.label || '',
          src: photo.src || fallbackImage,
        }));
      }

      function layoutSuggestions(count) {
        if (count <= 1) return [{ key: 'single', label: 'Imagem unica' }];
        if (count === 2) return [
          { key: 'balanced', label: 'Meio a meio' },
          { key: 'editorial', label: 'Editorial' },
        ];
        if (count === 3) return [
          { key: 'balanced', label: '1 maior + 2 apoio' },
          { key: 'top-heavy', label: '3 alinhadas' },
          { key: 'editorial', label: 'Editorial' },
        ];
        if (count === 4) return [
          { key: 'balanced', label: 'Grade 2x2' },
          { key: 'editorial', label: 'Imagem destaque' },
        ];
        if (count === 5) return [
          { key: 'top-heavy', label: '3 em cima / 2 embaixo' },
          { key: 'bottom-heavy', label: '2 em cima / 3 embaixo' },
          { key: 'editorial', label: 'Editorial' },
        ];
        return [
          { key: 'balanced', label: 'Grade fluida' },
          { key: 'top-heavy', label: 'Ritmo horizontal' },
          { key: 'editorial', label: 'Editorial' },
        ];
      }

      function suggestDefaultLayout(count) {
        if (count === 1) return 'single';
        if (count === 5) return 'top-heavy';
        return 'balanced';
      }

      function normalizeMuralLayout(layout, count) {
        return count > 1 && layout === 'single' ? suggestDefaultLayout(count) : (layout || suggestDefaultLayout(count));
      }

      function tileClass(index, count, layout) {
        if (count === 1 || layout === 'single') return 'tile-full';
        if (count === 2 && layout !== 'editorial') return 'tile-half';

        if (layout === 'top-heavy') {
          if (count === 5) return index < 3 ? 'tile-third' : 'tile-half';
          return 'tile-third';
        }

        if (layout === 'bottom-heavy') {
          if (count === 5) return index < 2 ? 'tile-half' : 'tile-third';
          return index % 5 < 2 ? 'tile-half' : 'tile-third';
        }

        if (layout === 'editorial') {
          if (index % 6 === 0) return 'tile-hero';
          if (index % 6 === 1) return 'tile-tall';
          if (index % 6 === 2) return 'tile-wide';
          return 'tile-small';
        }

        if (count === 3) return index === 0 ? 'tile-hero' : 'tile-small';
        if (count === 4) return 'tile-half';
        if (count === 5) return index < 2 ? 'tile-half' : 'tile-third';
        return index % 5 < 2 ? 'tile-half' : 'tile-third';
      }

      async function readPhoto(file, index) {
        return {
          title: '',
          label: '',
          src: await fileToWebpDataUrl(file),
        };
      }

      async function fileToWebpDataUrl(file) {
        const fallback = () => readBlobAsDataURL(file);
        if (!file || !String(file.type || '').startsWith('image/')) return fallback();
        if (typeof document === 'undefined') return fallback();
        const image = await loadImageForOptimization(file).catch(() => null);
        if (!image) return fallback();
        const maxSize = 1920;
        const quality = 0.82;
        const scale = Math.min(1, maxSize / Math.max(image.width || 1, image.height || 1));
        const width = Math.max(1, Math.round((image.width || 1) * scale));
        const height = Math.max(1, Math.round((image.height || 1) * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d');
        if (!context) {
          image.close?.();
          return fallback();
        }
        context.drawImage(image, 0, 0, width, height);
        image.close?.();
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', quality));
        return blob && blob.type === 'image/webp' ? readBlobAsDataURL(blob) : fallback();
      }

      function readBlobAsDataURL(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      async function loadImageForOptimization(file) {
        if (typeof createImageBitmap !== 'undefined') {
          const bitmap = await createImageBitmap(file).catch(() => null);
          if (bitmap) return bitmap;
        }
        if (typeof Image === 'undefined' || typeof URL === 'undefined') return null;
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const image = new Image();
          image.onload = () => {
            image.close = () => URL.revokeObjectURL(url);
            resolve(image);
          };
          image.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('Nao foi possivel otimizar a imagem.'));
          };
          image.src = url;
        });
      }

      function isDefaultEnvironmentPhoto(photo) {
        const src = String(photo?.src || '');
        const title = String(photo?.title || '').toLowerCase();
        return !src
          || src === fallbackImage
          || (src.startsWith('data:image/svg+xml') && (src.includes('AMBIENTE') || src.includes('IMAGEM%20DO%20AMBIENTE')))
          || (title.includes('imagem do ambiente') && src.startsWith('data:image/svg+xml'));
      }

      function persistAndRender(action = 'portfolio_sync') {
        safePersistDocument();
        rememberDocumentHistory();
        postPortfolioSync(action);
        renderDocument();
      }

      function persistWithoutRender(action = 'portfolio_sync') {
        safePersistDocument();
        rememberDocumentHistory();
        postPortfolioSync(action);
      }

      function safePersistDocument() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(documentData));
        } catch (error) {
          console.warn('Nao foi possivel salvar o documento completo no armazenamento local. A edicao visual continua ativa.', error);
        }
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.classList.remove('lightbox-open');
        lightboxImage.removeAttribute('src');
      }

      function slug(value) {
        return String(value || 'ambiente')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/(^-|-$)/g, '');
      }

      function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        }[char]));
      }

      function escapeAttribute(value) {
        return escapeHTML(value).replace(/`/g, '&#96;');
      }
    </script>
  </body>
</html>
